<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacity Connect - Create Account</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#00236f',
              dark: '#001952',
              light: '#1e3a8a',
              subtle: '#eff4ff',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col justify-between font-sans relative overflow-x-hidden">
  <!-- Subtle Office / Workspace Blurred Backdrop -->
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-100 via-slate-100 to-slate-200 -z-10"></div>
  <div class="fixed inset-0 backdrop-blur-3xl -z-10"></div>

  <!-- Top Navigation Bar -->
  <header class="w-full py-3 px-6 flex items-center justify-between border-b border-slate-200/60 bg-white/40 backdrop-blur-sm z-10">
    <a href="index.html" class="flex items-center gap-2 text-brand font-bold text-lg tracking-tight">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white shadow-sm shadow-brand/20">
        <span class="material-symbols-outlined text-lg">account_tree</span>
      </div>
      <span>Capacity Connect</span>
    </a>
    <div class="flex items-center gap-3 text-xs">
      <a href="login.html" class="text-slate-600 hover:text-brand font-medium flex items-center gap-1 transition">
        <span class="material-symbols-outlined text-base">login</span>
        <span>Sign In</span>
      </a>
    </div>
  </header>

  <!-- Create Account Card -->
  <main class="flex-1 flex items-center justify-center p-6 my-auto">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-white/60 p-8 sm:p-10">
      <div class="flex flex-col items-center text-center mb-6">
        <div class="flex items-center gap-2 text-brand font-bold text-2xl tracking-tight mb-1">
          <span class="material-symbols-outlined text-3xl">trending_up</span>
          <span>Capacity Connect</span>
        </div>
        <p class="text-sm text-slate-500">Create your account</p>
      </div>

      <form action="employee-dashboard.html" method="GET" class="space-y-4">
        <div>
          <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
            <input
              type="text"
              id="name"
              required
              placeholder="Jane Doe"
              class="w-full pl-11 pr-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand text-sm"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
            <input
              type="email"
              id="email"
              required
              placeholder="jane@example.com"
              class="w-full pl-11 pr-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand text-sm"
            />
          </div>
        </div>

        <div>
          <label for="new-pass" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
            <input
              type="password"
              id="new-pass"
              required
              placeholder="••••••••"
              class="w-full pl-11 pr-11 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand text-sm"
            />
            <button
              type="button"
              onclick="const p = document.getElementById('new-pass'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.textContent = isPass ? 'visibility_off' : 'visibility';"
              class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xl cursor-pointer"
            >
              visibility
            </button>
          </div>
        </div>

        <div>
          <label for="confirm-pass" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
            <input
              type="password"
              id="confirm-pass"
              required
              placeholder="••••••••"
              class="w-full pl-11 pr-11 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand text-sm"
            />
            <button
              type="button"
              onclick="const p = document.getElementById('confirm-pass'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.textContent = isPass ? 'visibility_off' : 'visibility';"
              class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xl cursor-pointer"
            >
              visibility
            </button>
          </div>
        </div>

        <div class="flex items-start gap-2.5 pt-1">
          <input
            type="checkbox"
            id="terms"
            required
            class="mt-1 rounded border-slate-300 text-brand focus:ring-brand cursor-pointer"
          />
          <label for="terms" class="text-xs text-slate-500 leading-snug cursor-pointer">
            I agree to the <a href="#" class="text-brand hover:underline font-medium">Terms of Service</a> and <a href="#" class="text-brand hover:underline font-medium">Privacy Policy</a>.
          </label>
        </div>

        <button
          type="submit"
          class="w-full py-3 rounded-lg bg-brand hover:bg-brand-dark text-white text-sm font-semibold shadow-md shadow-brand/20 transition cursor-pointer active:scale-[0.99]"
        >
          Create Account
        </button>

        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white/90 px-3 text-xs text-slate-400 uppercase tracking-wider">Already have an account?</span>
        </div>

        <a href="login.html" class="block text-center text-sm font-semibold text-brand hover:underline">
          Sign in instead
        </a>
      </form>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer class="w-full py-4 px-6 text-center text-xs text-slate-500 border-t border-slate-200/50 bg-white/40 backdrop-blur-sm">
    <div class="flex flex-wrap items-center justify-center gap-4">
      <span>© 2025 Capacity Connect. All rights reserved.</span>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Privacy Policy</a>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Terms of Service</a>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Help Center</a>
    </div>
  </footer>
</body>
</html>
