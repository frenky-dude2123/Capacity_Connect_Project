<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacity Connect - Password Reset Successful</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#00236f',
              dark: '#001952',
              light: '#1e3a8a',
              subtle: '#eff4ff',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col justify-between font-sans relative overflow-x-hidden">
  <!-- Subtle Office / Workspace Blurred Backdrop -->
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-100 via-slate-100 to-slate-200 -z-10"></div>
  <div class="fixed inset-0 backdrop-blur-3xl -z-10"></div>

  <!-- Top Navigation Bar -->
  <header class="w-full py-3 px-6 flex items-center justify-between border-b border-slate-200/60 bg-white/40 backdrop-blur-sm z-10">
    <a href="index.html" class="flex items-center gap-2 text-brand font-bold text-lg tracking-tight">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white shadow-sm shadow-brand/20">
        <span class="material-symbols-outlined text-lg">account_tree</span>
      </div>
      <span>Capacity Connect</span>
    </a>
    <a href="login.html" class="text-xs text-slate-600 hover:text-brand font-medium flex items-center gap-1 transition">
      <span class="material-symbols-outlined text-base">login</span>
      <span>Sign In</span>
    </a>
  </header>

  <!-- Reset Success Card -->
  <main class="flex-1 flex items-center justify-center p-6 my-auto">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-white/60 p-8 sm:p-10 text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-5 ring-8 ring-emerald-50/50">
        <span class="material-symbols-outlined text-3xl">check_circle</span>
      </div>
      <h1 class="text-2xl font-bold text-brand mb-2 tracking-tight">Password Reset Successful</h1>
      <p class="text-sm text-slate-500 mb-8 leading-relaxed">
        Your password has been successfully updated. You can now sign in with your new credentials.
      </p>

      <a
        href="login.html"
        class="w-full flex items-center justify-center gap-2 py-3 rounded-lg bg-brand hover:bg-brand-dark text-white text-sm font-semibold shadow-md shadow-brand/20 transition cursor-pointer"
      >
        <span>Sign In</span>
        <span class="material-symbols-outlined text-sm">login</span>
      </a>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer class="w-full py-4 px-6 text-center text-xs text-slate-500 border-t border-slate-200/50 bg-white/40 backdrop-blur-sm">
    <div class="flex flex-wrap items-center justify-center gap-4">
      <span>© 2025 Capacity Connect. All rights reserved.</span>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Privacy Policy</a>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Terms of Service</a>
      <span>•</span>
      <a href="#" class="hover:text-brand hover:underline">Help Center</a>
    </div>
  </footer>
</body>
</html>
