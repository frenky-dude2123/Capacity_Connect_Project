<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacity Connect - Stitch Platform Suite</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // Dynamic API origin: works seamlessly on localhost, Wi-Fi IP (10.17.93.15), and public tunnel domains
    const API_BASE = window.location.protocol.startsWith('http')
      ? `${window.location.origin}/api`
      : 'http://localhost:5000/api';

    // ==========================================
    // SCREEN 1: AUTHENTICATION
    // ==========================================
    function Screen1Auth({ onAuthSuccess, onNavigate }) {
      const [isLogin, setIsLogin] = React.useState(true);
      const [email, setEmail] = React.useState('jane.doe@enterprise.com');
      const [password, setPassword] = React.useState('password123');
      const [name, setName] = React.useState('Jane Doe');
      const [role, setRole] = React.useState('learner');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [authData, setAuthData] = React.useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        setAuthData(null);
        try {
          const endpoint = isLogin ? `${API_BASE}/auth/login` : `${API_BASE}/auth/signup`;
          const payload = isLogin ? { email, password } : { name, email, password, role };
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Request failed');
          setAuthData(data);
          if (onAuthSuccess) onAuthSuccess(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-8">
          <div className="text-center mb-6">
            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-900">
              Topic 1 • Screen 1 (Auth)
            </span>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">
              {isLogin ? 'Sign In to Capacity Connect' : 'Create Enterprise Account'}
            </h1>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <div className="flex bg-slate-100 p-1 rounded-xl mb-6 text-xs font-bold">
              <button onClick={() => setIsLogin(true)} className={`flex-1 py-2 rounded-lg ${isLogin ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-500'}`}>Sign In</button>
              <button onClick={() => setIsLogin(false)} className={`flex-1 py-2 rounded-lg ${!isLogin ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-500'}`}>Sign Up</button>
            </div>

            <div className="mb-4 p-3 bg-slate-50 rounded-xl flex gap-2">
              <button onClick={() => { setEmail('jane.doe@enterprise.com'); setPassword('password123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white border border-slate-200 rounded-lg text-slate-700">👤 Learner Demo</button>
              <button onClick={() => { setEmail('admin@capacityconnect.io'); setPassword('admin123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white border border-slate-200 rounded-lg text-purple-800">🛡️ Admin Demo</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <input type="text" required placeholder="Full Name" value={name} onChange={e => setName(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 text-sm" />
              )}
              <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 text-sm" />
              <input type="password" required placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 text-sm" />
              {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}
              <button type="submit" disabled={loading} className="w-full py-2.5 bg-blue-900 text-white rounded-xl text-xs font-bold shadow-md">
                {loading ? 'Submitting...' : isLogin ? 'Sign In' : 'Sign Up'}
              </button>
            </form>

            {authData && (
              <div className="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-900 space-y-2">
                <p className="font-bold">✓ Logged in as {authData.user?.name} ({authData.user?.role})</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => onNavigate(2)} className="flex-1 py-1.5 bg-blue-900 text-white rounded font-bold">Go to Dashboard (Screen 2)</button>
                  {authData.user?.role === 'admin' && (
                    <button onClick={() => onNavigate(7)} className="flex-1 py-1.5 bg-purple-900 text-white rounded font-bold">Admin Suite (Screen 7)</button>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 2: LEARNER DASHBOARD
    // ==========================================
    function Screen2Dashboard({ userId, onOpenCourse, onOpenCert, onOpenCatalog }) {
      const [dash, setDash] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [aiRecs, setAiRecs] = React.useState(null);
      const [aiLoading, setAiLoading] = React.useState(false);
      const [aiError, setAiError] = React.useState(null);

      React.useEffect(() => {
        fetch(`${API_BASE}/user/dashboard/${userId}`)
          .then(r => r.json())
          .then(setDash)
          .finally(() => setLoading(false));
      }, [userId]);

      const fetchAIRecommendations = async () => {
        setAiLoading(true);
        setAiError(null);
        try {
          const weakAreas = [
            { topic: 'Security & Compliance', score: 45, courseId: 2 },
            { topic: 'Distributed Systems', score: 60, courseId: 3 },
            { topic: 'Cloud Architecture', score: 68, courseId: 1 }
          ];
          const res = await fetch(`${API_BASE}/ai/recommendations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, weakAreas, numRecommendations: 3 })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'AI recommendations failed');
          setAiRecs(data);
        } catch (err) {
          setAiError(err.message);
        } finally {
          setAiLoading(false);
        }
      };

      if (loading) return <div className="py-20 text-center text-sm text-slate-500">Loading Learner Dashboard...</div>;

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
          <div className="flex justify-between items-center pb-6 border-b border-slate-200">
            <div>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-900">Topic 2 • Screen 2</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Learner Dashboard: {dash?.userName}</h1>
            </div>
            <button onClick={onOpenCatalog} className="px-4 py-2 bg-blue-900 text-white rounded-xl text-xs font-bold shadow-sm">
              Explore Catalog (Page 3) →
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Capacity Readiness</span>
              <p className="text-3xl font-extrabold text-blue-900 mt-1">{dash?.metrics?.capacityScore}%</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Active Courses</span>
              <p className="text-3xl font-extrabold text-slate-900 mt-1">{dash?.metrics?.activeCourses}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Training Hours</span>
              <p className="text-3xl font-extrabold text-slate-900 mt-1">{dash?.metrics?.trainingHours}h</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Certificates</span>
              <p className="text-3xl font-extrabold text-emerald-600 mt-1">{dash?.metrics?.completedCertifications}</p>
            </div>
          </div>

          <div className="space-y-4">
            <h2 className="text-lg font-bold text-slate-900">Enrolled Engineering Pathways</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {dash?.enrolledCourses?.map(c => (
                <div key={c.id} className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col justify-between">
                  <div>
                    <span className="text-[10px] font-bold bg-blue-50 text-blue-900 px-2 py-0.5 rounded">{c.category}</span>
                    <h3 className="text-base font-bold text-slate-900 mt-2">{c.title}</h3>
                    <div className="mt-4">
                      <div className="flex justify-between text-xs text-slate-600 font-semibold mb-1">
                        <span>Progress</span><span>{c.progressPercent}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div className="bg-blue-900 h-2 rounded-full" style={{ width: `${c.progressPercent}%` }}></div>
                      </div>
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-slate-100 flex gap-2">
                    <button onClick={() => onOpenCourse(c.id)} className="flex-1 py-2 bg-blue-900 text-white rounded-lg text-xs font-bold">Resume ▶</button>
                    <button onClick={() => onOpenCert(c.id)} className="px-3 py-2 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg text-xs font-bold">🎓 Cert</button>
                  </div>
                </div>
              ))}
            </div>
          </div>

           {/* AI Course Recommendations (Topic 9) */}
           <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
             <div className="flex items-center justify-between mb-4">
               <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                 <span className="text-indigo-600">🤖 AI Recommendations</span>
               </h3>
               <button
                 onClick={fetchAIRecommendations}
                 disabled={aiLoading}
                 className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                   aiLoading
                     ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                     : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                 }`}
               >
                 {aiLoading ? 'Generating...' : aiRecs ? 'Refresh AI Recs' : 'Generate with AI'}
               </button>
             </div>

             {aiLoading && (
               <div className="py-10 text-center">
                 <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                 <p className="text-sm text-slate-600">AI analyzing weak areas and generating personalized recommendations...</p>
               </div>
             )}

             {aiError && !aiLoading && (
               <p className="text-xs text-amber-600 font-semibold">Using sample data: {aiError}</p>
             )}

             {!aiLoading && aiRecs && (
               <div className="space-y-3">
                 <p className={`text-xs font-semibold ${aiRecs.source === 'ai' ? 'text-emerald-600' : 'text-amber-600'}`}>
                   {aiRecs.source === 'ai' ? 'Powered by Gemini LLM' : 'Using sample recommendations'}
                 </p>
                 <p className="text-xs text-slate-500">{aiRecs.summary}</p>
                 <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                   {aiRecs.recommendations?.map((rec) => (
                     <div key={rec.courseId} className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100">
                       <div className="flex items-center gap-2 mb-2">
                         <span className="px-2 py-0.5 bg-blue-100 text-blue-800 text-[10px] font-bold rounded">{rec.category}</span>
                         <span className="px-2 py-0.5 bg-slate-200 text-slate-700 text-[10px] font-bold rounded">{rec.difficulty}</span>
                       </div>
                       <h4 className="text-sm font-bold text-slate-900 mb-1">{rec.title}</h4>
                       <p className="text-xs text-slate-600 mb-2">{rec.reason}</p>
                     </div>
                   ))}
                 </div>
               </div>
             )}

             {!aiLoading && !aiRecs && !aiError && (
               <p className="text-xs text-slate-500">Click "Generate with AI" to get personalized recommendations based on your weak quiz areas.</p>
             )}
           </div>
         </div>
      );
    }

    // ==========================================
    // SCREEN 6: CERTIFICATE
    // ==========================================
    function Screen6Certificate({ userId, courseId, onBack }) {
      const [cert, setCert] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetch(`${API_BASE}/certificate/${userId}/${courseId}`)
          .then(r => r.json())
          .then(setCert)
          .finally(() => setLoading(false));
      }, [userId, courseId]);

      if (loading) return <div className="py-20 text-center text-sm text-slate-500">Generating digital certificate...</div>;

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-semibold bg-white border border-slate-200 px-3 py-1.5 rounded-lg">← Back to Dashboard</button>
          <div className="bg-white rounded-3xl border-8 border-slate-100 shadow-xl p-8 sm:p-12 text-center">
            <div className="w-14 h-14 bg-blue-900 text-white mx-auto flex items-center justify-center text-xl rounded-2xl mb-4">🎓</div>
            <p className="text-xs font-bold uppercase tracking-widest text-slate-400">Capacity Connect Accreditation</p>
            <h1 className="text-3xl font-serif font-bold text-slate-900 mt-2">Certificate of Completion</h1>
            <p className="text-xs text-slate-500 mt-2">This is proudly awarded to</p>
            <h2 className="text-2xl font-bold text-blue-950 mt-1 underline decoration-blue-300 underline-offset-4">{cert?.studentName}</h2>
            <div className="my-5 p-3 rounded-xl bg-slate-50 border border-slate-200 inline-block max-w-lg">
              <p className="font-bold text-slate-800 text-sm">{cert?.courseTitle}</p>
              <p className="text-xs text-emerald-700 font-semibold">{cert?.grade}</p>
            </div>
            <div className="pt-6 border-t border-slate-200 text-xs flex justify-between text-left">
              <div>
                <span className="text-slate-400 font-bold uppercase text-[10px]">Authority</span>
                <p className="font-bold text-slate-800">{cert?.issueAuthority}</p>
                <p className="text-slate-400">{cert?.completionDate}</p>
              </div>
              <div className="text-right">
                <span className="text-slate-400 font-bold uppercase text-[10px]">Certificate ID</span>
                <p className="font-mono font-bold text-blue-900">{cert?.certificateId}</p>
                <p className="text-emerald-600 font-semibold">Verified</p>
              </div>
            </div>
          </div>
          <div className="text-center">
            <button onClick={() => window.print()} className="px-6 py-2 bg-blue-900 text-white rounded-xl text-xs font-bold shadow">🖨️ Print Certificate</button>
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 7: ADMIN DASHBOARD
    // ==========================================
    function Screen7Admin({ onBack }) {
      const [stats, setStats] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetch(`${API_BASE}/admin/stats`)
          .then(r => r.json())
          .then(setStats)
          .finally(() => setLoading(false));
      }, []);

      if (loading) return <div className="py-20 text-center text-sm text-slate-500">Loading admin telemetry...</div>;

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
          <div className="flex justify-between items-center pb-6 border-b border-slate-200">
            <div>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-900">Topic 7 • Screen 7</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Admin Capacity Telemetry</h1>
            </div>
            <button onClick={onBack} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">← Back to Learner View</button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Total Workforce</span>
              <p className="text-3xl font-extrabold text-purple-900 mt-1">{stats?.totalUsers}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Active Learners</span>
              <p className="text-3xl font-extrabold text-blue-900 mt-1">{stats?.activeLearners}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Completion Rate</span>
              <p className="text-3xl font-extrabold text-emerald-600 mt-1">{stats?.completionRatePercent}%</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200">
              <span className="text-xs text-slate-400 font-bold uppercase">Total Curriculums</span>
              <p className="text-3xl font-extrabold text-slate-900 mt-1">{stats?.totalCourses}</p>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-6">
            <h2 className="text-base font-bold text-slate-900 mb-4">Enterprise User Directory</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-400 uppercase">
                    <th className="py-2.5 px-3">Employee</th>
                    <th className="py-2.5 px-3">Department</th>
                    <th className="py-2.5 px-3">Role</th>
                    <th className="py-2.5 px-3">Progress</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {stats?.registeredUsers?.map(u => (
                    <tr key={u.id} className="hover:bg-slate-50">
                      <td className="py-3 px-3 font-bold text-slate-900">{u.name}</td>
                      <td className="py-3 px-3 text-slate-600">{u.department}</td>
                      <td className="py-3 px-3"><span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-[10px] font-bold uppercase">{u.role}</span></td>
                      <td className="py-3 px-3 font-bold text-slate-800">{u.progress}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGES 3, 4, 5 (Catalog, Detail, Player)
    // ==========================================
    function Page3Catalog({ onSelectCourse, onLaunchPlayer }) {
      const [courses, setCourses] = React.useState([]);
      React.useEffect(() => {
        fetch(`${API_BASE}/courses/catalog`).then(r => r.json()).then(setCourses);
      }, []);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-900 mb-6">Page 3: Course Catalog</h1>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {courses.map(c => (
              <div key={c.id} className="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                  <span className="text-[10px] font-bold bg-blue-50 text-blue-900 px-2 py-0.5 rounded">{c.category}</span>
                  <h2 className="text-base font-bold text-slate-900 mt-2">{c.title}</h2>
                  <p className="text-xs text-slate-500 mt-2">{c.description}</p>
                </div>
                <div className="mt-4 pt-4 border-t border-slate-100 flex gap-2">
                  <button onClick={() => onSelectCourse(c.id)} className="flex-1 py-1.5 bg-slate-100 rounded text-xs font-semibold">Detail (Page 4)</button>
                  <button onClick={() => onLaunchPlayer(c.id)} className="flex-1 py-1.5 bg-blue-900 text-white rounded text-xs font-bold">Player (Page 5) ▶</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Page4Detail({ courseId, onBack, onLaunchPlayer }) {
      const [course, setCourse] = React.useState(null);
      React.useEffect(() => {
        fetch(`${API_BASE}/courses/detail/${courseId}`).then(r => r.json()).then(setCourse);
      }, [courseId]);

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-semibold bg-white border border-slate-200 px-3 py-1.5 rounded-lg">← Back to Catalog</button>
          {course && (
            <div className="bg-white rounded-2xl border border-slate-200 p-8 space-y-4">
              <span className="text-xs font-bold uppercase text-blue-900">{course.category}</span>
              <h1 className="text-2xl font-extrabold text-slate-900">{course.title}</h1>
              <p className="text-sm text-slate-600">{course.description}</p>
              <p className="text-xs text-slate-500 font-medium">Instructor: <strong>{course.instructor}</strong></p>
              <div className="pt-4 border-t border-slate-100">
                <h3 className="font-bold text-xs uppercase text-slate-400 mb-2">Curriculum Modules</h3>
                <ul className="space-y-1.5 text-xs text-slate-700">
                  {course.syllabus?.map((s, i) => <li key={i} className="p-2 bg-slate-50 rounded">Module {i+1}: {s}</li>)}
                </ul>
              </div>
              <button onClick={() => onLaunchPlayer(course.id)} className="px-6 py-2.5 bg-blue-900 text-white rounded-xl text-xs font-bold">Launch Player (Page 5) ▶</button>
            </div>
          )}
        </div>
      );
    }

    function Page5Player({ courseId, onBack }) {
      const [player, setPlayer] = React.useState(null);
      const [selected, setSelected] = React.useState(null);
      const [submitted, setSubmitted] = React.useState(false);
      const [aiQuiz, setAiQuiz] = React.useState(null);
      const [aiLoading, setAiLoading] = React.useState(false);
      const [aiError, setAiError] = React.useState(null);
      const [aiAnswers, setAiAnswers] = React.useState([]);

      React.useEffect(() => {
        fetch(`${API_BASE}/courses/player/${courseId}`).then(r => r.json()).then(setPlayer);
      }, [courseId]);

      const correct = submitted && selected === player?.quiz?.correct;

      const generateAIQuiz = async () => {
        setAiLoading(true);
        setAiError(null);
        setAiAnswers([]);
        try {
          const topic = player?.title || `Course ${courseId}`;
          const res = await fetch(`${API_BASE}/ai/generate-quiz`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              courseId,
              numQuestions: 3,
              topic,
              difficulty: 'intermediate',
              readingContent: player?.readingContent
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'AI quiz generation failed');
          setAiQuiz(data);
        } catch (err) {
          setAiError(err.message);
        } finally {
          setAiLoading(false);
        }
      };

      const handleAISelect = (qIdx, ansIdx) => {
        const newAnswers = [...aiAnswers];
        newAnswers[qIdx] = ansIdx;
        setAiAnswers(newAnswers);
      };

      const submitAIQuiz = () => {
        if (aiAnswers.length < (aiQuiz?.questions?.length || 0)) return;
      };

      const aiCorrect = (qIdx) => {
        const q = aiQuiz?.questions?.[qIdx];
        return aiAnswers[qIdx] !== undefined && aiAnswers[qIdx] === q?.correctIndex;
      };

      const aiSubmitted = aiAnswers.length === (aiQuiz?.questions?.length || 0);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-semibold bg-white border border-slate-200 px-3 py-1.5 rounded-lg">← Back</button>
          {player && (
            <div className="space-y-6">
              <div className="bg-white rounded-2xl border border-slate-200 p-6">
                <h1 className="text-2xl font-extrabold text-slate-900">{player.title}</h1>
              </div>
              <div className="bg-black rounded-2xl overflow-hidden aspect-video max-h-[420px] flex items-center justify-center">
                <video controls src={player.videoUrl} className="w-full h-full object-contain"></video>
              </div>
              <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                <h2 className="text-lg font-bold text-slate-900">Knowledge Check Quiz</h2>
                <p className="text-sm font-semibold text-slate-800">{player.quiz?.question}</p>
                <div className="space-y-2">
                  {player.quiz?.options?.map((opt, i) => (
                    <label key={i} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer ${selected === i ? 'border-blue-700 bg-blue-50' : 'border-slate-200'}`}>
                      <input type="radio" name="qz" checked={selected === i} onChange={() => setSelected(i)} disabled={submitted} />
                      <span>{opt}</span>
                    </label>
                  ))}
                </div>
                {!submitted ? (
                  <button disabled={selected === null} onClick={() => setSubmitted(true)} className="px-4 py-2 bg-blue-900 text-white text-xs font-bold rounded-lg disabled:bg-slate-200">Submit Quiz</button>
                ) : (
                  <div className="flex items-center gap-3">
                    <span className={`px-3 py-1 rounded text-xs font-bold ${correct ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                      {correct ? '✓ Correct Answer!' : '✕ Incorrect'}
                    </span>
                    <button onClick={() => { setSelected(null); setSubmitted(false); }} className="px-3 py-1 bg-slate-200 text-xs font-semibold rounded">Reset</button>
                  </div>
                )}
              </div>

              {/* AI Quiz Generator (Topic 8) */}
              <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span className="text-indigo-600">🤖 AI Quiz Generator</span>
                  </h2>
                  <button
                    onClick={generateAIQuiz}
                    disabled={aiLoading}
                    className={`px-4 py-2 rounded-lg text-xs font-bold transition ${
                      aiLoading
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                    }`}
                  >
                    {aiLoading ? 'Generating...' : 'Generate AI Quiz'}
                  </button>
                </div>

                {aiError && (
                  <p className="text-xs text-amber-600 font-semibold">Using sample questions: {aiError}</p>
                )}

                {aiQuiz && aiQuiz.questions?.map((q, qIdx) => (
                  <div key={qIdx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                    <div className="flex justify-between items-start mb-3">
                      <span className="text-xs font-bold text-slate-400 uppercase">Question {qIdx + 1} of {aiQuiz.count}</span>
                      {aiSubmitted && (
                        <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                          aiCorrect(qIdx) ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                        }`}>
                          {aiCorrect(qIdx) ? '✓ Correct' : '✕ Incorrect'}
                        </span>
                      )}
                    </div>
                    <p className="text-sm font-semibold text-slate-800 mb-3">{q.question}</p>
                    <div className="space-y-2">
                      {q.options?.map((opt, i) => {
                        const checked = aiAnswers[qIdx] === i;
                        const isCorrect = i === q.correctIndex;
                        let borderStyle = 'border-slate-200 hover:border-indigo-400 bg-white';
                        if (aiSubmitted) {
                          if (isCorrect) borderStyle = 'border-emerald-500 bg-emerald-50/70 text-emerald-950 font-semibold';
                          else if (checked && !isCorrect) borderStyle = 'border-red-500 bg-red-50/70 text-red-950';
                        } else if (checked) {
                          borderStyle = 'border-indigo-700 bg-indigo-50/50';
                        }
                        return (
                          <label key={i} className={`flex items-start gap-3 p-3 rounded-xl border-2 transition cursor-pointer ${borderStyle}`}>
                            <input
                              type="radio"
                              name={`ai-q${qIdx}`}
                              disabled={aiSubmitted}
                              checked={checked}
                              onChange={() => !aiSubmitted && handleAISelect(qIdx, i)}
                              className="mt-1 w-4 h-4 text-indigo-600"
                            />
                            <div className="flex-1 text-sm text-slate-800 leading-snug">{opt}</div>
                          </label>
                        );
                      })}
                    </div>
                    {aiSubmitted && q.explanation && (
                      <div className="mt-3 p-3 bg-blue-50 rounded-lg border border-blue-200">
                        <p className="text-xs text-blue-900"><span className="font-bold">Explanation:</span> {q.explanation}</p>
                      </div>
                    )}
                  </div>
                ))}

                {aiQuiz && aiSubmitted && (
                  <div className="mt-4 p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                    <p className="text-sm font-bold text-indigo-900">
                      AI Quiz Score: {aiQuiz.questions.filter((_, i) => aiCorrect(i)).length} / {aiQuiz.questions.length}
                    </p>
                    <p className="text-xs text-indigo-700 mt-1">
                      Source: {aiQuiz.source === 'ai' ? 'Generated by Gemini LLM' : 'Sample questions (API unavailable)'}
                    </p>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // SCREEN 8: RESUME / SKILL GAP SCANNER
    // ==========================================
    function Screen8SkillGap({ userId, onBack, onEnrollCourse }) {
      const [resumeText, setResumeText] = React.useState('');
      const [fileName, setFileName] = React.useState('');
      const [scanning, setScanning] = React.useState(false);
      const [result, setResult] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [enrolled, setEnrolled] = React.useState([]);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setFileName(file.name);
        const reader = new FileReader();
        reader.onload = (ev) => setResumeText(ev.target.result);
        reader.readAsText(file);
      };

      const handleScan = async () => {
        if (!resumeText.trim()) {
          setError('Please paste your resume/profile text or upload a file.');
          return;
        }
        setScanning(true);
        setError(null);
        setResult(null);
        try {
          const res = await fetch(`${API_BASE}/ai/skill-gap-analysis`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ resumeText, userId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Skill gap analysis failed');
          setResult(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setScanning(false);
        }
      };

      const handleEnroll = (courseId, title) => {
        if (enrolled.includes(courseId)) return;
        setEnrolled([...enrolled, courseId]);
        if (onEnrollCourse) onEnrollCourse(courseId, title);
        alert(`Enrolled in: ${title}`);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-8">
          <div className="flex items-center justify-between pb-6 border-b border-slate-200">
            <div>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-900">Topic 10 • Screen 8</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">Resume / Skill Gap Scanner</h1>
              <p className="text-xs sm:text-sm text-slate-600 mt-1">Upload your profile or paste resume text. AI auto-enrolls you into required pathways.</p>
            </div>
            <button onClick={onBack} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">← Back to Dashboard</button>
          </div>

          {/* Input Section */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
            <div className="flex items-center gap-2">
              <label className="text-sm font-semibold text-slate-700">Upload Resume:</label>
              <input
                type="file"
                accept=".txt,.pdf,.doc,.docx"
                onChange={handleFileChange}
                className="text-xs file:mr-3 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-800 hover:file:bg-indigo-100"
              />
              {fileName && <span className="text-xs text-slate-500">{fileName}</span>}
            </div>
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1">Or paste resume text:</label>
              <textarea
                value={resumeText}
                onChange={(e) => setResumeText(e.target.value)}
                placeholder="Paste your resume or profile text here..."
                className="w-full h-32 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm resize-y focus:ring-2 focus:ring-indigo-300"
                disabled={scanning}
              />
            </div>
            {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}
            <button
              onClick={handleScan}
              disabled={scanning || !resumeText.trim()}
              className={`px-6 py-2.5 rounded-xl text-xs font-bold shadow transition ${
                scanning || !resumeText.trim()
                  ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                  : 'bg-indigo-600 hover:bg-indigo-700 text-white'
              }`}
            >
              {scanning ? 'Scanning with AI...' : 'Scan for Skills & Recommend Pathways'}
            </button>
          </div>

          {/* Results Section */}
          {scanning && (
            <div className="py-20 text-center">
              <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="mt-3 text-sm font-medium text-slate-600">AI analyzing resume and identifying skill gaps...</p>
            </div>
          )}

          {!scanning && result && (
            <div className="space-y-6">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-bold text-slate-900">Scan Results</h2>
                  <span className={`text-xs px-2 py-1 rounded ${result.source === 'ai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                    {result.source === 'ai' ? 'AI Generated' : 'Sample Data'}
                  </span>
                </div>
                <p className="text-sm text-slate-600 mb-4">{result.summary}</p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="text-sm font-bold text-slate-800 mb-2">Detected Skills ({result.detectedSkills?.length || 0})</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {result.detectedSkills?.map((s, i) => (
                        <span key={i} className="px-2.5 py-1 bg-emerald-50 text-emerald-800 text-xs rounded-lg">{s}</span>
                      ))}
                    </div>
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-800 mb-2">Missing Skills ({result.missingSkills?.length || 0})</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {result.missingSkills?.map((s, i) => (
                        <span key={i} className="px-2.5 py-1 bg-red-50 text-red-800 text-xs rounded-lg">{s}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* Recommended Courses */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <h3 className="text-base font-bold text-slate-900 mb-4">Recommended Courses for Auto-Enrollment</h3>
                <div className="space-y-3">
                  {result.recommendedCourses?.map((c) => {
                    const isEnrolled = enrolled.includes(c.courseId);
                    const priorityColor = c.priority === 'high' ? 'bg-red-100 text-red-800' : c.priority === 'medium' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800';
                    return (
                      <div key={c.courseId} className="p-4 rounded-xl border border-slate-200 hover:bg-slate-50">
                        <div className="flex items-center justify-between gap-3">
                          <div className="flex-1">
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 bg-slate-100 text-slate-700 text-[10px] font-bold rounded">{c.category}</span>
                              <span className={`px-2 py-0.5 text-[10px] font-bold rounded ${priorityColor}`}>{c.priority}</span>
                              <span className="text-[10px] text-slate-400">Match: {c.matchScore}%</span>
                            </div>
                            <h4 className="text-sm font-bold text-slate-900 mt-1">{c.title}</h4>
                            <p className="text-xs text-slate-600 mt-1">{c.reason}</p>
                          </div>
                          <button
                            onClick={() => handleEnroll(c.courseId, c.title)}
                            disabled={isEnrolled}
                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                              isEnrolled
                                ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                            }`}
                          >
                            {isEnrolled ? 'Enrolled ✓' : 'Auto-Enroll'}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Suggested Enrollments */}
              {result.suggestedEnrollments?.length > 0 && (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  <h3 className="text-base font-bold text-slate-900 mb-3">Suggested Learning Pathways</h3>
                  <div className="space-y-2">
                    {result.suggestedEnrollments.map((e, i) => (
                      <div key={`${e.courseId}-${i}`} className="flex items-center gap-3 p-2.5 rounded-lg bg-slate-50 border border-slate-100">
                        <span className="w-6 h-6 rounded-full bg-indigo-900 text-white flex items-center justify-center text-xs font-bold">{i + 1}</span>
                        <div>
                          <span className="text-xs uppercase font-bold text-slate-400">{e.pathway}</span>
                          <p className="text-sm font-semibold text-slate-900">{e.title}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // ROOT APP
    // ==========================================
    function App() {
      const [screen, setScreen] = React.useState('2');
      const [courseId, setCourseId] = React.useState(1);
      const [user, setUser] = React.useState({ id: 'u_learner1', name: 'Jane Doe', role: 'learner' });

      return (
        <div>
          <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-blue-900 text-white flex items-center justify-center font-bold text-xs">CC</span>
                <div>
                  <span className="font-bold text-sm text-slate-900">Capacity Connect</span>
                  <span className="text-[10px] text-slate-400 block">{user.name} ({user.role})</span>
                </div>
              </div>

              <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button onClick={() => setScreen('1')} className={`px-2.5 py-1.5 rounded-lg ${screen === '1' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>1: Auth</button>
                <button onClick={() => setScreen('2')} className={`px-2.5 py-1.5 rounded-lg ${screen === '2' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>2: Dashboard</button>
                <button onClick={() => setScreen('3')} className={`px-2.5 py-1.5 rounded-lg ${screen === '3' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>3: Catalog</button>
                <button onClick={() => setScreen('4')} className={`px-2.5 py-1.5 rounded-lg ${screen === '4' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>4: Detail</button>
                <button onClick={() => setScreen('5')} className={`px-2.5 py-1.5 rounded-lg ${screen === '5' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>5: Player</button>
                <button onClick={() => setScreen('6')} className={`px-2.5 py-1.5 rounded-lg ${screen === '6' ? 'bg-white text-blue-950 shadow-sm' : 'text-slate-600'}`}>6: Cert</button>
                <button onClick={() => setScreen('7')} className={`px-2.5 py-1.5 rounded-lg ${screen === '7' ? 'bg-purple-900 text-white shadow-sm' : 'text-slate-600'}`}>7: Admin</button>
                <button onClick={() => setScreen('8')} className={`px-2.5 py-1.5 rounded-lg ${screen === '8' ? 'bg-indigo-900 text-white shadow-sm' : 'text-slate-600'}`}>8: AI Skill Gap</button>
              </div>
            </div>
          </header>

          <main className="pb-16">
            {screen === '1' && <Screen1Auth onAuthSuccess={(d) => { if (d.user) setUser(d.user); setScreen(d.user?.role === 'admin' ? '7' : '2'); }} onNavigate={setScreen} />}
            {screen === '2' && <Screen2Dashboard userId={user.id} onOpenCourse={(id) => { setCourseId(id); setScreen('5'); }} onOpenCert={(id) => { setCourseId(id); setScreen('6'); }} onOpenCatalog={() => setScreen('3')} />}
            {screen === '3' && <Page3Catalog onSelectCourse={(id) => { setCourseId(id); setScreen('4'); }} onLaunchPlayer={(id) => { setCourseId(id); setScreen('5'); }} />}
            {screen === '4' && <Page4Detail courseId={courseId} onBack={() => setScreen('3')} onLaunchPlayer={(id) => { setCourseId(id); setScreen('5'); }} />}
            {screen === '5' && <Page5Player courseId={courseId} onBack={() => setScreen('2')} />}
            {screen === '6' && <Screen6Certificate userId={user.id} courseId={courseId} onBack={() => setScreen('2')} />}
            {screen === '7' && <Screen7Admin onBack={() => setScreen('2')} />}
            {screen === '8' && <Screen8SkillGap userId={user.id} onBack={() => setScreen('2')} onEnrollCourse={(id, title) => { setCourseId(id); alert('Enrolled in ' + title + '. Opening course...'); setScreen('5'); }} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
