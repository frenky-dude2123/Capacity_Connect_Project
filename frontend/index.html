<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacity Connect - Stitch Platform Suite</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    .btn-micro {
      transition: all 200ms ease-in-out;
    }
    .btn-micro:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    }
    .btn-micro:active {
      transform: scale(0.95);
    }
  </style>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for Admin Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // Dynamic API origin: works seamlessly on localhost, Wi-Fi IP (10.17.93.15), and public tunnel domains
    const API_BASE = window.location.protocol.startsWith('http')
      ? `${window.location.origin}/api`
      : 'http://localhost:5000/api';

    // ==========================================
    // PROGRESS TRACKING UTILITIES (localStorage)
    // ==========================================
    const PROGRESS_KEY = 'capacity_connect_progress';

    function loadProgress() {
      try {
        const raw = localStorage.getItem(PROGRESS_KEY);
        return raw ? JSON.parse(raw) : { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null };
      } catch {
        return { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null };
      }
    }

    function saveProgress(state) {
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch {}
    }

    function getContinueWatching() {
      const progress = loadProgress();
      if (!progress.currentCourseId || !progress.currentLectureId) return null;
      return {
        courseId: progress.currentCourseId,
        lectureId: progress.currentLectureId,
        timestamp: progress.currentTimestamp,
        completedLectures: progress.completedLectures || []
      };
    }

    // ==========================================
    // LOCAL QUIZ QUESTION POOL (15 questions)
    // ==========================================
    const LOCAL_QUIZ_POOL = [
      { id: 'q1', topic: 'Cloud Architecture', question: 'What is the primary benefit of deploying the Circuit Breaker pattern in distributed microservices?', options: ['Preventing cascading service failures by failing fast during downstream outages', 'Directly increasing database throughput by bypassing cache layers', 'Encrypting inter-service payloads using asymmetric cryptography', 'Automatically reducing the size of container images in production'], correctIndex: 0 },
      { id: 'q2', topic: 'Security & Compliance', question: 'Under the principle of Least Privilege (PoLP), how should user and service permissions be assigned?', options: ['Grant broad administrative access to ensure uninterrupted developer productivity', 'Provide only the minimum necessary permissions required to perform specific job duties', 'Delegate root credentials across all members of the incident response team', 'Disable token expiration on internal microservice-to-microservice APIs'], correctIndex: 1 },
      { id: 'q3', topic: 'Distributed Systems', question: 'Which consistency and recovery approach is commonly utilized in the Saga pattern when a step fails?', options: ['Immediate distributed database rollback via distributed locking', 'Executing compensating transactions in reverse order to restore consistency', 'Ignoring downstream service errors and logging a warning', 'Restarting the entire application cluster from cold storage'], correctIndex: 1 },
      { id: 'q4', topic: 'Cloud Architecture', question: 'Which load balancing layer operates at the transport layer and does not inspect HTTP headers?', options: ['Layer 7 reverse proxy', 'Layer 4 load balancer', 'API gateway', 'Service mesh sidecar'], correctIndex: 1 },
      { id: 'q5', topic: 'Security & Compliance', question: 'In ISO 27001, what is the primary purpose of an ISMS?', options: ['To increase cloud storage capacity', 'To systematically manage sensitive company information so it remains secure', 'To replace all firewalls with VPNs', 'To automate software deployments'], correctIndex: 1 },
      { id: 'q6', topic: 'Software Engineering', question: 'What is Domain-Driven Design (DDD) primarily used for?', options: ['Designing database indexes', 'Aligning software architecture with complex business domains', 'Compiling source code faster', 'Managing Kubernetes manifests'], correctIndex: 1 },
      { id: 'q7', topic: 'Cloud Architecture', question: 'Which AWS service is primarily used for auto-scaling compute capacity?', options: ['AWS Lambda', 'Amazon EC2 Auto Scaling', 'Amazon RDS', 'AWS CloudFormation'], correctIndex: 1 },
      { id: 'q8', topic: 'Security & Compliance', question: 'What does Zero Trust architecture assume about network traffic?', options: ['All internal traffic is trusted', 'No traffic is trusted by default, even inside the network', 'Only external traffic is untrusted', 'Trust is based on IP address alone'], correctIndex: 1 },
      { id: 'q9', topic: 'Distributed Systems', question: 'What is the main purpose of the Raft consensus protocol?', options: ['To replace SQL databases', 'To manage a replicated log across distributed nodes', 'To encrypt service communications', 'To render UI components'], correctIndex: 1 },
      { id: 'q10', topic: 'Software Engineering', question: 'Event Sourcing persists state as a sequence of what?', options: ['SQL transactions', 'Immutable events', 'JSON configs', 'HTML templates'], correctIndex: 1 },
      { id: 'q11', topic: 'Cloud Architecture', question: 'What does multi-region active-active failover help achieve?', options: ['Single point of failure', 'Higher availability by running redundant systems simultaneously', 'Lower latency by using one region only', 'Faster database queries'], correctIndex: 1 },
      { id: 'q12', topic: 'Security & Compliance', question: 'Which of the following is a cryptographic key management service?', options: ['AWS KMS', 'AWS S3', 'AWS CloudFront', 'AWS IAM'], correctIndex: 0 },
      { id: 'q13', topic: 'Distributed Systems', question: 'OpenTelemetry primarily provides what capability?', options: ['Database sharding', 'Distributed tracing and observability', 'Container orchestration', 'Identity federation'], correctIndex: 1 },
      { id: 'q14', topic: 'Software Engineering', question: 'Which pattern decomposes a monolith by aligning services with business capabilities?', options: ['Singleton pattern', 'Domain-Driven Design bounded contexts', 'Factory pattern', 'Observer pattern'], correctIndex: 1 },
      { id: 'q15', topic: 'Cloud Architecture', question: 'What is a common use case for a service mesh in Kubernetes?', options: ['Running batch jobs', 'Managing service-to-service communication, retries, and observability', 'Storing secrets', 'Building Docker images'], correctIndex: 1 }
    ];

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandomQuestions(count = 5) {
      return shuffleArray(LOCAL_QUIZ_POOL).slice(0, Math.min(count, LOCAL_QUIZ_POOL.length));
    }

    function generateAIReport(score, weakTopics) {
      const pct = typeof score === 'string' ? parseInt(score, 10) : score;
      if (pct >= 80) {
        return {
          badge: `${pct}% - Advanced Competency`,
          strengths: ['Strong conceptual understanding', 'Correct application of core principles', 'Good decision-making under constraints'],
          improvements: weakTopics.length ? weakTopics : [],
          recommendation: 'Proceed to the next track or advanced capstone module.'
        };
      }
      if (pct >= 50) {
        return {
          badge: `${pct}% - Intermediate Competency`,
          strengths: ['Foundational knowledge is present', 'Some complex topics understood'],
          improvements: weakTopics.length ? weakTopics : ['Some advanced patterns'],
          recommendation: 'Re-take the module and review the recommended weak-area materials before advancing.'
        };
      }
      return {
        badge: `${pct}% - Foundational Gap`,
        strengths: ['Basic concepts recognized'],
        improvements: weakTopics.length ? weakTopics : ['Core module content'],
        recommendation: 'Re-take Module content, review remediation materials, and retake the quiz.'
      };
    }

    // ==========================================
    // TOAST NOTIFICATION SYSTEM
    // ==========================================
    const TOAST_KEY = 'capacity_connect_toasts';
    const toastListeners = new Set();

    function getToasts() {
      try {
        const raw = localStorage.getItem(TOAST_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveToasts(toasts) {
      try { localStorage.setItem(TOAST_KEY, JSON.stringify(toasts)); } catch {}
      toastListeners.forEach(fn => fn(toasts));
    }

    function subscribeToToasts(fn) {
      toastListeners.add(fn);
      return () => toastListeners.delete(fn);
    }

    function showToast(message, type = 'success') {
      const id = Date.now() + Math.random();
      const toast = { id, message, type, createdAt: Date.now() };
      const toasts = getToasts();
      toasts.push(toast);
      if (toasts.length > 5) toasts.shift();
      saveToasts(toasts);
      setTimeout(() => {
        const remaining = getToasts().filter(t => t.id !== id);
        saveToasts(remaining);
      }, 3000);
    }

    function ToastContainer() {
      const [toasts, setToasts] = React.useState(getToasts());
      React.useEffect(() => subscribeToToasts(setToasts), []);

      if (!toasts.length) return null;
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-red-600 text-white',
        info: 'bg-blue-900 text-white'
      };
      return (
        <div className="fixed top-20 right-4 z-[60] space-y-2 w-80">
          {toasts.map(t => (
            <div key={t.id} className={`${colors[t.type] || colors.success} px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transition-all duration-300`}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // ADMIN ANALYTICS MOCK DATA & CHARTS
    // ==========================================
    const ADMIN_ANALYTICS = {
      monthlyActiveUsers: [
        { month: 'Jan', users: 820 },
        { month: 'Feb', users: 932 },
        { month: 'Mar', users: 901 },
        { month: 'Apr', users: 1034 },
        { month: 'May', users: 1290 },
        { month: 'Jun', users: 1124 }
      ],
      courseCompletionStatus: [
        { status: 'Completed', count: 740, color: '#10b981' },
        { status: 'In Progress', count: 410, color: '#3b82f6' },
        { status: 'Not Started', count: 330, color: '#94a3b8' }
      ]
    };

    function AdminCharts() {
      const barRef = React.useRef(null);
      const pieRef = React.useRef(null);

      React.useEffect(() => {
        if (!barRef.current || !pieRef.current) return;

        const isDark = document.documentElement.classList.contains('dark');
        const gridColor = isDark ? 'rgba(148,163,184,0.2)' : 'rgba(15,23,42,0.1)';
        const textColor = isDark ? '#cbd5e1' : '#334155';

        if (barRef.current.chart) barRef.current.chart.destroy();
        if (pieRef.current.chart) pieRef.current.chart.destroy();

        barRef.current.chart = new Chart(barRef.current, {
          type: 'bar',
          data: {
            labels: ADMIN_ANALYTICS.monthlyActiveUsers.map(d => d.month),
            datasets: [
              {
                label: 'Active Users',
                data: ADMIN_ANALYTICS.monthlyActiveUsers.map(d => d.users),
                backgroundColor: '#3b82f6',
                borderRadius: 8,
                borderSkipped: false
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: textColor, font: { size: 12 } } }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: textColor, stepSize: 200 },
                grid: { color: gridColor }
              },
              x: {
                ticks: { color: textColor },
                grid: { display: false }
              }
            }
          }
        });

        pieRef.current.chart = new Chart(pieRef.current, {
          type: 'doughnut',
          data: {
            labels: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.status),
            datasets: [
              {
                data: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.count),
                backgroundColor: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.color),
                borderWidth: 2,
                borderColor: isDark ? '#0f172a' : '#ffffff'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: textColor, padding: 16, font: { size: 12 } }
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                    const pct = Math.round((ctx.raw / total) * 100);
                    return `${ctx.label}: ${ctx.raw} (${pct}%)`;
                  }
                }
              }
            }
          }
        });

        return () => {
          if (barRef.current?.chart) barRef.current.chart.destroy();
          if (pieRef.current?.chart) pieRef.current.chart.destroy();
        };
      }, []);

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100 mb-4">Monthly Active Learners</h3>
            <div className="h-64">
              <canvas ref={barRef} />
            </div>
          </div>
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
            <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100 mb-4">Course Completion Status</h3>
            <div className="h-64">
              <canvas ref={pieRef} />
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 1: AUTHENTICATION
    // ==========================================
    function Screen1Auth({ onAuthSuccess, onNavigate }) {
      const [isLogin, setIsLogin] = React.useState(true);
      const [email, setEmail] = React.useState('jane.doe@enterprise.com');
      const [password, setPassword] = React.useState('password123');
      const [name, setName] = React.useState('Jane Doe');
      const [signupRole, setSignupRole] = React.useState('trainee');
      const [qualification, setQualification] = React.useState('');
      const [skills, setSkills] = React.useState('');
      const [subjects, setSubjects] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [authData, setAuthData] = React.useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        setAuthData(null);
        try {
          const endpoint = isLogin ? `${API_BASE}/auth/login` : `${API_BASE}/auth/signup`;
          const payload = isLogin
            ? { email, password }
            : { name, email, password, role: signupRole, qualification, skills, subjects };
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Request failed');
          setAuthData(data);
          if (onAuthSuccess) onAuthSuccess(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const getRoleRedirect = (role) => {
        switch (role) {
          case 'trainer': return '/trainer/dashboard';
          case 'admin': return '/admin/dashboard';
          default: return '/trainee/dashboard';
        }
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-8 md:px-6">
          <div className="text-center mb-6">
            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-900">
              Topic 1 • Screen 1 (Auth)
            </span>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">
              {isLogin ? 'Sign In to Capacity Connect' : 'Create Enterprise Account'}
            </h1>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 sm:p-8">
            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-6 text-xs font-bold">
              <button onClick={() => setIsLogin(true)} className={`flex-1 py-2 rounded-lg ${isLogin ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}>Sign In</button>
              <button onClick={() => setIsLogin(false)} className={`flex-1 py-2 rounded-lg ${!isLogin ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}>Sign Up</button>
            </div>

            <div className="mb-4 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl flex gap-2">
              <button onClick={() => { setEmail('jane.doe@enterprise.com'); setPassword('password123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 btn-micro">👤 Trainee Demo</button>
              <button onClick={() => { setEmail('elena.rostova@enterprise.com'); setPassword('trainer123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 btn-micro">🎓 Trainer Demo</button>
              <button onClick={() => { setEmail('admin@capacityconnect.io'); setPassword('admin123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-purple-800">🛡️ Admin Demo</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <input type="text" required placeholder="Full Name" value={name} onChange={e => setName(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />
              )}
              <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />
              <input type="password" required placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />

              {!isLogin && (
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Sign up as</label>
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setSignupRole('trainee')} className={`flex-1 py-2 rounded-lg border-2 text-xs font-bold transition ${signupRole === 'trainee' ? 'border-blue-900 bg-blue-50 text-blue-900' : 'border-slate-200 text-slate-600'}`}>Trainee</button>
                      <button type="button" onClick={() => setSignupRole('trainer')} className={`flex-1 py-2 rounded-lg border-2 text-xs font-bold transition ${signupRole === 'trainer' ? 'border-blue-900 bg-blue-50 text-blue-900' : 'border-slate-200 text-slate-600'}`}>Trainer</button>
                    </div>
                    <p className="text-[10px] text-slate-400 mt-1">Admin accounts cannot be self-registered.</p>
                  </div>

                  {signupRole === 'trainee' && (
                    <div className="space-y-2">
                      <input type="text" placeholder="Qualification (optional)" value={qualification} onChange={e => setQualification(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />
                      <input type="text" placeholder="Skills (comma separated)" value={skills} onChange={e => setSkills(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />
                    </div>
                  )}

                  {signupRole === 'trainer' && (
                    <div className="space-y-2">
                      <input type="text" placeholder="Subjects / Skills you can teach" value={subjects} onChange={e => setSubjects(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm" />
                    </div>
                  )}
                </div>
              )}

              {error && <p className="text-xs text-red-600 font-semibold">{error}</p>}

              <button type="submit" disabled={loading} className="w-full py-2.5 bg-blue-900 text-white rounded-xl text-xs font-bold shadow-md btn-micro">
                {loading ? 'Submitting...' : isLogin ? 'Sign In' : 'Create Account'}
              </button>
            </form>

            {authData && (
              <div className="mt-4 p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 rounded-xl text-xs text-emerald-900 space-y-2">
                {authData.status === 'pending' ? (
                  <div>
                    <p className="font-bold text-amber-700">⏳ {authData.message || 'Your account is awaiting admin approval.'}</p>
                    <p className="text-[11px] text-slate-600">You will be able to log in once an admin approves your account.</p>
                  </div>
                ) : (
                  <>
                    <p className="font-bold">✓ Logged in as {authData.user?.name} ({authData.user?.role})</p>
                    <div className="flex gap-2 pt-2">
                      <button onClick={() => onNavigate(2)} className="flex-1 py-1.5 bg-blue-900 text-white rounded font-bold btn-micro">Trainee Dashboard</button>
                      {authData.user?.role === 'trainer' && (
                        <button onClick={() => onNavigate(7)} className="flex-1 py-1.5 bg-purple-900 text-white rounded font-bold btn-micro">Trainer Suite</button>
                      )}
                      {authData.user?.role === 'admin' && (
                        <button onClick={() => onNavigate(7)} className="flex-1 py-1.5 bg-purple-900 text-white rounded font-bold btn-micro">Admin Suite</button>
                      )}
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 2: LEARNER DASHBOARD
    // ==========================================
    function Screen2Dashboard({ userId, onOpenCourse, onOpenCert, onOpenCatalog }) {
      const [dash, setDash] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [aiRecs, setAiRecs] = React.useState(null);
      const [aiLoading, setAiLoading] = React.useState(false);
      const [aiError, setAiError] = React.useState(null);

      React.useEffect(() => {
        fetch(`${API_BASE}/user/dashboard/${userId}`)
          .then(r => r.json())
          .then(setDash)
          .finally(() => setLoading(false));
      }, [userId]);

      const fetchAIRecommendations = async () => {
        setAiLoading(true);
        setAiError(null);
        try {
          const weakAreas = [
            { topic: 'Security & Compliance', score: 45, courseId: 2 },
            { topic: 'Distributed Systems', score: 60, courseId: 3 },
            { topic: 'Cloud Architecture', score: 68, courseId: 1 }
          ];
          const res = await fetch(`${API_BASE}/ai/recommendations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, weakAreas, numRecommendations: 3 })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'AI recommendations failed');
          setAiRecs(data);
        } catch (err) {
          setAiError(err.message);
        } finally {
          setAiLoading(false);
        }
      };

      if (loading) return <div className="py-20 text-center text-sm text-slate-500 dark:text-slate-400">Loading Learner Dashboard...</div>;

      const continueWatching = getContinueWatching();
      const currentCourse = dash?.enrolledCourses?.find(c => c.id === continueWatching?.courseId);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
          <div className="flex justify-between items-center pb-6 border-b border-slate-200 dark:border-slate-700">
            <div>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-900">Topic 2 • Screen 2</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-slate-100 mt-1">Learner Dashboard: {dash?.userName}</h1>
            </div>

    function Page5Player({ courseId, onBack }) {
      const PASSING_SCORE_THRESHOLD = 80;
      const [player, setPlayer] = React.useState(null);
      const [lectureIndex, setLectureIndex] = React.useState(0);
      const [currentTimestamp, setCurrentTimestamp] = React.useState(0);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);
      const progress = React.useRef(loadProgress());

      const [quizQuestions, setQuizQuestions] = React.useState([]);
      const [quizStarted, setQuizStarted] = React.useState(false);
      const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState({});
      const [quizFinished, setQuizFinished] = React.useState(false);
      const [quizScore, setQuizScore] = React.useState(0);
      const [bestScore, setBestScore] = React.useState(null);
      const [reportModal, setReportModal] = React.useState(null);
      const [revealMode, setRevealMode] = React.useState(false);

      React.useEffect(() => {
        fetch(`${API_BASE}/courses/player/${courseId}`).then(r => r.json()).then(setPlayer);
      }, [courseId]);

      React.useEffect(() => {
        const saved = progress.current;
        if (saved.currentCourseId === Number(courseId) && saved.currentLectureId) {
          setLectureIndex(saved.currentLectureId - 1);
          setCurrentTimestamp(saved.currentTimestamp || 0);
        }
      }, [courseId]);

      React.useEffect(() => {
        if (!player || !videoRef.current) return;
        const video = videoRef.current;
        if (currentTimestamp > 0) {
          video.currentTime = currentTimestamp;
        }
      }, [player]);

      React.useEffect(() => {
        if (!player) return;
        const video = videoRef.current;
        if (!video) return;

        const onTimeUpdate = () => {
          if (timerRef.current) return;
          timerRef.current = setTimeout(() => {
            const state = loadProgress();
            state.currentCourseId = Number(courseId);
            state.currentLectureId = lectureIndex + 1;
            state.currentTimestamp = Math.floor(video.currentTime);
            saveProgress(state);
            progress.current = state;
            timerRef.current = null;
          }, 5000);
        };

        const onPause = () => {
          const state = loadProgress();
          state.currentCourseId = Number(courseId);
          state.currentLectureId = lectureIndex + 1;
          state.currentTimestamp = Math.floor(video.currentTime);
          saveProgress(state);
          progress.current = state;
        };

        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('pause', onPause);

        return () => {
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('pause', onPause);
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, [player, courseId, lectureIndex]);

      const markComplete = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) {
          state.completedLectures.push(lectureIndex + 1);
        }
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state);
        progress.current = state;
        setLectureIndex(nextIndex);
        setCurrentTimestamp(0);
        setQuizStarted(false);
        setQuizFinished(false);
        setQuizQuestions([]);
        setUserAnswers({});
        setBestScore(null);
        setReportModal(null);
        setRevealMode(false);
      };

      const startQuiz = () => {
        const questions = pickRandomQuestions(5);
        setQuizQuestions(questions);
        setQuizStarted(true);
        setCurrentQuestionIndex(0);
        setUserAnswers({});
        setQuizFinished(false);
        setReportModal(null);
        setRevealMode(false);
      };

      const handleQuizAnswer = (qIdx, optIdx) => {
        if (quizFinished) return;
        setUserAnswers(prev => ({ ...prev, [qIdx]: optIdx }));
      };

      const finishQuiz = () => {
        let correctCount = 0;
        const wrongTopics = new Set();
        quizQuestions.forEach((q, i) => {
          if (userAnswers[i] === q.correctIndex) {
            correctCount++;
          } else {
            wrongTopics.add(q.topic);
          }
        });
        const score = Math.round((correctCount / quizQuestions.length) * 100);
        setQuizScore(score);
        setBestScore(prev => (prev === null || score > prev ? score : prev));
        setQuizFinished(true);
        setRevealMode(true);
        setReportModal(generateAIReport(score, Array.from(wrongTopics)));
      };

      const retakeQuiz = () => {
        const questions = pickRandomQuestions(5);
        setQuizQuestions(questions);
        setCurrentQuestionIndex(0);
        setUserAnswers({});
        setQuizFinished(false);
        setReportModal(null);
        setRevealMode(false);
      };

      const takeNewQuiz = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) {
          state.completedLectures.push(lectureIndex + 1);
        }
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state);
        progress.current = state;
        setLectureIndex(nextIndex);
        setCurrentTimestamp(0);
        setQuizStarted(false);
        setQuizFinished(false);
        setQuizQuestions([]);
        setUserAnswers({});
        setBestScore(null);
        setReportModal(null);
        setRevealMode(false);
        showToast('Module complete. Loading next module...', 'success');
      };

      const prevQuestion = () => {
        if (currentQuestionIndex > 0) {
          setCurrentQuestionIndex(prev => prev - 1);
        }
      };

      const nextQuestion = () => {
        if (currentQuestionIndex < quizQuestions.length - 1) {
          setCurrentQuestionIndex(prev => prev + 1);
        }
      };

      const currentQ = quizQuestions[currentQuestionIndex];
      const isFirstQuestion = currentQuestionIndex === 0;
      const isLastQuestion = currentQuestionIndex === quizQuestions.length - 1;
      const allQuestionsAnswered = quizQuestions.every((_, i) => userAnswers[i] !== undefined);

          setError(err.message);

          setScanning(false);

                    const priorityColor = c.priority === 'high' ? 'bg-red-100 text-red-800' : c.priority === 'medium' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800';

            </div>
          )}

    // ==========================================
    // THEME MANAGEMENT
    // ==========================================
    const THEME_KEY = 'capacity_connect_theme';

    function getInitialTheme() {
      try {
        const stored = localStorage.getItem(THEME_KEY);
        if (stored === 'dark' || stored === 'light') return stored;
      } catch {}
      return 'light';
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
    }

    applyTheme(getInitialTheme());

    // ==========================================
    // ROOT APP
    // ==========================================
    function App() {
      const [screen, setScreen] = React.useState('1');
      const [courseId, setCourseId] = React.useState(1);
      const [user, setUser] = React.useState(null);
      const [theme, setTheme] = React.useState(getInitialTheme);

      const toggleTheme = () => {
        setTheme(prev => {
          const next = prev === 'light' ? 'dark' : 'light';
          try { localStorage.setItem(THEME_KEY, next); } catch {}
          applyTheme(next);
          return next;
        });
      };

      const roleAllowed = (allowedRoles) => !!user && allowedRoles.includes(user.role);

      const navigate = (target) => {
        if (!user) {
          setScreen('1');
          return;
        }
        const roleMap = {
          trainee: '2',
          trainer: '2',
          admin: '7'
        };
        if (target === '2' || target === '3' || target === '4' || target === '5' || target === '6' || target === '8') {
          if (!roleAllowed(['trainee', 'trainer', 'admin'])) {
            setScreen('1');
            return;
          }
        }
        if (target === '7') {
          if (!roleAllowed(['admin'])) {
            setScreen('1');
            return;
          }
        }
        setScreen(target);
      };

      return (
        <div className={theme === 'dark' ? 'dark' : ''}>
          <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-blue-900 text-white flex items-center justify-center font-bold text-xs">CC</span>
                <div>
                  <span className="font-bold text-sm text-slate-900 dark:text-slate-100">Capacity Connect</span>
                  <span className="text-[10px] text-slate-400 dark:text-slate-500 block">{user ? `${user.name} (${user.role})` : 'Not signed in'}</span>
                </div>
              </div>

              <div className="flex flex-wrap gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-semibold">
                <button onClick={() => navigate('1')} className={`px-2.5 py-1.5 rounded-lg ${screen === '1' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>1: Auth</button>
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('2')} className={`px-3 py-1.5 rounded-lg ${screen === '2' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>2: Dashboard</button>
                )}
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('3')} className={`px-3 py-1.5 rounded-lg ${screen === '3' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>3: Catalog</button>
                )}
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('4')} className={`px-3 py-1.5 rounded-lg ${screen === '4' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>4: Detail</button>
                )}
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('5')} className={`px-3 py-1.5 rounded-lg ${screen === '5' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>5: Player</button>
                )}
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('6')} className={`px-3 py-1.5 rounded-lg ${screen === '6' ? 'bg-white dark:bg-slate-900 text-blue-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>6: Cert</button>
                )}
                {roleAllowed(['admin']) && (
                  <button onClick={() => navigate('7')} className={`px-3 py-1.5 rounded-lg ${screen === '7' ? 'bg-purple-900 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>7: Admin</button>
                )}
                {roleAllowed(['trainee', 'trainer', 'admin']) && (
                  <button onClick={() => navigate('8')} className={`px-3 py-1.5 rounded-lg ${screen === '8' ? 'bg-indigo-900 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'} btn-micro`}>8: AI Skill Gap</button>
                )}
                <button onClick={toggleTheme} className={`px-2.5 py-1.5 rounded-lg ${theme === 'dark' ? 'bg-slate-800 text-yellow-300 border border-slate-600' : 'bg-white text-blue-950 shadow-sm border border-slate-200'} btn-micro`}>
                  {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                </button>
              </div>
            </div>
          </header>

          <main className="pb-16 bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
            <ToastContainer />
            {screen === '1' && <Screen1Auth onAuthSuccess={(d) => { if (d.user) setUser(d.user); const role = d.user?.role; const target = role === 'admin' ? '7' : '2'; setScreen(target); }} onNavigate={navigate} />}
            {user && screen === '2' && roleAllowed(['trainee', 'trainer', 'admin']) && <Screen2Dashboard userId={user.id} onOpenCourse={(id) => { setCourseId(id); setScreen('5'); }} onOpenCert={(id) => { setCourseId(id); setScreen('6'); }} onOpenCatalog={() => setScreen('3')} />}
            {user && screen === '3' && roleAllowed(['trainee', 'trainer', 'admin']) && <Page3Catalog onSelectCourse={(id) => { setCourseId(id); setScreen('4'); }} onLaunchPlayer={(id) => { setCourseId(id); setScreen('5'); }} />}
            {user && screen === '4' && roleAllowed(['trainee', 'trainer', 'admin']) && <Page4Detail courseId={courseId} onBack={() => setScreen('3')} onLaunchPlayer={(id) => { setCourseId(id); setScreen('5'); }} />}
            {user && screen === '5' && roleAllowed(['trainee', 'trainer', 'admin']) && <Page5Player courseId={courseId} onBack={() => navigate('2')} />}
            {user && screen === '6' && roleAllowed(['trainee', 'trainer', 'admin']) && <Screen6Certificate userId={user.id} courseId={courseId} onBack={() => navigate('2')} />}
            {user && screen === '7' && roleAllowed(['admin']) && <Screen7Admin onBack={() => navigate('2')} />}
            {user && screen === '8' && roleAllowed(['trainee', 'trainer', 'admin']) && <Screen8SkillGap userId={user.id} onBack={() => navigate('2')} onEnrollCourse={(id, title) => { setCourseId(id); alert('Enrolled in ' + title + '. Opening course...'); setScreen('5'); }} />}
            {!user && screen !== '1' && (
              <div className="max-w-xl mx-auto px-4 py-20 text-center">
                <p className="text-2xl font-extrabold text-slate-900 dark:text-slate-100 mb-2">Not Signed In</p>
                <p className="text-sm text-slate-600 dark:text-slate-300">Please log in to access your dashboard.</p>
                <button onClick={() => setScreen('1')} className="mt-4 px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-bold btn-micro">Go to Login</button>
              </div>
            )}
            {(screen === '7' && !roleAllowed(['admin'])) && (
              <div className="max-w-xl mx-auto px-4 py-20 text-center">
                <p className="text-2xl font-extrabold text-slate-900 dark:text-slate-100 mb-2">Not Authorized</p>
                <p className="text-sm text-slate-600 dark:text-slate-300">You do not have permission to view this page.</p>
                <button onClick={() => navigate('2')} className="mt-4 px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-bold btn-micro">Back to Dashboard</button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
