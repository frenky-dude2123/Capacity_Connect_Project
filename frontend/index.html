<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacity Connect - Stitch Platform Suite</title>
  <!-- Google Fonts: Orbit (space mission) + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbit:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // ===== MULTI-COLOR SPACE/EARTH PALETTE =====
            // Homepage — Purple/Nebula
            nebula: {
              50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe',
              400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7c3aed',
              800: '#6d28d9', 900: '#4c1d95',
            },
            // Trainee — Teal/Ocean
            ocean: {
              50: '#f0fdff', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eeccb',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134d4b',
            },
            // Trainer — Amber/Sunset
            sunset: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309',
              800: '#92400e', 900: '#78350f',
            },
            // Admin — Crimson/Deep Red
            crimson: {
              50: '#fff5f5', 100: '#ffe4e6', 200: '#fecdd8', 300: '#fda4af',
              400: '#fb7171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c',
              800: '#991b1b', 900: '#7f1d1d',
            },
            // Earth/Nature — Green
            earth: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d',
            },
            // Gold/Yellow — Stars/Sun
            gold: {
              50: '#fffff0', 100: '#fef9c3', 200: '#fde047', 300: '#facc15',
              400: '#eab308', 500: '#ca8a04', 600: '#a16207', 700: '#854d0e',
              800: '#713f12', 900: '#5f3a0d',
            },
          },
          fontFamily: {
            'space': ['"Orbit"', '"Segoe UI"', 'system-ui', 'sans-serif'],
            'orbit': ['"Orbit"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    .btn-micro { transition: all 200ms ease-in-out; }
    .btn-micro:hover { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); }
    .btn-micro:active { transform: scale(0.95); }

/* ===== MULTI-COLOR SPACE / EARTH THEME ===== */
    :root {
      --space-black: #05070a;
      --space-navy: #0a0e27;
      --space-deep: #0d1b2a;
      --space-blue: #1b2838;

      /* Homepage — Purple/Nebula */
      --home-bg: #0f0a1f;
      --home-bg2: #1a0b2e;
      --home-accent: #c084fc;
      --home-accent2: #a855f7;
      --home-glow: rgba(168, 85, 247, 0.25);

      /* Trainee — Teal/Ocean */
      --trainee-bg: #0a1f1f;
      --trainee-bg2: #0d2a2a;
      --trainee-accent: #2dd4bf;
      --trainee-accent2: #14b8a6;
      --trainee-glow: rgba(45, 212, 191, 0.25);

      /* Trainer — Amber/Sunset */
      --trainer-bg: #1a0f05;
      --trainer-bg2: #2a1508;
      --trainer-accent: #f59e0b;
      --trainer-accent2: #ff6b35;
      --trainer-glow: rgba(245, 158, 11, 0.25);

      /* Admin — Crimson/Deep Red */
      --admin-bg: #1a0505;
      --admin-bg2: #2a0808;
      --admin-accent: #ef4444;
      --admin-accent2: #dc2626;
      --admin-glow: rgba(239, 68, 68, 0.25);

      /* Earth/Nature — Green */
      --earth-accent: #22c55e;
      --earth-accent2: #16a34a;
      --earth-glow: rgba(34, 197, 94, 0.25);

      /* Gold/Yellow — Stars/Sun */
      --gold-accent: #fbbf24;
      --gold-accent2: #f59e0b;
      --gold-glow: rgba(251, 191, 36, 0.25);

      /* Shared */
      --white: #ffffff;
      --star-white: #f8fafc;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --border-subtle: rgba(148, 163, 184, 0.15);
      --glass-bg: rgba(13, 27, 42, 0.7);
      --glass-border: rgba(0, 212, 255, 0.15);
    }

/* Base backgrounds */
    body { background-color: var(--space-navy) !important; font-family: 'Inter', system-ui, sans-serif; }
    .theme-wrapper { background-color: var(--space-navy) !important; }
    .dark body { background-color: var(--space-black) !important; }
    .dark .theme-wrapper { background-color: var(--space-black) !important; }

    /* Space mission headings */
    h1, h2, h3, .font-space { font-family: 'Orbit', 'Segoe UI', system-ui, sans-serif; }

/* Typography */
    .text-space-title {
      font-family: '"Orbit", "Segoe UI", system-ui, sans-serif';
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .text-home-title {
      background: linear-gradient(135deg, #ffffff 0%, #c084fc 40%, #e879f9 70%, #f0abfc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .text-trainee-title {
      background: linear-gradient(135deg, #ffffff 0%, #2dd4bf 40%, #5eeccb 70%, #ccfbf1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .text-trainer-title {
      background: linear-gradient(135deg, #fffbeb 0%, #fbbf24 40%, #f59e0b 70%, #ff6b35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .text-admin-title {
      background: linear-gradient(135deg, #ffffff 0%, #f87171 40%, #ef4444 70%, #fca5a5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glassmorphism cards */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 1rem;
    }

    /* Role accent colors */
    .accent-trainee { --accent: var(--trainee-accent); --accent-dim: var(--trainee-glow); --accent-hover: #0d9488; }
    .accent-trainer { --accent: var(--trainer-accent); --accent-dim: var(--trainer-glow); --accent-hover: #d97706; }
    .accent-admin { --accent: var(--admin-accent); --accent-dim: var(--admin-glow); --accent-hover: #b91c1c; }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 85%, black) 100%);
      color: #fff;
      border: none;
      box-shadow: 0 0 20px var(--accent-dim), 0 4px 12px rgba(0,0,0,0.3);
    }
    .btn-accent:hover {
      background: linear-gradient(135deg, var(--accent-hover) 0%, color-mix(in srgb, var(--accent-hover) 85%, black) 100%);
      box-shadow: 0 0 30px var(--accent-dim), 0 6px 16px rgba(0,0,0,0.4);
    }

/* Space backgrounds */
    .bg-space-gradient {
      background: linear-gradient(180deg, var(--space-black) 0%, var(--space-navy) 40%, var(--space-deep) 100%);
    }
    /* Homepage — Purple/Nebula hero */
    .bg-home-hero {
      background-image:
        linear-gradient(180deg, rgba(5,7,10,0.2) 0%, rgba(15,10,31,0.85) 50%, var(--home-bg) 100%),
        url('https://images.nasa.gov/images/GSFC_20171208_Archive_e18453/GSFC_20171208_Archive_e18453~small.jpg');
      background-size: cover;
      background-position: center 30%;
    }
    .bg-home-section {
      background: linear-gradient(135deg, var(--home-bg) 0%, var(--home-bg2) 100%);
    }
    /* Auth — Purple/Nebula space */
    .bg-auth-space {
      background-image:
        linear-gradient(135deg, rgba(5,7,10,0.88) 0%, rgba(15,10,31,0.92) 100%),
        url('https://images.nasa.gov/images/GSFC_20171208_Archive_e18453/GSFC_20171208_Archive_e18453~small.jpg');
      background-size: cover;
      background-position: center;
    }
    /* Trainee — Teal/Ocean */
    .bg-trainee-hero {
      background-image:
        linear-gradient(180deg, rgba(5,7,10,0.2) 0%, rgba(10,31,31,0.85) 50%, var(--trainee-bg) 100%),
        url('https://images.nasa.gov/images/GSFC_20171208_Archive_e18453/GSFC_20171208_Archive_e18453~small.jpg');
      background-size: cover;
      background-position: center 30%;
    }
    .bg-trainee-section {
      background: linear-gradient(135deg, var(--trainee-bg) 0%, var(--trainee-bg2) 100%);
    }
    /* Trainer — Amber/Sunset */
    .bg-trainer-hero {
      background-image:
        linear-gradient(180deg, rgba(5,7,10,0.2) 0%, rgba(26,15,5,0.85) 50%, var(--trainer-bg) 100%),
        url('https://images.nasa.gov/images/GSFC_20171208_Archive_e18453/GSFC_20171208_Archive_e18453~small.jpg');
      background-size: cover;
      background-position: center 30%;
    }
    .bg-trainer-section {
      background: linear-gradient(135deg, var(--trainer-bg) 0%, var(--trainer-bg2) 100%);
    }
    /* Admin — Crimson/Deep Red */
    .bg-admin-hero {
      background-image:
        linear-gradient(180deg, rgba(5,7,10,0.2) 0%, rgba(26,5,5,0.85) 50%, var(--admin-bg) 100%),
        url('https://images.nasa.gov/images/GSFC_20171208_Archive_e18453/GSFC_20171208_Archive_e18453~small.jpg');
      background-size: cover;
      background-position: center 30%;
    }
    .bg-admin-section {
      background: linear-gradient(135deg, var(--admin-bg) 0%, var(--admin-bg2) 100%);
    }
    /* Earth — Green */
    .bg-earth-section {
      background: linear-gradient(135deg, #0a1f0a 0%, #0d2a0d 100%);
    }

    .bg-starfield {
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 100px 50px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 200px 150px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 300px 250px, rgba(255,255,255,0.4), transparent),
        radial-gradient(2px 2px at 400px 100px, rgba(168,85,247,0.8), transparent),
        radial-gradient(1px 1px at 500px 300px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 50px 400px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 150px 500px, rgba(45,212,191,0.6), transparent);
      background-size: 550px 550px;
    }

/* Sidebar themes — cosmic glassmorphism with neon accents */
    /* Trainee — Teal/Ocean */
    .theme-trainee .sidebar-bg {
      background: linear-gradient(180deg, rgba(10,31,31,0.85) 0%, rgba(13,42,42,0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(45,212,191,0.3);
      box-shadow: inset 0 0 60px rgba(45,212,191,0.08), 4px 0 24px rgba(0,0,0,0.3);
    }
    .theme-trainee .sidebar-item { color: #94a3b8; }
    .theme-trainee .sidebar-item-active {
      background: linear-gradient(135deg, rgba(45,212,191,0.18) 0%, rgba(6,182,212,0.1) 100%);
      color: #2dd4bf;
      border-left: 3px solid #2dd4bf;
      box-shadow: 0 0 20px rgba(45,212,191,0.25), inset 0 0 20px rgba(45,212,191,0.08);
    }
    .theme-trainee .sidebar-item:hover { background: rgba(45,212,191,0.08); color: #e2e8f0; }
    .theme-trainee .sidebar-icon { filter: drop-shadow(0 0 6px rgba(45,212,191,0.6)); }
    .theme-trainee .portal-bg { background: linear-gradient(135deg, var(--trainee-bg) 0%, var(--trainee-bg2) 100%); }

    /* Trainer — Amber/Sunset */
    .theme-trainer .sidebar-bg {
      background: linear-gradient(180deg, rgba(26,15,5,0.85) 0%, rgba(42,21,8,0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(245,158,11,0.3);
      box-shadow: inset 0 0 60px rgba(245,158,11,0.08), 4px 0 24px rgba(0,0,0,0.3);
    }
    .theme-trainer .sidebar-item { color: #94a3b8; }
    .theme-trainer .sidebar-item-active {
      background: linear-gradient(135deg, rgba(245,158,11,0.18) 0%, rgba(239,68,68,0.08) 100%);
      color: #f59e0b;
      border-left: 3px solid #f59e0b;
      box-shadow: 0 0 20px rgba(245,158,11,0.25), inset 0 0 20px rgba(245,158,11,0.08);
    }
    .theme-trainer .sidebar-item:hover { background: rgba(245,158,11,0.08); color: #e2e8f0; }
    .theme-trainer .sidebar-icon { filter: drop-shadow(0 0 6px rgba(245,158,0.6)); }
    .theme-trainer .portal-bg { background: linear-gradient(135deg, var(--trainer-bg) 0%, var(--trainer-bg2) 100%); }

    /* Admin — Crimson/Deep Red */
    .theme-admin .sidebar-bg {
      background: linear-gradient(180deg, rgba(26,5,5,0.85) 0%, rgba(42,8,8,0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(239,68,68,0.3);
      box-shadow: inset 0 0 60px rgba(239,68,68,0.08), 4px 0 24px rgba(0,0,0,0.3);
    }
    .theme-admin .sidebar-item { color: #94a3b8; }
    .theme-admin .sidebar-item-active {
      background: linear-gradient(135deg, rgba(239,68,68,0.18) 0%, rgba(185,28,28,0.08) 100%);
      color: #ef4444;
      border-left: 3px solid #ef4444;
      box-shadow: 0 0 20px rgba(239,68,68,0.25), inset 0 0 20px rgba(239,68,68,0.08);
    }
    .theme-admin .sidebar-item:hover { background: rgba(239,68,68,0.08); color: #e2e8f0; }
    .theme-admin .sidebar-icon { filter: drop-shadow(0 0 6px rgba(239,68,68,0.6)); }
    .theme-admin .portal-bg { background: linear-gradient(135deg, var(--admin-bg) 0%, var(--admin-bg2) 100%); }

    /* Homepage — Purple/Nebula */
    .theme-home .sidebar-bg {
      background: linear-gradient(180deg, rgba(15,10,31,0.85) 0%, rgba(26,11,46,0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(168,85,247,0.3);
      box-shadow: inset 0 0 60px rgba(168,85,247,0.08), 4px 0 24px rgba(0,0,0,0.3);
    }
    .theme-home .sidebar-item-active {
      background: linear-gradient(135deg, rgba(168,85,247,0.18) 0%, rgba(236,72,153,0.08) 100%);
      color: #c084fc;
      border-left: 3px solid #c084fc;
      box-shadow: 0 0 20px rgba(168,85,247,0.25), inset 0 0 20px rgba(168,85,247,0.08);
    }
    .theme-home .sidebar-icon { filter: drop-shadow(0 0 6px rgba(168,85,247,0.6)); }

    /* Universal neon icon glow for sidebar items */
    .sidebar-item .sidebar-icon-span,
    .sidebar-item span[class*="material"] {
      filter: drop-shadow(0 0 4px currentColor);
    }

    /* Dark mode overrides — space theme */
    .dark body { background-color: var(--space-black) !important; }
    .dark .theme-wrapper { background-color: var(--space-black) !important; }
    .dark .dark\:bg-slate-950 { background-color: var(--space-black) !important; }
    .dark .bg-slate-900/90,
    .dark .dark\:bg-slate-900 { background-color: rgba(13, 27, 42, 0.8) !important; backdrop-filter: blur(12px); }
    .dark .dark\:bg-space-blue/30,
    .dark .bg-space-blue/30 { background-color: rgba(27, 40, 56, 0.8) !important; }
    .dark .dark\:bg-space-blue/40,
    .dark .bg-space-blue/40 { background-color: rgba(30, 41, 59, 0.8) !important; }
    .dark .bg-space-blue/30 { background-color: rgba(30, 41, 59, 0.6) !important; }

    .dark .dark\:text-slate-100 dark:text-slate-100,
    .dark .dark\:text-slate-700 dark:text-slate-200,
    .dark .dark\:text-slate-300,
    .dark .text-slate-100 dark:text-slate-100,
    .dark .text-slate-700 dark:text-slate-200,
    .dark .text-slate-300 { color: #f1f5f9 !important; }
    .dark .dark\:text-slate-400,
    .dark .text-slate-400 { color: #cbd5e1 !important; }
    .dark .dark\:text-slate-400,
    .dark .text-slate-400 { color: #94a3b8 !important; }
    .dark .dark\:border-electric-blue/10,
    .dark .border-electric-blue/10,
    .dark .dark\:border-electric-blue/10,
    .dark .border-electric-blue/10 { border-color: rgba(148,163,184,0.15) !important; }

    /* Inputs in dark mode */
    .dark input[type="email"],
    .dark input[type="password"],
    .dark input[type="text"],
    .dark textarea {
      color: #f1f5f9 !important;
      background-color: rgba(15, 23, 42, 0.8) !important;
      border-color: rgba(0, 212, 255, 0.2) !important;
    }
    .dark input::placeholder,
    .dark textarea::placeholder { color: #64748b !important; }

/* ===== DECORATIVE SPACE / EARTH VISUAL ELEMENTS ===== */
    /* Nebula glow — Homepage */
    .nebula-glow {
      background: radial-gradient(ellipse at 30% 20%, rgba(168,85,247,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(236,72,153,0.15) 0%, transparent 55%);
    }
    /* Ocean glow — Trainee */
    .ocean-glow {
      background: radial-gradient(ellipse at 30% 20%, rgba(45,212,191,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(6,182,212,0.15) 0%, transparent 55%);
    }
    /* Sunset glow — Trainer */
    .sunset-glow {
      background: radial-gradient(ellipse at 30% 20%, rgba(245,158,11,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(239,68,68,0.15) 0%, transparent 55%);
    }
    /* Crimson glow — Admin */
    .crimson-glow {
      background: radial-gradient(ellipse at 30% 20%, rgba(239,68,68,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(185,28,28,0.15) 0%, transparent 55%);
    }
    /* Earth glow — shared nature */
    .earth-glow {
      background: radial-gradient(ellipse at 50% 50%, rgba(34,197,94,0.2) 0%, transparent 70%);
    }
    /* Star glow — Gold */
    .star-glow {
      background: radial-gradient(ellipse at 50% 50%, rgba(251,191,36,0.2) 0%, transparent 70%);
    }

    /* Orbit ring decoration */
    .orbit-ring {
      position: relative;
    }
    .orbit-ring::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 200%; height: 200%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 50%;
      pointer-events: none;
    }
    .orbit-ring::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 140%; height: 140%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 50%;
      animation: orbit-rotate 30s linear infinite;
      pointer-events: none;
    }
    @keyframes orbit-rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Cosmic card — glowing border on hover */
    .cosmic-card {
      transition: all 300ms ease;
      position: relative;
      overflow: hidden;
    }
    .cosmic-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.05) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease;
    }
    .cosmic-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    /* Cosmic background for portal shells */
    .cosmic-bg {
      background:
        radial-gradient(ellipse at 20% 10%, rgba(168,85,247,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(239,68,68,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(45,212,191,0.04) 0%, transparent 60%),
        linear-gradient(180deg, #05070a 0%, #0a0e27 100%);
    }

    /* Planet accent dot */
    .planet-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    /* Gold stat highlight */
    .stat-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Section divider — wave */

      box-shadow: 0 0 20px rgba(251,191,36,0.4);
      position: relative;
    }
    .hologram-seal::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #0a0e27;
      pointer-events: none;
    }
    .hologram-seal span {
      position: relative;
      z-index: 1;

      box-shadow: inset 0 0 40px rgba(0,212,255,0.05), 0 0 20px rgba(0,212,255,0.1);
      position: relative;
    }
    .spaceship-frame::before {
      content: '';
      position: absolute;
      top: -2px; left: 16px; right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      pointer-events: none;
    }
    .spaceship-frame::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 16px; right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      pointer-events: none;
    }
    .corner-tick {
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,212,255,0.5);

    .corner-tick.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .corner-tick.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
    .corner-tick.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
    .corner-tick.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* ===== LOGIN PAGE — FLOATING ORBS ===== */
    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.7;
      animation: float-orb 12s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .login-orb.orb-1 {
      width: 380px; height: 380px;
      background: radial-gradient(circle at 30% 30%, #00d4ff, #0066ff 70%, transparent);
      top: -100px; left: -80px;
      animation-delay: 0s;
    }
    .login-orb.orb-2 {
      width: 320px; height: 320px;
      background: radial-gradient(circle at 70% 30%, #ff006e, #8338ec 70%, transparent);
      bottom: -120px; right: -60px;
      animation-delay: -4s;
    }
    .login-orb.orb-3 {
      width: 240px; height: 240px;
      background: radial-gradient(circle at 50% 50%, #ffbe0b, #fb5607 70%, transparent);
      top: 40%; right: 20%;
      animation-delay: -8s;
    }
    .login-orb.orb-4 {
      width: 200px; height: 200px;
      background: radial-gradient(circle at 50% 50%, #06ffa5, #00d4ff 70%, transparent);
      bottom: 20%; left: 30%;
      animation-delay: -6s;
    }
    @keyframes float-orb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.15); }
      66% { transform: translate(-30px, 25px) scale(0.9); }
    }

    .login-btn-primary {

    (function() {
      if (window.location.protocol.startsWith('http')) {
        var origin = window.location.origin;
        var port = parseInt(window.location.port);
        if (port !== 5000 && port !== 80 && port !== 443 && origin.includes('localhost')) {
          API_BASE = origin.replace(/:\d+$/, ':5000') + '/api';
        } else {
          API_BASE = origin + '/api';
        }
      } else {
        API_BASE = 'http://localhost:5000/api';
      }
      // Allow runtime override via meta tag or window var for Vercel deployments
      if (window.CAPACITY_CONNECT_API_BASE) {
        API_BASE = window.CAPACITY_CONNECT_API_BASE;
      }
    })();

    // ==========================================
    // TOAST NOTIFICATION SYSTEM (localStorage)
    // ==========================================
    const TOAST_KEY = 'capacity_connect_toasts';
    const toastListeners = new Set();

    function getToasts() {
      try { return JSON.parse(localStorage.getItem(TOAST_KEY) || '[]'); } catch { return []; }
    }
    function saveToasts(toasts) {
      try { localStorage.setItem(TOAST_KEY, JSON.stringify(toasts)); } catch {}
      toastListeners.forEach(fn => fn(toasts));
    }
    function subscribeToToasts(fn) { toastListeners.add(fn); return () => toastListeners.delete(fn); }
    function showToast(message, type = 'success') {
      const id = Date.now() + Math.random();
      const toasts = getToasts();
      toasts.push({ id, message, type, createdAt: Date.now() });
      if (toasts.length > 5) toasts.shift();
      saveToasts(toasts);
      setTimeout(() => {
        saveToasts(getToasts().filter(t => t.id !== id));
      }, 3000);
    }

    function ToastContainer() {
      const [toasts, setToasts] = React.useState(getToasts());
      React.useEffect(() => subscribeToToasts(setToasts), []);
      if (!toasts.length) return null;
      const colors = {
        success: 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white dark:text-white shadow-lg shadow-cyan-500/30',
        error: 'bg-crimson text-white dark:text-white',
        info: 'bg-electric-blue text-white dark:text-white'
      };
      return (
        <div className="fixed top-20 right-4 z-[60] space-y-2 w-80">
          {toasts.map(t => (
            <div key={t.id} className={(colors[t.type] || colors.success) + "px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transition-all duration-300"}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // API HELPERS (with auth token)
    // ==========================================
    function fetchWithToken(url, options = {}) {
      const token = localStorage.getItem('capacity_connect_token');
      const headers = { ...(options.headers || {}) };
      if (options.headers) delete options.headers;
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (options.body && !headers['Content-Type'] && !headers['content-type']) {
        headers['Content-Type'] = 'application/json';
      }
      return fetch(url, { ...options, headers });
    }
    async function apiRequest(url, options = {}) {
      try {
        const res = await fetchWithToken(url, options);
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          const err = new Error(data?.message || data?.error || 'Request failed');
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      } catch (networkErr) {
        if (networkErr.name === 'TypeError' && networkErr.message.includes('fetch')) {
          const err = new Error('Cannot reach backend API. Check that the backend server is running and reachable from this origin.');
          err.status = 0;
          err.isNetworkError = true;
          throw err;
        }
        throw networkErr;
      }
    }

    }
    function saveProgress(state) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch {} }
    function getContinueWatching() {
      const progress = loadProgress();
      if (!progress.currentCourseId || !progress.currentLectureId) return null;
      return { courseId: progress.currentCourseId, lectureId: progress.currentLectureId, timestamp: progress.currentTimestamp, completedLectures: progress.completedLectures || [] };
    }

       React.useEffect(() => {
         let cancelled = false;
         setLoading(true); setDashError(null);
         apiRequest(`${API_BASE}/user/dashboard/${userId}`)
           .then(data => { if (!cancelled) setDash(data); })
           .catch(err => { if (!cancelled) { console.error('[Dashboard]', err); setDashError(err.message); }})
           .finally(() => { if (!cancelled) setLoading(false); });
         return () => { cancelled = true; };
       }, [userId]);

const fetchAIRecommendations = async () => {
        setAiLoading(true); setAiError(null);
        try {
          // Fetch actual user quiz results and enrolled progress to build real weak areas
          let weakAreas = [];
          try {
            const quizRes = await apiRequest(`${API_BASE}/user/quiz-results/${userId}`);
            if (quizRes?.weakAreas?.length) {
              weakAreas = quizRes.weakAreas;
            }
          } catch {}

          // Fallback: derive weak areas from enrolled course progress
          if (!weakAreas.length && dash?.enrolledCourses?.length) {
            weakAreas = dash.enrolledCourses
              .filter(c => (c.progressPercent || 0) < 70)
              .map(c => ({ topic: c.title, score: c.progressPercent || 0, courseId: c.id }));
          }

          // Final fallback to sample data if nothing available
          if (!weakAreas.length) {
            weakAreas = [{ topic: 'Security & Compliance', score: 45, courseId: 2 }, { topic: 'Distributed Systems', score: 60, courseId: 3 }, { topic: 'Cloud Architecture', score: 68, courseId: 1 }];
          }

          const res = await apiRequest(`${API_BASE}/ai/recommendations`, { method: 'POST', body: JSON.stringify({ userId, weakAreas, numRecommendations: 3 }) });
          setAiRecs(res);

    function Page5Player({ user, courseId, onBack }) {
      const PASSING_SCORE_THRESHOLD = 80;
      const [player, setPlayer] = React.useState(null);
      const [lectureIndex, setLectureIndex] = React.useState(0);
      const [currentTimestamp, setCurrentTimestamp] = React.useState(0);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);
      const progress = React.useRef(loadProgress());

      const [quizQuestions, setQuizQuestions] = React.useState([]);
      const [quizStarted, setQuizStarted] = React.useState(false);
      const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState({});
      const [quizFinished, setQuizFinished] = React.useState(false);
      const [quizScore, setQuizScore] = React.useState(0);
      const [bestScore, setBestScore] = React.useState(null);
      const [reportModal, setReportModal] = React.useState(null);
      const [revealMode, setRevealMode] = React.useState(false);

      React.useEffect(() => {
        apiRequest(`${API_BASE}/courses/player/${courseId}`).then(setPlayer).catch(err => console.error('[Player]', err.message));
      }, [courseId]);

      React.useEffect(() => {
        const saved = progress.current;
        if (saved.currentCourseId === Number(courseId) && saved.currentLectureId) {
          setLectureIndex(saved.currentLectureId - 1);
          setCurrentTimestamp(saved.currentTimestamp || 0);
        }
      }, [courseId]);

      React.useEffect(() => {
        if (!player || !videoRef.current) return;
        const video = videoRef.current;
        if (currentTimestamp > 0) video.currentTime = currentTimestamp;
      }, [player]);

      React.useEffect(() => {
        if (!player) return;
        const video = videoRef.current;
        if (!video) return;
        const onTimeUpdate = () => {
          if (timerRef.current) return;
          timerRef.current = setTimeout(() => {
            const state = loadProgress();
            state.currentCourseId = Number(courseId);
            state.currentLectureId = lectureIndex + 1;
            state.currentTimestamp = Math.floor(video.currentTime);
            saveProgress(state);
            progress.current = state;
            timerRef.current = null;
          }, 5000);
        };
        const onPause = () => {
          const state = loadProgress();
          state.currentCourseId = Number(courseId);
          state.currentLectureId = lectureIndex + 1;
          state.currentTimestamp = Math.floor(video.currentTime);
          saveProgress(state);
          progress.current = state;
        };
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('pause', onPause);
        return () => {
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('pause', onPause);
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, [player, courseId, lectureIndex]);

      const markComplete = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state);
        progress.current = state;
        setLectureIndex(nextIndex);
        setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
      };

      const startQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setQuizStarted(true); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const handleQuizAnswer = (qIdx, optIdx) => { if (quizFinished) return; setUserAnswers(prev => ({ ...prev, [qIdx]: optIdx })); };
      const finishQuiz = () => {
        let correctCount = 0; const wrongTopics = new Set();
        quizQuestions.forEach((q, i) => { if (userAnswers[i] === q.correctIndex) { correctCount++; } else { wrongTopics.add(q.topic); } });
        const score = Math.round((correctCount / quizQuestions.length) * 100);
        setQuizScore(score);
        setBestScore(prev => (prev === null || score > prev ? score : prev));
        setQuizFinished(true); setRevealMode(true);
        setReportModal(generateAIReport(score, Array.from(wrongTopics)));
      };
      const retakeQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const takeNewQuiz = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state); progress.current = state;
        setLectureIndex(nextIndex); setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
        showToast('Module complete. Loading next module...', 'success');
      };
      const prevQuestion = () => { if (currentQuestionIndex > 0) setCurrentQuestionIndex(prev => prev - 1); };
      const nextQuestion = () => { if (currentQuestionIndex < quizQuestions.length - 1) setCurrentQuestionIndex(prev => prev + 1); };

      const currentQ = quizQuestions[currentQuestionIndex];
      const isFirstQuestion = currentQuestionIndex === 0;
      const isLastQuestion = currentQuestionIndex === quizQuestions.length - 1;
      const allQuestionsAnswered = quizQuestions.every((_, i) => userAnswers[i] !== undefined);

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-black glass-card border border-electric-blue/10 px-3 py-1.5 rounded-lg">← Back</button>
          {player && (
            <div className="space-y-6">
              <div className="glass-card rounded-2xl border border-electric-blue/10 p-6">
                <h1 className="text-2xl font-extrabold text-white dark:text-white">{player.title}</h1>
                <p className="text-xs text-slate-400 mt-1">Module {lectureIndex + 1} of {player.syllabus?.length || 1}</p>
              </div>
              <div className="bg-black rounded-2xl overflow-hidden aspect-video max-h-[420px] flex items-center justify-center">
                <video ref={videoRef} controls src={player.videoUrl} className="w-full h-full object-contain" onPlay={() => setIsPlaying(true)} onPause={() => setIsPlaying(false)} />
              </div>
              <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black text-white dark:text-white">Lecture {lectureIndex + 1}</h2>
                  <button onClick={markComplete} className="px-4 py-2 bg-electric-blue text-white dark:text-white text-xs font-black rounded-lg btn-micro">Mark as Complete</button>
                </div>
                <p className="text-sm text-slate-300">{player.syllabus?.[lectureIndex] || 'Complete this lecture to continue.'}</p>
                <p className="text-[10px] text-slate-400 dark:text-slate-400">Progress auto-saved. Resume time: {Math.floor(currentTimestamp)}s</p>
              </div>

               <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                 <div className="flex items-center justify-between">
                   <h2 className="text-lg font-black text-white">Knowledge Check Quiz</h2>
                    {!quizStarted && <button onClick={startQuiz} className="px-4 py-2 bg-isro-orange text-white dark:text-white text-xs font-black rounded-lg btn-micro">Start Quiz</button>}
                 </div>

                 {quizStarted && quizQuestions.length > 0 && !quizFinished && (
                   <div className="space-y-4">
                     <div className="flex items-center justify-between">
                       <span className="text-xs font-black text-slate-400 uppercase">Question {currentQuestionIndex + 1} of {quizQuestions.length}</span>
                       <span className="text-xs font-black text-slate-400">{Object.keys(userAnswers).length} of {quizQuestions.length} answered</span>
                     </div>
                     <p className="text-sm font-semibold text-slate-200">{currentQ.question}</p>
                     <div className="space-y-2">
                       {currentQ.options?.map((opt, i) => {
                         const isSelected = userAnswers[currentQuestionIndex] === i;
                         let borderStyle = 'border-electric-blue/10 hover:border-isro-orange glass-card';
                         if (isSelected) borderStyle = 'border-isro-orange bg-electric-blue/10 dark:bg-isro-orange-dark/30';
                         return (
                           <label key={i} className={"flex items-start gap-3 p-3 rounded-xl border-2 transition cursor-pointer " + (borderStyle)}>
                             <input type="radio" name={"q" + currentQuestionIndex} disabled={quizFinished} checked={isSelected} onChange={() => handleQuizAnswer(currentQuestionIndex, i)} className="mt-1 w-4 h-4 text-isro-orange" />
                             <div className="flex-1 text-sm text-slate-200 leading-snug">{opt}</div>
                           </label>
                         );
                       })}
                     </div>
                     <div className="flex flex-wrap gap-2">
                       <button onClick={prevQuestion} disabled={isFirstQuestion} className="px-4 py-2 bg-space-blue/50 text-xs font-black text-white rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Previous Question</button>
                       {isLastQuestion ? (
                         <button onClick={finishQuiz} disabled={!allQuestionsAnswered} className="px-4 py-2 bg-electric-blue text-white dark:text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Finish Quiz & See Results</button>
                       ) : (
                         <button onClick={nextQuestion} disabled={userAnswers[currentQuestionIndex] === undefined} className="px-4 py-2 bg-slate-900 text-white dark:text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Next Question</button>
                       )}
                     </div>
                   </div>
                 )}

                 {quizFinished && (
                   <div className="space-y-4">
                     <div className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20">
                       <p className="text-xs font-black uppercase text-slate-400">Final Score</p>
                       <p className="text-3xl font-extrabold text-white">{quizScore}%</p>
                       <p className="text-xs text-slate-400">Best attempt: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                     </div>
                     <div className="space-y-2">
                       <p className="text-xs font-black uppercase text-slate-400">Answer Review</p>
                       {quizQuestions.map((q, i) => {
                         const userAnswer = userAnswers[i];
                         const isCorrect = userAnswer === q.correctIndex;
                         const isAnswered = userAnswer !== undefined;
                         return (
                           <div key={i} className={"p-3 rounded-xl border-2 " + (isCorrect ? 'border-emerald-500 bg-electric-blue/10 dark:bg-emerald-900/30' : 'border-red-500 bg-crimson/10 dark:bg-red-900/30')}>
                             <p className="text-xs font-semibold text-slate-200 mb-1">Q{i + 1}: {q.question}</p>
                     <p className="text-xs text-slate-300 dark:text-slate-400">Your answer: {isAnswered ? q.options[userAnswer] : 'Not answered'}</p>
                             {!isCorrect && <p className="text-xs text-electric-blue font-black">Correct answer: {q.options[q.correctIndex]}</p>}
                           </div>
                         );
                       })}
                     </div>
                     <div className="flex gap-3">
                   <button onClick={retakeQuiz} className="px-4 py-2 bg-space-blue/50 text-xs font-black text-white rounded-lg btn-micro">Retake Quiz</button>
                       {quizScore >= PASSING_SCORE_THRESHOLD && <button onClick={takeNewQuiz} className="px-4 py-2 bg-electric-blue text-white dark:text-white text-xs font-black rounded-lg btn-micro">Take New Quiz ▶</button>}
                     </div>
                   </div>
                 )}
               </div>
             </div>
           )}

          {reportModal && (
               <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
               <div className="glass-card rounded-3xl border border-electric-blue/10 shadow-2xl max-w-2xl w-full p-8 space-y-6">
                 <div className="text-center">
                   <p className="text-xs font-black uppercase tracking-widest text-slate-400">Quiz Assessment Report</p>
                   <h2 className="text-3xl font-extrabold text-white mt-2">{reportModal.badge}</h2>
                   <p className="text-sm text-slate-400 mt-1">Final Score: {quizScore}% | Best: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                 </div>
                 <div className="bg-space-blue/20 rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                   <div>
                     <h3 className="text-xs font-black uppercase text-slate-400 mb-2">Key Strengths</h3>
                     <ul className="space-y-1">
                       {reportModal.strengths.map((s, i) => (<li key={i} className="text-sm text-slate-300 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-electric-blue/100"></span>{s}</li>))}
                     </ul>
                   </div>
                   <div className="border-t border-electric-blue/10 pt-4">
                     <h3 className="text-xs font-black uppercase text-slate-400 mb-2">Areas for Improvement</h3>
                     <ul className="space-y-1">
                       {reportModal.improvements.length ? reportModal.improvements.map((s, i) => (<li key={i} className="text-sm text-slate-300 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-crimson/100"></span>{s}</li>)) : <li className="text-sm text-slate-400">No significant weak areas detected.</li>}
                     </ul>
                   </div>
                   <div className="border-t border-electric-blue/10 pt-4">
                     <h3 className="text-xs font-black uppercase text-slate-400 mb-2">Recommended Next Action</h3>
                     <p className="text-sm text-slate-200 font-semibold">{reportModal.recommendation}</p>
                   </div>
                 </div>
                 <div className="flex justify-end gap-3">
                   <button onClick={() => setReportModal(null)} className="px-5 py-2 bg-space-blue/50 text-xs font-black text-white rounded-lg btn-micro">Close Report</button>
                   {quizScore < PASSING_SCORE_THRESHOLD ? (
                     <button onClick={retakeQuiz} className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white dark:text-white text-xs font-black rounded-lg btn-micro">Review & Retake Quiz</button>
                   ) : (
                      <button onClick={takeNewQuiz} className="px-5 py-2 bg-electric-blue text-white dark:text-white text-xs font-black rounded-lg btn-micro">Proceed to Next Module ▶</button>
                   )}
                 </div>
               </div>
             </div>
           )}
        </div>
      );
    }

    // ==========================================
    // SCREEN 6: CERTIFICATE (shared)
    // ==========================================
    function Screen6Certificate({ user, userId, courseId, onBack }) {
      const [cert, setCert] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      React.useEffect(() => {
        apiRequest(`${API_BASE}/certificate/${userId}/${courseId}`).then(setCert).catch(err => console.error('[Cert]', err.message)).finally(() => setLoading(false));
      }, [userId, courseId]);

      const downloadPDF = () => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(22);
          doc.text('Certificate of Completion', 105, 40, { align: 'center' });
          doc.setFontSize(12);
          doc.text('Capacity Connect Accreditation', 105, 50, { align: 'center' });
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(14);
          doc.text('This is proudly awarded to', 105, 65, { align: 'center' });
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(20);
          doc.text(cert?.studentName || '', 105, 78, { align: 'center' });
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(13);
          doc.text(cert?.courseTitle || '', 105, 95, { align: 'center' });
          doc.setFontSize(12);
          doc.text(`Grade: ${cert?.grade || ''}`, 105, 105, { align: 'center' });
          doc.setFontSize(11);
          doc.text(`Authority: ${cert?.issueAuthority || ''}`, 20, 130);
          doc.text(`Date: ${cert?.completionDate || ''}`, 20, 138);
          doc.text(`Certificate ID: ${cert?.certificateId || ''}`, 20, 146);
          doc.text(`Verify: ${cert?.verificationUrl || ''}`, 20, 154);
          doc.save(`certificate-${cert?.certificateId || userId}.pdf`);
        } catch (err) {
          showToast('PDF download failed. Use Print instead.', 'error');
        }
      };

      if (loading) return <div className="py-20 text-center text-sm text-slate-400">Generating digital certificate...</div>;

return (
        <div className="max-w-3xl mx-auto px-4 py-6 md:py-8 space-y-6 bg-orbital-bg min-h-screen orbital-grid">
          <button onClick={onBack} className="text-xs font-black bg-cyan-500/10 border border-cyan-400/30 px-3 py-1.5 rounded-lg text-cyan-300 hover:bg-cyan-500/20 btn-micro transition-all">← Back to Dashboard</button>
          <div className="mission-badge rounded-3xl p-8 sm:p-12 text-center bg-slate-900/60 border-2 border-amber-500/30 backdrop-blur-md relative overflow-hidden" style={{boxShadow: '0 0 60px rgba(251,191,36,0.1), inset 0 0 60px rgba(251,191,36,0.05)'}}>
            {/* Holographic seal */}
            <div className="absolute top-6 right-6">
              <div className="hologram-seal"><span>✓</span></div>
            </div>
            <div className="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 text-white dark:text-white mx-auto flex items-center justify-center text-2xl rounded-2xl mb-4 shadow-lg shadow-cyan-500/40">🎓</div>
            <p className="text-xs font-black uppercase tracking-widest text-cyan-400 font-mono">Interstellar Federation</p>
            <p className="text-[10px] text-slate-500 font-mono">Earth Sciences Clearance Division</p>
            <h1 className="text-3xl font-serif font-bold text-white dark:text-white mt-2">Certificate of Completion</h1>
            <p className="text-xs text-slate-400 mt-2">This is proudly awarded to</p>
            <h2 className="text-2xl font-black text-cyan-300 mt-1 underline decoration-amber-400 underline-offset-4">{cert?.studentName}</h2>
            <div className="my-5 p-3 rounded-xl bg-slate-900/50 border border-cyan-500/20 inline-block max-w-lg">
              <p className="font-black text-white dark:text-white text-sm">{cert?.courseTitle}</p>
              <p className="text-xs text-amber-400 font-black font-mono">GRADE: {cert?.grade}</p>
            </div>
            <div className="pt-6 border-t border-cyan-500/10 text-xs flex justify-between text-left">
              <div>
                <span className="text-slate-400 font-black uppercase text-[10px] font-mono">Authority</span>
                <p className="font-black text-white dark:text-white">{cert?.issueAuthority}</p>
                <p className="text-slate-400 font-mono">{cert?.completionDate}</p>
              </div>
              <div className="text-right">
                <span className="text-slate-400 font-black uppercase text-[10px] font-mono">Cert ID</span>
                <p className="font-mono font-black text-cyan-400">{cert?.certificateId}</p>
                <p className="text-amber-400 font-semibold">◆ Verified</p>
              </div>
            </div>
          </div>
          <div className="text-center flex flex-wrap items-center justify-center gap-3">
             <button onClick={downloadPDF} className="px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white dark:text-white rounded-xl text-xs font-black shadow-lg shadow-cyan-500/30 neon-glow btn-micro">⬇ Download PDF</button>
             <button onClick={() => window.print()} className="px-6 py-2 bg-slate-900/60 text-xs font-black rounded-lg border border-cyan-500/30 text-cyan-300 btn-micro hover:bg-cyan-500/10 transition-all">🖨️ Print Certificate</button>
           </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 7: ADMIN DASHBOARD (burgundy/dark theme)
    // ==========================================
    function Screen7Admin({ user, onBack, activeTab, setActiveTab }) {
      const [pendingUsers, setPendingUsers] = React.useState([]);
      const [allUsers, setAllUsers] = React.useState([]);
      const [stats, setStats] = React.useState(null);
      const [loading, setLoading] = React.useState({ pending: true, all: true, stats: true });
      const [processingIds, setProcessingIds] = React.useState(new Set());
      const [feedbackSummary, setFeedbackSummary] = React.useState(null);
      const [feedbackLoading, setFeedbackLoading] = React.useState(false);

      const fetchPendingUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, pending: true }));
        try { setPendingUsers((await apiRequest(`${API_BASE}/admin/pending-users`)).pendingUsers || []); } catch (err) { console.error('[Admin]', err.message); setPendingUsers([]); }
        finally { setLoading(l => ({ ...l, pending: false })); }
      }, []);

      const fetchAllUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, all: true }));
        try { setAllUsers((await apiRequest(`${API_BASE}/admin/users`)).users || []); } catch (err) { console.error('[Admin]', err.message); setAllUsers([]); }
        finally { setLoading(l => ({ ...l, all: false })); }
      }, []);

      const fetchStats = React.useCallback(async () => {
        setLoading(l => ({ ...l, stats: true }));
        try { setStats(await apiRequest(`${API_BASE}/admin/stats`)); } catch (err) { console.error('[Admin]', err.message); setStats(null); }
        finally { setLoading(l => ({ ...l, stats: false })); }
      }, []);

      const fetchFeedbackSummary = React.useCallback(async () => {
        setFeedbackLoading(true);
        try { setFeedbackSummary((await apiRequest(`${API_BASE}/feedback/admin/summary`)).summary || []); } catch (err) { console.error('[Admin] Feedback', err.message); setFeedbackSummary([]); }
        finally { setFeedbackLoading(false); }
      }, []);

      React.useEffect(() => { fetchPendingUsers(); fetchAllUsers(); fetchStats(); }, [fetchPendingUsers, fetchAllUsers, fetchStats]);

      React.useEffect(() => { if (activeTab === 'feedback') fetchFeedbackSummary(); }, [activeTab, fetchFeedbackSummary]);

      const handleApprove = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/approve`, { method: 'POST' });
          showToast('User approved', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'approved' } : u));
        } catch (err) { showToast(`Failed to approve: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const handleReject = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/reject`, { method: 'POST' });
          showToast('User rejected', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'rejected' } : u));
        } catch (err) { showToast(`Failed to reject: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const formatDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return '—'; } };
      const roleBadge = (r) => `<span className="px-2 py-0.5 rounded text-[10px] font-black uppercase ${r === 'admin' ? 'bg-red-500/20 text-red-300' : r === 'trainer' ? 'bg-amber-500/20 text-amber-300' : 'bg-teal-500/20 text-teal-300'}">${r}</span>`;
      const statusBadge = (s) => `<span className="px-2 py-0.5 rounded text-[10px] font-black ${s === 'pending' ? 'bg-amber-100 text-amber-800' : s === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${s}</span>`;
      const userDetail = (u) => { const parts = []; if (u.department) parts.push(`Dept: ${u.department}`); if (u.qualification) parts.push(u.qualification); if (u.skills) parts.push(`Skills: ${u.skills}`); if (u.subjects) parts.push(`Subjects: ${u.subjects}`); return parts.length ? parts.join(' • ') : '—'; };

return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8 bg-orbital-bg min-h-screen orbital-grid">
           <div className="flex justify-between items-center pb-6 border-b border-cyan-500/20">
             <div>
               <span className="px-2.5 py-0.5 rounded-full text-xs font-black font-mono bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">COMMAND CENTER • ADMIN</span>
               <h1 className="text-2xl sm:text-3xl font-extrabold text-white dark:text-white mt-1 font-mono tracking-wide">FLEET & PERSONNEL TELEMETRY</h1>
             </div>
             <div className="flex gap-2">
                <button onClick={() => setActiveTab('pending')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'pending' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white dark:text-white shadow-lg shadow-cyan-500/30 neon-glow' : 'bg-slate-900/60 text-slate-300 border border-cyan-500/20')}>Pending Approvals</button>
                <button onClick={() => setActiveTab('all')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'all' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white dark:text-white shadow-lg shadow-cyan-500/30 neon-glow' : 'bg-slate-900/60 text-slate-300 border border-cyan-500/20')}>All Personnel</button>
                <button onClick={() => setActiveTab('directory')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'directory' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white dark:text-white shadow-lg shadow-cyan-500/30 neon-glow' : 'bg-slate-900/60 text-slate-300 border border-cyan-500/20')}>Directory</button>
                <button onClick={() => setActiveTab('feedback')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'feedback' ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-white dark:text-white shadow-lg shadow-amber-500/30' : 'bg-slate-900/60 text-slate-300 border border-cyan-500/20')}>Feedback</button>
                <button onClick={onBack} className="px-4 py-2 bg-slate-900/60 text-cyan-300 rounded-xl text-xs font-black btn-micro border border-cyan-500/20 hover:bg-cyan-500/10">← Back to Learner View</button>
             </div>
           </div>

           {stats && !loading.stats && (
             <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
               <div className="hud-panel p-6 rounded-2xl">
                 <span className="text-xs text-slate-400 font-black uppercase font-mono">Total Fleet</span>
                 <p className="text-3xl font-extrabold font-mono text-cyan-400 mt-2">{stats?.totalUsers}</p>
               </div>
               <div className="hud-panel p-6 rounded-2xl">
                 <span className="text-xs text-slate-400 font-black uppercase font-mono">Active Operators</span>
                 <p className="text-3xl font-extrabold font-mono text-cyan-300 mt-2">{stats?.activeLearners}</p>
               </div>
                <div className="hud-panel hud-panel-amber p-6 rounded-2xl">
                  <span className="text-xs text-slate-400 font-black uppercase font-mono">Mission Success Rate</span>
                  <p className="text-3xl font-extrabold font-mono text-amber-400 mt-2">{stats?.completionRatePercent}%</p>
                </div>
               <div className="hud-panel p-6 rounded-2xl">
                 <span className="text-xs text-slate-400 font-black uppercase font-mono">Active Sectors</span>
                 <p className="text-3xl font-extrabold font-mono text-white dark:text-white mt-2">{stats?.totalCourses}</p>
               </div>
             </div>
           )}

{activeTab === 'pending' && (
              <div className="glass-card rounded-2xl border border-red-500/20 p-6 shadow-lg cosmic-card">
                <h2 className="text-base font-black text-white dark:text-white mb-5 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span>
                  Pending Approvals ({pendingUsers.length})
                </h2>
                {loading.pending ? (<div className="py-10 text-center text-sm text-slate-400">Loading...</div>) : pendingUsers.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No pending requests.</div>) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead><tr className="border-b border-red-500/30 text-slate-400 uppercase"><th className="py-3 px-3">Employee</th><th className="py-3 px-3">Role</th><th className="py-3 px-3">Details</th><th className="py-3 px-3">Signup</th><th className="py-3 px-3">Actions</th></tr></thead>
                      <tbody className="divide-y divide-red-500/10">
                        {pendingUsers.map(u => { const isProcessing = processingIds.has(u.id); return (
                          <tr key={u.id} className="hover:bg-red-500/5 transition-colors group">
                           <td className="py-3 px-3 font-bold text-white dark:text-white group-hover:text-red-300 transition-colors">{u.name}</td>
                           <td className="py-3 px-3" dangerouslySetInnerHTML={{ __html: roleBadge(u.role) }} />
                           <td className="py-3 px-3 text-slate-300">{userDetail(u)}</td>
                           <td className="py-3 px-3 text-slate-400">{formatDate(u.created_at)}</td>
                           <td className="py-3 px-3 flex gap-2">
                             <button onClick={() => handleApprove(u.id)} disabled={isProcessing} className="px-3.5 py-1.5 rounded-lg text-xs font-black bg-gradient-to-r from-emerald-500 to-green-500 text-white dark:text-white shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 disabled:opacity-60 btn-micro transition-all">
                               {isProcessing ? 'Processing...' : '✓ Approve'}
                             </button>
                             <button onClick={() => handleReject(u.id)} disabled={isProcessing} className="px-3.5 py-1.5 rounded-lg text-xs font-black bg-gradient-to-r from-pink-500 to-rose-600 text-white dark:text-white shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 disabled:opacity-60 btn-micro transition-all">
                               {isProcessing ? 'Processing...' : '✗ Reject'}
                             </button>
                           </td>
                         </tr>
                       ); })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

{activeTab === 'all' && (

    function Screen8SkillGap({ user, userId, onBack }) {
      const [resumeText, setResumeText] = React.useState('');

      const handleFileChange = (e) => { const file = e.target.files?.[0]; if (!file) return; setFileName(file.name); const reader = new FileReader(); reader.onload = (ev) => setResumeText(ev.target.result); reader.readAsText(file); };

      const handleScan = async () => {
        if (!resumeText.trim()) { setError('Please paste your resume/profile text or upload a file.'); return; }
        setScanning(true); setError(null); setResult(null);
        try {
          const data = await apiRequest(`${API_BASE}/ai/skill-gap-analysis`, { method: 'POST', body: JSON.stringify({ resumeText, userId }) });
          setResult(data);
        } catch (err) { setError(err.message); } finally { setScanning(false); }
      };

        if (enrolled.includes(courseId)) return;
        setEnrolled([...enrolled, courseId]);
        apiRequest(`${API_BASE}/user/enroll`, { method: 'POST', body: JSON.stringify({ userId, courseId }) }).catch(() => {});
        showToast(`Enrolled in: ${title}`, 'success');
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-8">
          <div className="flex items-center justify-between pb-6 border-b border-electric-blue/10">
            <div>
              <span className={"px-3 py-1.5 rounded-full text-xs font-black " + (user?.role === 'trainee' ? 'bg-gradient-to-r from-teal-500/20 to-cyan-500/20 text-teal-300 border border-teal-400/30' : 'bg-gradient-to-r from-amber-500/20 to-orange-500/20 text-amber-300 border border-amber-400/30')}>AI Skill Gap Scanner</span>

               {fileName && <span className="text-xs text-slate-400">{fileName}</span>}

              <label className="block text-sm font-black text-white mb-1">Or paste resume text:</label>

            </div>
            {error && <p className="text-xs text-red-400 font-black">{error}</p>}
              <button onClick={handleScan} disabled={scanning || !resumeText.trim()} className={"px-6 py-2.5 rounded-xl text-xs font-black shadow transition " + (scanning || !resumeText.trim() ? 'bg-space-blue/50 text-slate-400 cursor-not-allowed' : 'btn-accent')}>
              {scanning ? 'Scanning with AI...' : 'Scan for Skills & Recommend Pathways'}

                 <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                     {result.unrecognized_skills && result.unrecognized_skills.length > 0 && (

                       </div>
                     )}
                   </div>
                 </div>
                 {result.skill_categories && result.skill_categories.length > 0 && (
                   <div className="mt-4 pt-4 border-t border-electric-blue/10">
                     <h3 className="text-xs font-black uppercase text-slate-400 mb-2">Skill Categories Detected</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {result.skill_categories.map((c, i) => (

              </div>

               <div className="glass-card rounded-2xl border border-cyan-500/20 shadow-lg p-6 cosmic-card">
                 <h3 className="text-base font-black text-white mb-4">Recommended Courses for Auto-Enrollment</h3>
                 <div className="space-y-3">{result.recommendedCourses?.map((c) => { const isEnrolled = enrolled.includes(c.courseId);                     const priorityColor = c.priority === 'high' ? 'bg-isro-orange text-white dark:text-white' : c.priority === 'medium' ? 'bg-gradient-to-r from-amber-500/20 to-orange-500/20 text-amber-300 border border-amber-400/30' : 'bg-electric-blue/10 text-slate-300'; return (

      const [uploadLoading, setUploadLoading] = React.useState(false);

      const fetchStudents = React.useCallback(async () => {
        setLoading(l => ({ ...l, roster: true }));
        try {
          setStudents((await apiRequest(`${API_BASE}/trainer/students`)) || []);
        } catch (err) { console.error('[Trainer]', err.message); setStudents([]); }
        finally { setLoading(l => ({ ...l, roster: false })); }
      }, []);

      const fetchQuestions = React.useCallback(async () => {
        setLoading(l => ({ ...l, questions: true }));
        try {
          setQuestions((await apiRequest(`${API_BASE}/trainer/quiz-questions`)) || []);
        } catch (err) { console.error('[Trainer]', err.message); setQuestions([]); }
        finally { setLoading(l => ({ ...l, questions: false })); }
      }, []);

      const fetchCourses = React.useCallback(async () => {
        setLoading(l => ({ ...l, courses: true }));
        try {
          setCourses((await apiRequest(`${API_BASE}/materials/courses`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setCourses([]); }
        finally { setLoading(l => ({ ...l, courses: false })); }
      }, []);

      const fetchMyMaterials = React.useCallback(async () => {
        setLoading(l => ({ ...l, materials: true }));
        try {
          setMaterials((await apiRequest(`${API_BASE}/materials/my-materials`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setMaterials([]); }
        finally { setLoading(l => ({ ...l, materials: false })); }
      }, []);

      const handleUploadSubmit = async (e) => {
        e.preventDefault();
        if (!uploadForm.course_id || !uploadForm.title) {
          showToast('Please select a course and enter a title.', 'error');
          return;
        }
        setUploadLoading(true);
        try {
          const payload = {
            course_id: uploadForm.course_id,
            type: uploadForm.type,
            title: uploadForm.title.trim(),
            description: uploadForm.description.trim() || null,
            url: uploadForm.url.trim() || null,
            content: uploadForm.content.trim() || null,
          };
          if (uploadForm.file) {
            payload.file_name = uploadForm.file.name;
            payload.mime_type = uploadForm.file.type;
            payload.file_size = uploadForm.file.size;
          }
          await apiRequest(`${API_BASE}/materials`, { method: 'POST', body: JSON.stringify(payload) });
          showToast(`Uploaded ${uploadForm.type} material.`, 'success');
          setUploadForm({ course_id: '', type: 'video', title: '', description: '', url: '', content: '', file: null });
          fetchMyMaterials();
        } catch (err) {
          showToast(`Upload failed: ${err.message}`, 'error');
        } finally {
          setUploadLoading(false);
        }
      };

        try {
          await apiRequest(`${API_BASE}/materials/${id}`, { method: 'DELETE' });
          showToast('Material deleted.', 'success');
          fetchMyMaterials();
        } catch (err) {
          showToast(`Delete failed: ${err.message}`, 'error');

return (

    // ==========================================
    // SCREEN 12: QUIZ (Trainee standalone quiz feature)
    // ==========================================
    function Screen12Quiz({ user, onBack }) {
      const [stage, setStage] = React.useState('start');
      const [selectedSubject, setSelectedSubject] = React.useState(null);
      const [questionCount, setQuestionCount] = React.useState('10');
      const [questions, setQuestions] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [answers, setAnswers] = React.useState({});
      const [finished, setFinished] = React.useState(false);
      const [score, setScore] = React.useState(0);
      const [saving, setSaving] = React.useState(false);
      const [saveError, setSaveError] = React.useState(null);

      const allSubjects = [
        'General Science',
        'Mathematics',
        'Geography',
        'History',
        'Current Affairs',
        'Logical Reasoning',
        'Computer Basics'
      ];

      const subjectIcons = {
        'General Science': '🔬',
        'Mathematics': '📐',
        'Geography': '🌍',
        'History': '📜',
        'Current Affairs': '📰',
        'Logical Reasoning': '🧩',
        'Computer Basics': '💻'
      };

      function getSubjectIcon(subject) {
        return subjectIcons[subject] || '📚';
      }

      const handleStartQuiz = () => {
        if (!selectedSubject) return;
        const subjectQuestions = getQuestionsBySubject(selectedSubject);
        const shuffled = shuffleArray(subjectQuestions);
        const picked = shuffled.slice(0, Math.min(parseInt(questionCount), shuffled.length));
        setQuestions(picked);
        setCurrentIndex(0);
        setAnswers({});
        setFinished(false);
        setScore(0);
        setStage('quiz');
      };

      const handleAnswer = (qIdx, optIdx) => {
        if (finished) return;
        setAnswers(prev => {
          const next = { ...prev };
          next[qIdx] = optIdx;
          return next;
        });
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          finishQuiz();
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      const finishQuiz = async () => {
        let correct = 0;
        questions.forEach((q, i) => {
          if (answers[i] === q.correctIndex) {
            correct++;
          }
        });
        const pct = Math.round((correct / questions.length) * 100);
        setScore(pct);
        setFinished(true);
        setStage('result');

        // Save to quiz_attempts table
        setSaving(true);
        setSaveError(null);
        try {
          const token = localStorage.getItem('capacity_connect_token');
          if (token) {
            const response = await fetch(API_BASE + '/quiz-attempts', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({
                user_id: user.id,
                topic: selectedSubject,
                score: pct,
                total: questions.length,
                correct: correct
              })
            });
            if (!response.ok) {
              const err = await response.json().catch(() => ({}));
              throw new Error(err.message || 'Failed to save quiz result');
            }
          }
        } catch (err) {
          setSaveError(err.message || 'Failed to save quiz result');
        } finally {
          setSaving(false);
        }
      };

      const handleRetrySameTopic = () => {
        const subjectQuestions = getQuestionsBySubject(selectedSubject);
        const shuffled = shuffleArray(subjectQuestions);
        const picked = shuffled.slice(0, Math.min(parseInt(questionCount), shuffled.length));
        setQuestions(picked);
        setCurrentIndex(0);
        setAnswers({});
        setFinished(false);
        setScore(0);
        setStage('quiz');

      const handleChooseAnotherTopic = () => {

        setSelectedSubject(null);
        setQuestions([]);
        setCurrentIndex(0);
        setAnswers({});

        setScore(0);

      const currentQuestion = questions[currentIndex];

      const answeredCount = Object.keys(answers).length;
      const answeredText = answeredCount + ' of ' + questions.length + ' answered';

      const cardClass = 'glass-card border border-electric-blue/20 rounded-2xl p-6 sm:p-8';
      const progressBarContainerClass = 'w-full bg-slate-800 rounded-full h-2 overflow-hidden mb-6';
      const progressBarFillClass = 'bg-gradient-to-r from-teal-500 to-cyan-600 h-2 rounded-full transition-all duration-300';
      const questionCardClass = 'glass-card border border-electric-blue/10 rounded-xl p-6 mb-6';
      const optionLabelClassBase = 'flex items-start gap-3 p-4 rounded-xl border-2 transition cursor-pointer ';
      const buttonPrimaryClass = 'px-6 py-3 bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-400 hover:to-cyan-500 text-white dark:text-white rounded-xl font-black text-sm btn-micro shadow-lg shadow-teal-500/30 transition';
      const buttonSecondaryClass = 'px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white dark:text-white rounded-xl font-black text-sm btn-micro border border-electric-blue/20 transition';
      const buttonDisabledClass = 'px-6 py-3 bg-slate-700 text-slate-500 rounded-xl font-black text-sm cursor-not-allowed';
      const navButtonContainerClass = 'flex flex-wrap gap-3 mt-6';
      const resultScoreClass = 'text-5xl font-extrabold text-white dark:text-white';
      const resultSubtextClass = 'text-slate-400 mt-2';
      const reviewItemCorrectClass = 'p-4 rounded-xl border-2 border-emerald-500 bg-emerald-500/10';
      const reviewItemIncorrectClass = 'p-4 rounded-xl border-2 border-red-500 bg-red-500/10';
      const reviewItemUnansweredClass = 'p-4 rounded-xl border-2 border-amber-500 bg-amber-500/10';
      const subjectCardBaseClass = 'p-4 rounded-xl border-2 transition cursor-pointer text-center ';
      const subjectCardSelectedClass = subjectCardBaseClass + 'border-teal-500 bg-teal-500/10';
      const subjectCardUnselectedClass = subjectCardBaseClass + 'border-electric-blue/10 hover:border-teal-500 hover:bg-electric-blue/5';
      const subjectIconClass = 'text-3xl mb-2 block';

      if (stage === 'start') {
        return (
          <div className={startScreenClass}>
            <div className={cardClass}>
              <div className="text-center mb-8">
                <span className="text-5xl mb-4 block">❓</span>
                <h1 className="text-3xl font-extrabold text-white dark:text-white mb-2">Knowledge Quiz</h1>
                <p className="text-slate-400">Select a topic and number of questions to begin</p>
              </div>

              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-3">
                    Choose a topic
                  </label>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                    {allSubjects.map((subject) => {
                      const isSelected = selectedSubject === subject;
                      let subjectCardClass = subjectCardUnselectedClass;
                      if (isSelected) subjectCardClass = subjectCardSelectedClass;
                      return (
                        <button
                          key={subject}
                          type="button"
                          onClick={() => setSelectedSubject(subject)}
                          className={subjectCardClass}
                        >
                          <span className={subjectIconClass}>{getSubjectIcon(subject)}</span>
                          <span className="text-sm font-semibold text-white dark:text-white">{subject}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-3">
                    How many questions would you like to attempt?
                  </label>
                  <select
                    value={questionCount}
                    onChange={(e) => setQuestionCount(e.target.value)}
                    className="w-full px-4 py-3 bg-slate-900 border border-electric-blue/30 rounded-xl text-white dark:text-white text-base focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
                  >
                    <option value="5">5 questions</option>
                    <option value="10">10 questions</option>
                    <option value="15">15 questions</option>
                    <option value="20">20 questions</option>
                  </select>

                <div className="text-center">
                  <button
                    onClick={handleStartQuiz}

                    className={selectedSubject ? buttonPrimaryClass : buttonDisabledClass}

                    Start Quiz
                  </button>
                </div>

                <div className="text-center text-xs text-slate-500">
                  Available topics: General Science, Mathematics, Geography, History, Current Affairs, Logical Reasoning, Computer Basics

              </div>
            </div>

        );
      }

      if (stage === 'quiz') {
        const percent = Math.round(((currentIndex + 1) / questions.length) * 100);
        let progressBarFillStyle = { width: percent + '%' };
        let optionLabelClass = '';
        let isSelected = false;

        return (
          <div className={quizScreenClass}>
            <div className={cardClass}>
              <div className="mb-4">

                <div className={progressBarContainerClass}>
                  <div className={progressBarFillClass} style={progressBarFillStyle}></div>
