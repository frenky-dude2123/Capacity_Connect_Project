              <div className={questionCardClass}>
                <p className="text-lg font-semibold text-white dark:text-white mb-6">{currentQuestion.question}</p>
                <div className="space-y-3">
                  {currentQuestion.options.map((opt, i) => {

                    optionLabelClass = optionLabelClassBase;

                    } else {
                      optionLabelClass = optionLabelClass + 'border-electric-blue/10 hover:border-teal-500';
                    }
                    return (
                      <label key={i} className={optionLabelClass}>
                        <input
                          type="radio"
                          name={'q' + currentIndex}
                          checked={isSelected}
                          onChange={() => handleAnswer(currentIndex, i)}

                    Next Question

              </div>
            </div>
          </div>
        );
      }

      if (stage === 'result') {
        const correctCount = questions.filter((q, i) => answers[i] === q.correctIndex).length;
        const wrongCount = questions.filter((q, i) => answers[i] !== undefined && answers[i] !== q.correctIndex).length;
        const unansweredCount = questions.filter((q, i) => answers[i] === undefined).length;

        let resultIcon = '📚';
        if (score >= 70) resultIcon = '🎉';
        else if (score >= 50) resultIcon = '👍';

        return (
          <div className={resultScreenClass}>
            <div className={cardClass}>
              <div className="text-center mb-8">
                <span className="text-5xl mb-4 block">{resultIcon}</span>
                <h1 className="text-3xl font-extrabold text-white dark:text-white mb-2">Quiz Complete!</h1>
                <p className={resultScoreClass}>{score}%</p>
                <p className={resultSubtextClass}>
                  {correctCount} correct, {wrongCount} incorrect, {unansweredCount} unanswered out of {questions.length}
                </p>
                {saveError && (
                  <p className="text-xs text-red-400 mt-2">Save failed: {saveError}</p>
                )}
                {saving && !saveError && (
                  <p className="text-xs text-teal-400 mt-2">Saving result...</p>
                )}
              </div>

              <div className="space-y-3 mb-8 max-h-96 overflow-y-auto">
                <p className="text-xs font-black uppercase text-slate-400 mb-3">Answer Review</p>
                {questions.map((q, i) => {
                  const userAnswer = answers[i];
                  const isCorrect = userAnswer === q.correctIndex;
                  const isAnswered = userAnswer !== undefined;
                  let reviewClass = reviewItemIncorrectClass;
                  if (isCorrect) {
                    reviewClass = reviewItemCorrectClass;
                  } else if (!isAnswered) {
                    reviewClass = reviewItemUnansweredClass;
                  }
                  return (
                    <div key={i} className={reviewClass}>
                      <p className="text-sm font-semibold text-white dark:text-white mb-2">Q{i + 1}: {q.question}</p>
                      <p className="text-sm text-slate-300 mb-1">
                        <span className="font-medium">Your answer:</span> {isAnswered ? q.options[userAnswer] : 'Not answered'}
                      </p>
                      {!isCorrect && (
                        <p className="text-sm text-teal-400 font-semibold">
                          Correct answer: {q.options[q.correctIndex]}
                        </p>
                      )}
                      <p className="text-xs text-slate-500 mt-1">Subject: {q.subject}</p>
                    </div>
                  );
                })}
              </div>

              <div className="flex flex-col sm:flex-row gap-3 justify-center">
                <button
                  onClick={handleRetrySameTopic}
                  className={buttonPrimaryClass}
                >
                  Retry Same Topic
                </button>
                <button
                  onClick={handleChooseAnotherTopic}
                  className={buttonSecondaryClass}
                >
                  Choose Another Topic
                </button>
                <button
                  onClick={onBack}
                  className={buttonPrimaryClass}
                >
                  Back to Dashboard
                </button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    // ==========================================
    // NOTIFICATION BELL (personal user notifications)
    // ==========================================
    function NotificationBell({ user }) {
      const [notifications, setNotifications] = React.useState([]);
      const [unreadCount, setUnreadCount] = React.useState(0);
      const [open, setOpen] = React.useState(false);
      const [loading, setLoading] = React.useState(false);
      const dropdownRef = React.useRef(null);

      const fetchNotifications = React.useCallback(async () => {
        if (!user) return;
        setLoading(true);
        try {
          const res = await apiRequest(`${API_BASE}/notifications`);
          const notifs = Array.isArray(res) ? res : res.notifications || [];
          setNotifications(notifs);
          setUnreadCount(notifs.filter(n => !n.read).length);
        } catch (err) {
          console.error('[Notifications]', err.message);
          setNotifications([]);
          setUnreadCount(0);
        } finally {
          setLoading(false);
        }
      }, [user]);

      React.useEffect(() => {
        fetchNotifications();
      }, [fetchNotifications]);

      React.useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const markAsRead = async (id) => {
        try {
          await apiRequest(`${API_BASE}/notifications/${id}/read`, { method: 'POST' });
          setNotifications(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
          setUnreadCount(prev => Math.max(0, prev - 1));
        } catch (err) {
          console.error('[Notifications] Mark read error:', err.message);
        }
      };

      const handleBellClick = () => {
        setOpen(!open);
        if (!open && unreadCount > 0) {
          // Mark all as read when opening
          notifications.forEach(n => { if (!n.read) markAsRead(n.id); });
        }
      };

      return (
        <div className="relative" ref={dropdownRef}>
          <button
            onClick={handleBellClick}
            className="relative p-2 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-cyan-500/10 border border-transparent hover:border-cyan-400/30 btn-micro transition-all"
          >
            <span className="text-xl">🔔</span>
            {unreadCount > 0 && (
              <span className="absolute -top-1 -right-1 w-5 h-5 bg-cyan-500 rounded-full flex items-center justify-center text-[10px] font-black text-white dark:text-white">
                {unreadCount > 9 ? '9+' : unreadCount}
              </span>
            )}
          </button>
          {open && (
            <div className="absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto bg-slate-900 border border-cyan-500/30 rounded-xl shadow-xl z-50">
              <div className="p-3 border-b border-cyan-500/20 flex items-center justify-between">
                <span className="text-xs font-black text-cyan-300">Notifications</span>
                {notifications.length > 0 && (
                  <button onClick={() => { notifications.forEach(n => markAsRead(n.id)); setOpen(false); }} className="text-[10px] text-slate-400 hover:text-cyan-300">
                    Mark all read
                  </button>
                )}
              </div>
              {loading ? (
                <div className="p-6 text-center text-xs text-slate-400">Loading...</div>
              ) : notifications.length === 0 ? (
                <div className="p-6 text-center text-xs text-slate-400">No notifications</div>
              ) : (
                notifications.map(n => (
                  <div
                    key={n.id}
                    onClick={() => { if (!n.read) markAsRead(n.id); if (n.action) n.action(); }}
                    className={"p-3 border-b border-cyan-500/10 cursor-pointer transition-all " + (n.read ? 'opacity-60' : 'bg-cyan-500/5')}
                  >
                    <div className="flex items-start gap-2">
                      <span className={`text-xs mt-0.5 ${!n.read ? 'text-cyan-400' : 'text-slate-500'}`}>
                        {!n.read ? '●' : '○'}
                      </span>
                      <div className="flex-1">
                        <p className="text-xs font-black text-white dark:text-white">{n.title || n.message}</p>
                        <p className="text-[10px] text-slate-400 mt-0.5">{n.message}</p>
                        <p className="text-[9px] text-slate-500 mt-0.5">
                          {new Date(n.created_at || n.timestamp).toLocaleString()}
                        </p>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen8SkillGap user={user} userId={user.id} onBack={() => navigate('2')} />
                </div>
              </div>
            )}

            {user && screen === '9' && roleAllowed(['trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-electric-blue/10">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen9Trainer userId={user.id} user={user} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </div>
              </div>
            )}

            {user && screen === '10' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-electric-blue/10">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen10CourseMaterials
                    user={user}
                    userId={user.id}
                    courseId={courseId}
                    onBack={() => navigate(user?.role === 'trainer' ? '9' : '2')}
                    onOpenQuiz={() => {
                      if (user?.role === 'trainee') {
                        setCourseId(courseId);
                        navigate('5');
                      }
                    }}
                  />
                </div>
              </div>
            )}

            {user && screen === '11' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-electric-blue/10">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <EditProfile user={user} onBack={() => navigate(user?.role === 'trainer' ? '9' : '2')} />
                </div>
              </div>
            )}

            {user && screen === '12' && roleAllowed(['trainee']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-electric-blue/10">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen12Quiz user={user} onBack={() => navigate('2')} />
                </div>
              </div>
            )}

            {!user && screen !== '0' && screen !== '1' && (
              <div className="max-w-xl mx-auto px-4 py-20 text-center">
                <p className="text-2xl font-extrabold text-white dark:text-white mb-2">Not Signed In</p>
                <p className="text-sm text-slate-300">Please log in to access your dashboard.</p>
                <button onClick={() => setScreen('1')} className="mt-4 px-4 py-2 bg-isro-orange text-white dark:text-white rounded-lg text-xs font-black btn-micro">Go to Login</button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    console.log('React app mounted');
  </script>
</body>
</html>
