  <script type="text/babel">
    // Dynamic API origin
    const API_BASE = window.location.protocol.startsWith('http')
      ? `${window.location.origin}/api`
      : 'http://localhost:5000/api';

    // ==========================================
    // TOAST NOTIFICATION SYSTEM (localStorage)
    // ==========================================
    const TOAST_KEY = 'capacity_connect_toasts';
    const toastListeners = new Set();

    function getToasts() {
      try { return JSON.parse(localStorage.getItem(TOAST_KEY) || '[]'); } catch { return []; }
    }
    function saveToasts(toasts) {
      try { localStorage.setItem(TOAST_KEY, JSON.stringify(toasts)); } catch {}
      toastListeners.forEach(fn => fn(toasts));
    }
    function subscribeToToasts(fn) { toastListeners.add(fn); return () => toastListeners.delete(fn); }
    function showToast(message, type = 'success') {
      const id = Date.now() + Math.random();
      const toasts = getToasts();
      toasts.push({ id, message, type, createdAt: Date.now() });
      if (toasts.length > 5) toasts.shift();
      saveToasts(toasts);
      setTimeout(() => {
        saveToasts(getToasts().filter(t => t.id !== id));
      }, 3000);
    }

    function ToastContainer() {
      const [toasts, setToasts] = React.useState(getToasts());
      React.useEffect(() => subscribeToToasts(setToasts), []);
      if (!toasts.length) return null;
      const colors = {
        success: 'bg-electric-blue text-white',
        error: 'bg-crimson text-white',
        info: 'bg-electric-blue text-white'
      };
      return (
        <div className="fixed top-20 right-4 z-[60] space-y-2 w-80">
          {toasts.map(t => (
            <div key={t.id} className={(colors[t.type] || colors.success) + "px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transition-all duration-300"}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // API HELPERS (with auth token)
    // ==========================================
    function fetchWithToken(url, options = {}) {
      const token = localStorage.getItem('capacity_connect_token');
      const headers = { ...(options.headers || {}) };
      if (options.headers) delete options.headers;
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (options.body && !headers['Content-Type'] && !headers['content-type']) {
        headers['Content-Type'] = 'application/json';
      }
      return fetch(url, { ...options, headers });
    }
    async function apiRequest(url, options = {}) {
      const res = await fetchWithToken(url, options);
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const err = new Error(data?.message || data?.error || 'Request failed');
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ==========================================
    // PROGRESS TRACKING UTILITIES (localStorage)
    // ==========================================
    const PROGRESS_KEY = 'capacity_connect_progress';
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null') || { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null }; } catch { return { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null }; }
    }
    function saveProgress(state) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch {} }
    function getContinueWatching() {
      const progress = loadProgress();
      if (!progress.currentCourseId || !progress.currentLectureId) return null;
      return { courseId: progress.currentCourseId, lectureId: progress.currentLectureId, timestamp: progress.currentTimestamp, completedLectures: progress.completedLectures || [] };
    }

    // ==========================================
    // EMBED URL & PROGRESS HELPERS (kept outside JSX
    // to avoid crashing the in-browser Babel parser)
    // ==========================================
    function getEmbedUrl(url) {
      if (!url) return url;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = url.includes('youtu.be')
          ? url.split('/').pop()
          : url.split('v=')[1]?.split('&')[0];
        return 'https://www.youtube-nocookie.com/embed/' + videoId;
      }
      if (url.includes('vimeo.com')) {
        return 'https://player.vimeo.com/video/' + url.split('/').pop();
      }
      return url;
    }
    function getProgressPercent(completedCount, totalItems) {
      return Math.round((completedCount / Math.max(1, totalItems)) * 100);
    }

    // ==========================================
    // QUIZ POOL (15 questions)
    // ==========================================
    const LOCAL_QUIZ_POOL = [

    function shuffleArray(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function pickRandomQuestions(count = 5) { return shuffleArray(LOCAL_QUIZ_POOL).slice(0, Math.min(count, LOCAL_QUIZ_POOL.length)); }
    function generateAIReport(score, weakTopics) {
      const pct = typeof score === 'string' ? parseInt(score, 10) : score;
      if (pct >= 80) return { badge: `${pct}% - Advanced Competency`, strengths: ['Strong conceptual understanding', 'Correct application of core principles', 'Good decision-making under constraints'], improvements: weakTopics.length ? weakTopics : [], recommendation: 'Proceed to the next track or advanced capstone module.' };
      if (pct >= 50) return { badge: `${pct}% - Intermediate Competency`, strengths: ['Foundational knowledge is present', 'Some complex topics understood'], improvements: weakTopics.length ? weakTopics : ['Some advanced patterns'], recommendation: 'Re-take the module and review the recommended weak-area materials before advancing.' };
      return { badge: `${pct}% - Foundational Gap`, strengths: ['Basic concepts recognized'], improvements: weakTopics.length ? weakTopics : ['Core module content'], recommendation: 'Re-take Module content, review remediation materials, and retake the quiz.' };
    }

    // ==========================================
    // SCREEN 4: COURSE DETAIL (shared)
    // ==========================================
    function Page4Detail({ user, courseId, onBack, onLaunchPlayer }) {
      const [course, setCourse] = React.useState(null);
      const [feedback, setFeedback] = React.useState(null);
      const [feedbackLoading, setFeedbackLoading] = React.useState(true);
      const [rating, setRating] = React.useState(0);
      const [hoverRating, setHoverRating] = React.useState(0);
      const [comment, setComment] = React.useState('');
      const [submitting, setSubmitting] = React.useState(false);
      const [feedbackError, setFeedbackError] = React.useState(null);
      const [feedbackSuccess, setFeedbackSuccess] = React.useState(false);

      React.useEffect(() => {
        apiRequest(`${API_BASE}/courses/detail/${courseId}`).then(setCourse).catch(err => console.error('[Detail]', err.message));
        apiRequest(`${API_BASE}/feedback/course/${courseId}`).then(setFeedback).catch(err => console.error('[Feedback]', err.message)).finally(() => setFeedbackLoading(false));
      }, [courseId]);

      React.useEffect(() => {
        if (feedback?.feedbacks?.length) {
          const own = feedback.feedbacks.find(f => f.isOwn);
          if (own) {
            setRating(own.rating);
            setComment(own.comment || '');
          }
        }
      }, [feedback]);

      const handleSubmitFeedback = async () => {
        if (!rating || rating < 1) { setFeedbackError('Please select a rating.'); return; }
        setSubmitting(true); setFeedbackError(null); setFeedbackSuccess(false);
        try {
          const res = await apiRequest(`${API_BASE}/feedback`, { method: 'POST', body: JSON.stringify({ course_id: courseId, rating, comment }) });
          showToast(res.message || 'Feedback submitted', 'success');
          setFeedbackSuccess(true);
          const updated = await apiRequest(`${API_BASE}/feedback/course/${courseId}`);
          setFeedback(updated);
        } catch (err) { setFeedbackError(err.message); } finally { setSubmitting(false); }
      };

      const renderStars = () => {
        const stars = [];
        for (let i = 1; i <= 5; i++) {
          const filled = (hoverRating || rating) >= i;
          stars.push(<button key={i} type="button" onMouseEnter={() => setHoverRating(i)} onMouseLeave={() => setHoverRating(0)} onClick={() => setRating(i)} className={"text-2xl transition " + (filled ? 'text-isro-orange' : 'text-slate-300 dark:text-slate-300')}>★</button>);
        }
        return stars;
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6 md:py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-black glass-card border border-electric-blue/10 px-3 py-1.5 rounded-lg btn-micro">← Back to Catalog</button>
          {course && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 sm:p-8 space-y-4">
              <span className="text-xs font-black uppercase text-electric-blue">{course.category}</span>
              <h1 className="text-2xl font-extrabold text-white">{course.title}</h1>
              <p className="text-sm text-slate-300">{course.description}</p>
              <p className="text-xs text-slate-400 font-medium">Instructor: <strong>{course.instructor}</strong></p>
              <div className="pt-4 border-t border-electric-blue/5">
                <h3 className="font-black text-xs uppercase text-slate-400 dark:text-slate-400 mb-2">Curriculum Modules</h3>
                <ul className="space-y-1.5 text-xs text-slate-300">
                  {course.syllabus?.map((s, i) => <li key={i} className="p-2 bg-space-blue/20 rounded">Module {i+1}: {s}</li>)}
                </ul>
              </div>
              <button onClick={() => onLaunchPlayer(course.id)} className="px-6 py-2.5 bg-isro-orange text-white rounded-xl text-xs font-black btn-micro">Launch Player ▶</button>

              {user && user.role === 'trainee' && (
                <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                  <h3 className="text-sm font-black text-white">Course Feedback</h3>
                  {feedbackLoading ? (
                    <p className="text-xs text-slate-400">Loading feedback...</p>
                  ) : (
                    <>
                      <div className="flex items-center gap-1">
                        {[1,2,3,4,5].map(i => (<button key={i} type="button" onMouseEnter={() => setHoverRating(i)} onMouseLeave={() => setHoverRating(0)} onClick={() => setRating(i)} className={"text-2xl transition " + ((hoverRating || rating) >= i ? 'text-isro-orange' : 'text-slate-300 dark:text-slate-300')}>★</button>))}
                        {feedback && feedback.avgRating > 0 && <span className="text-xs font-black text-slate-300 ml-2">{feedback.avgRating} avg ({feedback.total} reviews)</span>}
                      </div>
                      <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Share your experience with this course..." className="w-full h-24 px-3.5 py-2 rounded-xl border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm resize-y" />
                      {feedbackError && <p className="text-xs text-crimson font-black">{feedbackError}</p>}
                      {feedbackSuccess && <p className="text-xs text-electric-blue font-black">Feedback saved!</p>}
                      <button onClick={handleSubmitFeedback} disabled={submitting || !rating} className={"px-5 py-2 rounded-xl text-xs font-black btn-micro " + (submitting || !rating ? 'bg-space-blue/50 text-slate-400 cursor-not-allowed' : 'bg-electric-blue hover:bg-electric-blue-dark text-white')}>
                        {submitting ? 'Saving...' : (feedback && feedback.feedbacks?.some(f => f.isOwn) ? 'Update Feedback' : 'Submit Feedback')}
                      </button>
                    </>
                  )}
                  {!feedbackLoading && feedback?.feedbacks?.length > 0 && (
                    <div className="space-y-3 pt-4 border-t border-electric-blue/10">
                      <h4 className="text-xs font-black uppercase text-slate-400">Recent Reviews</h4>
                      {feedback.feedbacks.map(f => (
                        <div key={f.id} className="p-3 rounded-xl bg-space-blue/20 border border-electric-blue/10">
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-xs font-black text-slate-300 dark:text-slate-200">{f.users?.name || 'Trainee'}</span>
                            <span className="text-xs text-isro-orange font-black">{'★'.repeat(f.rating)}</span>
                          </div>
                          {f.comment && <p className="text-xs text-slate-300">{f.comment}</p>}
                          <p className="text-[10px] text-slate-400 mt-1">{new Date(f.created_at).toLocaleDateString()}</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // SCREEN 5: COURSE PLAYER (shared)
    // ==========================================
    function Page5Player({ user, courseId, onBack }) {
      const PASSING_SCORE_THRESHOLD = 80;
      const [player, setPlayer] = React.useState(null);
      const [lectureIndex, setLectureIndex] = React.useState(0);
      const [currentTimestamp, setCurrentTimestamp] = React.useState(0);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);
      const progress = React.useRef(loadProgress());

      const [quizQuestions, setQuizQuestions] = React.useState([]);
      const [quizStarted, setQuizStarted] = React.useState(false);
      const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState({});
      const [quizFinished, setQuizFinished] = React.useState(false);
      const [quizScore, setQuizScore] = React.useState(0);
      const [bestScore, setBestScore] = React.useState(null);
      const [reportModal, setReportModal] = React.useState(null);
      const [revealMode, setRevealMode] = React.useState(false);

      React.useEffect(() => {
        apiRequest(`${API_BASE}/courses/player/${courseId}`).then(setPlayer).catch(err => console.error('[Player]', err.message));
      }, [courseId]);

      React.useEffect(() => {
        const saved = progress.current;
        if (saved.currentCourseId === Number(courseId) && saved.currentLectureId) {
          setLectureIndex(saved.currentLectureId - 1);
          setCurrentTimestamp(saved.currentTimestamp || 0);
        }
      }, [courseId]);

      React.useEffect(() => {
        if (!player || !videoRef.current) return;
        const video = videoRef.current;
        if (currentTimestamp > 0) video.currentTime = currentTimestamp;
      }, [player]);

      React.useEffect(() => {
        if (!player) return;
        const video = videoRef.current;
        if (!video) return;
        const onTimeUpdate = () => {
          if (timerRef.current) return;
          timerRef.current = setTimeout(() => {
            const state = loadProgress();
            state.currentCourseId = Number(courseId);
            state.currentLectureId = lectureIndex + 1;
            state.currentTimestamp = Math.floor(video.currentTime);
            saveProgress(state);
            progress.current = state;
            timerRef.current = null;
          }, 5000);
        };
        const onPause = () => {
          const state = loadProgress();
          state.currentCourseId = Number(courseId);
          state.currentLectureId = lectureIndex + 1;
          state.currentTimestamp = Math.floor(video.currentTime);
          saveProgress(state);
          progress.current = state;
        };
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('pause', onPause);
        return () => {
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('pause', onPause);
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, [player, courseId, lectureIndex]);

      const markComplete = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state);
        progress.current = state;
        setLectureIndex(nextIndex);
        setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
      };

      const startQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setQuizStarted(true); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const handleQuizAnswer = (qIdx, optIdx) => { if (quizFinished) return; setUserAnswers(prev => ({ ...prev, [qIdx]: optIdx })); };
      const finishQuiz = () => {
        let correctCount = 0; const wrongTopics = new Set();
        quizQuestions.forEach((q, i) => { if (userAnswers[i] === q.correctIndex) { correctCount++; } else { wrongTopics.add(q.topic); } });
        const score = Math.round((correctCount / quizQuestions.length) * 100);
        setQuizScore(score);
        setBestScore(prev => (prev === null || score > prev ? score : prev));
        setQuizFinished(true); setRevealMode(true);
        setReportModal(generateAIReport(score, Array.from(wrongTopics)));
      };
      const retakeQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const takeNewQuiz = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state); progress.current = state;
        setLectureIndex(nextIndex); setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
        showToast('Module complete. Loading next module...', 'success');
      };
      const prevQuestion = () => { if (currentQuestionIndex > 0) setCurrentQuestionIndex(prev => prev - 1); };
      const nextQuestion = () => { if (currentQuestionIndex < quizQuestions.length - 1) setCurrentQuestionIndex(prev => prev + 1); };

      const currentQ = quizQuestions[currentQuestionIndex];
      const isFirstQuestion = currentQuestionIndex === 0;
      const isLastQuestion = currentQuestionIndex === quizQuestions.length - 1;
      const allQuestionsAnswered = quizQuestions.every((_, i) => userAnswers[i] !== undefined);

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-black glass-card border border-electric-blue/10 px-3 py-1.5 rounded-lg">← Back</button>
          {player && (
            <div className="space-y-6">
              <div className="glass-card rounded-2xl border border-electric-blue/10 p-6">
                <h1 className="text-2xl font-extrabold text-white">{player.title}</h1>
                <p className="text-xs text-slate-400 mt-1">Module {lectureIndex + 1} of {player.syllabus?.length || 1}</p>
              </div>
              <div className="bg-black rounded-2xl overflow-hidden aspect-video max-h-[420px] flex items-center justify-center">
                <video ref={videoRef} controls src={player.videoUrl} className="w-full h-full object-contain" onPlay={() => setIsPlaying(true)} onPause={() => setIsPlaying(false)} />
              </div>
              <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black text-white">Lecture {lectureIndex + 1}</h2>
                  <button onClick={markComplete} className="px-4 py-2 bg-electric-blue text-white text-xs font-black rounded-lg btn-micro">Mark as Complete</button>
                </div>
                <p className="text-sm text-slate-300">{player.syllabus?.[lectureIndex] || 'Complete this lecture to continue.'}</p>
                <p className="text-[10px] text-slate-400 dark:text-slate-400">Progress auto-saved. Resume time: {Math.floor(currentTimestamp)}s</p>
              </div>

              <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black text-white">Knowledge Check Quiz</h2>
                   {!quizStarted && <button onClick={startQuiz} className="px-4 py-2 bg-isro-orange text-white text-xs font-black rounded-lg btn-micro">Start Quiz</button>}
                </div>

                {quizStarted && quizQuestions.length > 0 && !quizFinished && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-slate-400 dark:text-slate-400 uppercase">Question {currentQuestionIndex + 1} of {quizQuestions.length}</span>
                      <span className="text-xs font-black text-slate-400">{Object.keys(userAnswers).length} of {quizQuestions.length} answered</span>
                    </div>
                    <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{currentQ.question}</p>
                    <div className="space-y-2">
                      {currentQ.options?.map((opt, i) => {
                        const isSelected = userAnswers[currentQuestionIndex] === i;
                        let borderStyle = 'border-electric-blue/10 hover:border-isro-orange glass-card';
                        if (isSelected) borderStyle = 'border-isro-orange bg-electric-blue/10 dark:bg-isro-orange-dark/30';
                        return (
                          <label key={i} className={"flex items-start gap-3 p-3 rounded-xl border-2 transition cursor-pointer " + (borderStyle)}>
                            <input type="radio" name={"q" + currentQuestionIndex} disabled={quizFinished} checked={isSelected} onChange={() => handleQuizAnswer(currentQuestionIndex, i)} className="mt-1 w-4 h-4 text-isro-orange" />
                            <div className="flex-1 text-sm text-slate-800 dark:text-slate-200 leading-snug">{opt}</div>
                          </label>
                        );
                      })}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={prevQuestion} disabled={isFirstQuestion} className="px-4 py-2 bg-space-blue/50 text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Previous Question</button>
                      {isLastQuestion ? (
                        <button onClick={finishQuiz} disabled={!allQuestionsAnswered} className="px-4 py-2 bg-electric-blue text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Finish Quiz & See Results</button>
                      ) : (
                        <button onClick={nextQuestion} disabled={userAnswers[currentQuestionIndex] === undefined} className="px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Next Question</button>
                      )}
                    </div>
                  </div>
                )}

                {quizFinished && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20">
                      <p className="text-xs font-black uppercase text-slate-400">Final Score</p>
                      <p className="text-3xl font-extrabold text-white">{quizScore}%</p>
                      <p className="text-xs text-slate-400">Best attempt: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                    </div>
                    <div className="space-y-2">
                      <p className="text-xs font-black uppercase text-slate-400 dark:text-slate-400">Answer Review</p>
                      {quizQuestions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correctIndex;
                        const isAnswered = userAnswer !== undefined;
                        return (
                          <div key={i} className={"p-3 rounded-xl border-2 " + (isCorrect ? 'border-emerald-500 bg-electric-blue/10 dark:bg-emerald-900/30' : 'border-red-500 bg-crimson/10 dark:bg-red-900/30')}>
                            <p className="text-xs font-semibold text-slate-800 dark:text-slate-200 mb-1">Q{i + 1}: {q.question}</p>
                            <p className="text-xs text-slate-300">Your answer: {isAnswered ? q.options[userAnswer] : 'Not answered'}</p>
                            {!isCorrect && <p className="text-xs text-electric-blue font-black">Correct answer: {q.options[q.correctIndex]}</p>}
                          </div>
                        );
                      })}
                    </div>
                    <div className="flex gap-3">
                      <button onClick={retakeQuiz} className="px-4 py-2 bg-space-blue/50 text-xs font-black rounded-lg btn-micro">Retake Quiz</button>
                      {quizScore >= PASSING_SCORE_THRESHOLD && <button onClick={takeNewQuiz} className="px-4 py-2 bg-electric-blue text-white text-xs font-black rounded-lg btn-micro">Take New Quiz ▶</button>}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {reportModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="glass-card rounded-3xl border border-electric-blue/10 shadow-2xl max-w-2xl w-full p-8 space-y-6">
                <div className="text-center">
                  <p className="text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-400">Quiz Assessment Report</p>
                  <h2 className="text-3xl font-extrabold text-white mt-2">{reportModal.badge}</h2>
                  <p className="text-sm text-slate-400 mt-1">Final Score: {quizScore}% | Best: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                </div>
                <div className="bg-space-blue/20 rounded-2xl border border-electric-blue/10 p-6 space-y-4">
                  <div>
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-400 mb-2">Key Strengths</h3>
                    <ul className="space-y-1">
                      {reportModal.strengths.map((s, i) => (<li key={i} className="text-sm text-slate-300 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-electric-blue/100"></span>{s}</li>))}
                    </ul>
                  </div>
                  <div className="border-t border-electric-blue/10 pt-4">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-400 mb-2">Areas for Improvement</h3>
                    <ul className="space-y-1">
                      {reportModal.improvements.length ? reportModal.improvements.map((s, i) => (<li key={i} className="text-sm text-slate-300 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-crimson/100"></span>{s}</li>)) : <li className="text-sm text-slate-400">No significant weak areas detected.</li>}
                    </ul>
                  </div>
                  <div className="border-t border-electric-blue/10 pt-4">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-400 mb-2">Recommended Next Action</h3>
                    <p className="text-sm text-slate-800 dark:text-slate-200 font-semibold">{reportModal.recommendation}</p>
                  </div>
                </div>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setReportModal(null)} className="px-5 py-2 bg-space-blue/50 text-xs font-black rounded-lg btn-micro">Close Report</button>
                  {quizScore < PASSING_SCORE_THRESHOLD ? (
                    <button onClick={retakeQuiz} className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-black rounded-lg btn-micro">Review & Retake Quiz</button>
                  ) : (
                     <button onClick={takeNewQuiz} className="px-5 py-2 bg-electric-blue text-white text-xs font-black rounded-lg btn-micro">Proceed to Next Module ▶</button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // SCREEN 6: CERTIFICATE (shared)
    // ==========================================

          doc.setFontSize(14);
          doc.text('This is proudly awarded to', 105, 65, { align: 'center' });
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(20);
          doc.text(cert?.studentName || '', 105, 78, { align: 'center' });
          doc.setFont('helvetica', 'normal');

          doc.text(`Grade: ${cert?.grade || ''}`, 105, 105, { align: 'center' });

          doc.text(`Authority: ${cert?.issueAuthority || ''}`, 20, 130);
          doc.text(`Date: ${cert?.completionDate || ''}`, 20, 138);

          <div className="mission-badge rounded-3xl p-8 sm:p-12 text-center bg-space-navy/80">
            <div className="w-14 h-14 bg-electric-blue text-space-black mx-auto flex items-center justify-center text-xl rounded-2xl mb-4 shadow-[0_0_30px_rgba(0,212,255,0.4)]">🎓</div>
            <p className="text-xs font-black uppercase tracking-widest text-electric-blue">Capacity Connect Accreditation</p>
            <h1 className="text-3xl font-serif font-bold text-white mt-2">Certificate of Completion</h1>
            <p className="text-xs text-slate-400 mt-2">This is proudly awarded to</p>
            <h2 className="text-2xl font-black text-electric-blue mt-1 underline decoration-isro-orange underline-offset-4">{cert?.studentName}</h2>
            <div className="my-5 p-3 rounded-xl bg-space-blue/30 border border-electric-blue/20 inline-block max-w-lg">
              <p className="font-black text-white text-sm">{cert?.courseTitle}</p>
              <p className="text-xs text-isro-orange font-black">{cert?.grade}</p>

            <div className="pt-6 border-t border-electric-blue/10 text-xs flex justify-between text-left">
              <div>
                <span className="text-slate-400 font-black uppercase text-[10px]">Authority</span>
                <p className="font-black text-white">{cert?.issueAuthority}</p>
                <p className="text-slate-400">{cert?.completionDate}</p>
              </div>
              <div className="text-right">
                <span className="text-slate-400 font-black uppercase text-[10px]">Certificate ID</span>
                <p className="font-mono font-black text-electric-blue">{cert?.certificateId}</p>
                <p className="text-isro-orange font-semibold">Verified</p>
              </div>
            </div>

          <div className="text-center flex flex-wrap items-center justify-center gap-3">
             <button onClick={downloadPDF} className="px-6 py-2 btn-accent rounded-xl text-xs font-black">⬇ Download PDF</button>

    // ==========================================
    // SCREEN 7: ADMIN DASHBOARD (burgundy/dark theme)
    // ==========================================
    function Screen7Admin({ user, onBack, activeTab, setActiveTab }) {
      const [pendingUsers, setPendingUsers] = React.useState([]);
      const [allUsers, setAllUsers] = React.useState([]);
      const [stats, setStats] = React.useState(null);
      const [loading, setLoading] = React.useState({ pending: true, all: true, stats: true });
      const [processingIds, setProcessingIds] = React.useState(new Set());
      const [feedbackSummary, setFeedbackSummary] = React.useState(null);
      const [feedbackLoading, setFeedbackLoading] = React.useState(false);

      const fetchPendingUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, pending: true }));
        try { setPendingUsers((await apiRequest(`${API_BASE}/admin/pending-users`)).pendingUsers || []); } catch (err) { console.error('[Admin]', err.message); setPendingUsers([]); }
        finally { setLoading(l => ({ ...l, pending: false })); }
      }, []);

      const fetchAllUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, all: true }));
        try { setAllUsers((await apiRequest(`${API_BASE}/admin/users`)).users || []); } catch (err) { console.error('[Admin]', err.message); setAllUsers([]); }
        finally { setLoading(l => ({ ...l, all: false })); }
      }, []);

      const fetchStats = React.useCallback(async () => {
        setLoading(l => ({ ...l, stats: true }));
        try { setStats(await apiRequest(`${API_BASE}/admin/stats`)); } catch (err) { console.error('[Admin]', err.message); setStats(null); }
        finally { setLoading(l => ({ ...l, stats: false })); }
      }, []);

      const fetchFeedbackSummary = React.useCallback(async () => {
        setFeedbackLoading(true);
        try { setFeedbackSummary((await apiRequest(`${API_BASE}/feedback/admin/summary`)).summary || []); } catch (err) { console.error('[Admin] Feedback', err.message); setFeedbackSummary([]); }
        finally { setFeedbackLoading(false); }
      }, []);

      React.useEffect(() => { fetchPendingUsers(); fetchAllUsers(); fetchStats(); }, [fetchPendingUsers, fetchAllUsers, fetchStats]);

      React.useEffect(() => { if (activeTab === 'feedback') fetchFeedbackSummary(); }, [activeTab, fetchFeedbackSummary]);

      const handleApprove = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/approve`, { method: 'POST' });
          showToast('User approved', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'approved' } : u));
        } catch (err) { showToast(`Failed to approve: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const handleReject = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/reject`, { method: 'POST' });
          showToast('User rejected', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'rejected' } : u));
        } catch (err) { showToast(`Failed to reject: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const formatDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return '—'; } };
      const roleBadge = (r) => `<span className="px-2 py-0.5 rounded text-[10px] font-black uppercase ${r === 'admin' ? 'bg-electric-blue-dark text-white' : r === 'trainer' ? 'bg-electric-blue text-white' : 'bg-isro-orange text-white'}">${r}</span>`;
      const statusBadge = (s) => `<span className="px-2 py-0.5 rounded text-[10px] font-black ${s === 'pending' ? 'bg-amber-100 text-amber-800' : s === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${s}</span>`;
      const userDetail = (u) => { const parts = []; if (u.department) parts.push(`Dept: ${u.department}`); if (u.qualification) parts.push(u.qualification); if (u.skills) parts.push(`Skills: ${u.skills}`); if (u.subjects) parts.push(`Subjects: ${u.subjects}`); return parts.length ? parts.join(' • ') : '—'; };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
           <div className="flex justify-between items-center pb-6 border-b border-crimson/10">
             <div>
               <span className="px-2.5 py-0.5 rounded-full text-xs font-black bg-crimson/20 text-crimson border border-crimson/30">Admin Portal • Dashboard</span>
               <h1 className="text-2xl sm:text-3xl font-extrabold text-white mt-1">Capacity Telemetry</h1>
             </div>
             <div className="flex gap-2">
               <button onClick={() => setActiveTab('pending')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'pending' ? 'bg-amber-600 text-white' : 'bg-space-blue/50 text-slate-300')}>Pending Approvals</button>
               <button onClick={() => setActiveTab('all')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'all' ? 'bg-slate-900 text-white' : 'bg-space-blue/50 text-slate-300')}>All Users</button>
               <button onClick={() => setActiveTab('directory')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'directory' ? 'bg-slate-900 text-white' : 'bg-space-blue/50 text-slate-300')}>User Directory</button>
               <button onClick={() => setActiveTab('feedback')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'feedback' ? 'bg-isro-orange text-white' : 'bg-space-blue/50 text-slate-300')}>Feedback</button>
               <button onClick={onBack} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black btn-micro">← Back to Learner View</button>
             </div>
          </div>

          {stats && !loading.stats && (
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="glass-card p-6 rounded-2xl border border-electric-blue/10 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-400 font-black uppercase">Total Workforce</span><p className="text-3xl font-extrabold text-isro-orange mt-2">{stats?.totalUsers}</p></div>
              <div className="glass-card p-6 rounded-2xl border border-electric-blue/10 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-400 font-black uppercase">Active Learners</span><p className="text-3xl font-extrabold text-electric-blue mt-2">{stats?.activeLearners}</p></div>
              <div className="glass-card p-6 rounded-2xl border border-electric-blue/10 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-400 font-black uppercase">Completion Rate</span><p className="text-3xl font-extrabold text-electric-blue mt-2">{stats?.completionRatePercent}%</p></div>
              <div className="glass-card p-6 rounded-2xl border border-electric-blue/10 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-400 font-black uppercase">Total Curriculums</span><p className="text-3xl font-extrabold text-white mt-2">{stats?.totalCourses}</p></div>
            </div>
          )}

          {activeTab === 'pending' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 shadow-sm">
              <h2 className="text-base font-black text-white mb-4">Pending Approvals ({pendingUsers.length})</h2>
              {loading.pending ? (<div className="py-10 text-center text-sm text-slate-400">Loading...</div>) : pendingUsers.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No pending requests.</div>) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead><tr className="border-b border-electric-blue/10 text-slate-400 uppercase"><th className="py-2.5 px-3">Employee</th><th className="py-2.5 px-3">Role</th><th className="py-2.5 px-3">Details</th><th className="py-2.5 px-3">Signup</th><th className="py-2.5 px-3">Actions</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {pendingUsers.map(u => { const isProcessing = processingIds.has(u.id); return (
                        <tr key={u.id} className="hover:bg-space-blue/20">
                          <td className="py-3 px-3 font-bold text-white">{u.name}</td>
                          <td className="py-3 px-3" dangerouslySetInnerHTML={{ __html: roleBadge(u.role) }} />
                          <td className="py-3 px-3 text-slate-300">{userDetail(u)}</td>
                          <td className="py-3 px-3 text-slate-400">{formatDate(u.created_at)}</td>
                          <td className="py-3 px-3 flex gap-2">
                            <button onClick={() => handleApprove(u.id)} disabled={isProcessing} className="px-3 py-1 rounded-lg text-xs font-black bg-electric-blue text-white btn-micro disabled:opacity-60">
                              {isProcessing ? 'Processing...' : 'Approve'}
                            </button>
                            <button onClick={() => handleReject(u.id)} disabled={isProcessing} className="px-3 py-1 rounded-lg text-xs font-black bg-crimson text-white btn-micro disabled:opacity-60">
                              {isProcessing ? 'Processing...' : 'Reject'}
                            </button>
                          </td>
                        </tr>
                      ); })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {activeTab === 'all' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 shadow-sm">
              <h2 className="text-base font-black text-white mb-4">All Users ({allUsers.length})</h2>
              {loading.all ? (<div className="py-10 text-center text-sm text-slate-400">Loading...</div>) : allUsers.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No users found.</div>) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead><tr className="border-b border-electric-blue/10 text-slate-400 uppercase"><th className="py-2.5 px-3">Employee</th><th className="py-2.5 px-3">Email</th><th className="py-2.5 px-3">Role</th><th className="py-2.5 px-3">Status</th><th className="py-2.5 px-3">Dept</th><th className="py-2.5 px-3">Signup</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {allUsers.map(u => (
                        <tr key={u.id} className="hover:bg-space-blue/20">
                          <td className="py-3 px-3 font-bold text-white">{u.name}</td>
                          <td className="py-3 px-3 text-slate-300">{u.email}</td>
                          <td className="py-3 px-3" dangerouslySetInnerHTML={{ __html: roleBadge(u.role) }} />
                          <td className="py-3 px-3" dangerouslySetInnerHTML={{ __html: statusBadge(u.status) }} />
                          <td className="py-3 px-3 text-slate-300">{u.department || '—'}</td>
                          <td className="py-3 px-3 text-slate-400">{formatDate(u.created_at)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {activeTab === 'directory' && stats && !loading.stats && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 shadow-sm">
              <h2 className="text-base font-black text-white mb-4">Enterprise User Directory</h2>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead><tr className="border-b border-electric-blue/10 text-slate-400 uppercase"><th className="py-2.5 px-3">Employee</th><th className="py-2.5 px-3">Department</th><th className="py-2.5 px-3">Role</th><th className="py-2.5 px-3">Progress</th></tr></thead>
                  <tbody className="divide-y divide-slate-100">
                    {stats?.registeredUsers?.map(u => (
                      <tr key={u.id} className="hover:bg-space-blue/20">
                        <td className="py-3 px-3 font-bold text-white">{u.name}</td>
                        <td className="py-3 px-3 text-slate-300">{u.department}</td>
                         <td className="py-3 px-3"><span className="px-2 py-0.5 rounded bg-electric-blue/10 text-electric-blue text-[10px] font-black uppercase">{u.role}</span></td>
                        <td className="py-3 px-3 font-black text-slate-800 dark:text-slate-200">{u.progress}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab === 'feedback' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 p-6 shadow-sm">
              <h2 className="text-base font-black text-white mb-4">Course Feedback Summary</h2>
              {feedbackLoading ? (<div className="py-10 text-center text-sm text-slate-400">Loading feedback...</div>) : !feedbackSummary || feedbackSummary.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No feedback yet.</div>) : (
                <div className="space-y-4">
                  {feedbackSummary.map(s => (
                    <div key={s.course_id} className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20">
                      <div className="flex items-center justify-between mb-2">
                        <h3 className="text-sm font-black text-white">Course ID: {s.course_id}</h3>
                        <span className="text-xs font-black text-isro-orange">{s.avgRating} ★</span>
                      </div>
                      <p className="text-xs text-slate-400 mb-2">{s.total} review{s.total !== 1 ? 's' : ''}</p>
                      <div className="space-y-2">
                        {s.feedbacks.slice(0, 5).map(f => (
                          <div key={f.id} className="p-2 rounded-lg glass-card border border-electric-blue/10">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-black text-slate-300 dark:text-slate-200">{f.users?.name || 'Unknown'}</span>
                              <span className="text-xs text-isro-orange">{'★'.repeat(f.rating)}</span>
                            </div>
                            {f.comment && <p className="text-xs text-slate-300 mt-1">{f.comment}</p>}
                            <p className="text-[10px] text-slate-400 mt-1">{new Date(f.created_at).toLocaleString()}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <AdminCharts />
        </div>
      );
    }

    // ==========================================
    // SCREEN 8: SKILL GAP SCANNER (shared)
    // ==========================================
    function Screen8SkillGap({ user, userId, onBack }) {
      const [resumeText, setResumeText] = React.useState('');
      const [fileName, setFileName] = React.useState('');
      const [scanning, setScanning] = React.useState(false);
      const [result, setResult] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [enrolled, setEnrolled] = React.useState([]);

      const handleFileChange = (e) => { const file = e.target.files?.[0]; if (!file) return; setFileName(file.name); const reader = new FileReader(); reader.onload = (ev) => setResumeText(ev.target.result); reader.readAsText(file); };

      const handleScan = async () => {
        if (!resumeText.trim()) { setError('Please paste your resume/profile text or upload a file.'); return; }
        setScanning(true); setError(null); setResult(null);
        try {
          const data = await apiRequest(`${API_BASE}/ai/skill-gap-analysis`, { method: 'POST', body: JSON.stringify({ resumeText, userId }) });
          setResult(data);
        } catch (err) { setError(err.message); } finally { setScanning(false); }
      };

      const handleEnroll = (courseId, title) => {
        if (enrolled.includes(courseId)) return;
        setEnrolled([...enrolled, courseId]);
        apiRequest(`${API_BASE}/user/enroll`, { method: 'POST', body: JSON.stringify({ userId, courseId }) }).catch(() => {});
        showToast(`Enrolled in: ${title}`, 'success');
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-8">
          <div className="flex items-center justify-between pb-6 border-b border-electric-blue/10">
            <div>
              <span className={"px-2.5 py-0.5 rounded-full text-xs font-black " + (user?.role === 'trainee' ? 'bg-electric-blue/20 text-electric-blue border border-electric-blue/30' : 'bg-isro-orange/20 text-isro-orange border border-isro-orange/30')}>AI Skill Gap Scanner</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white mt-2">Resume / Skill Gap Analysis</h1>
              <p className="text-xs sm:text-sm text-slate-300 mt-1">Upload your profile or paste resume text for AI-powered skill gap analysis and personalized pathway recommendations.</p>
            </div>
            <button onClick={onBack} className="px-4 py-2 bg-space-blue/50 border border-electric-blue/20 text-electric-blue rounded-xl text-xs font-black btn-micro">← Back</button>
          </div>

          <div className="glass-card p-6 space-y-4">
            <div className="flex items-center gap-2">
              <label className="text-sm font-black text-white">Upload Resume:</label>
               <input type="file" accept=".txt,.pdf,.doc,.docx" onChange={handleFileChange} className="text-xs file:mr-3 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-electric-blue/10 file:text-electric-blue hover:file:bg-electric-blue/20" />
               {fileName && <span className="text-xs text-slate-400">{fileName}</span>}
            </div>
            <div>
              <label className="block text-sm font-black text-white mb-1">Or paste resume text:</label>
               <textarea value={resumeText} onChange={(e) => setResumeText(e.target.value)} placeholder="Paste your resume or profile text here..." className="w-full h-32 px-3.5 py-2.5 rounded-xl border border-electric-blue/20 bg-space-black/50 text-sm text-white placeholder-slate-500 resize-y focus:ring-2 focus:ring-electric-blue" disabled={scanning} />
            </div>
            {error && <p className="text-xs text-red-400 font-black">{error}</p>}
             <button onClick={handleScan} disabled={scanning || !resumeText.trim()} className={"px-6 py-2.5 rounded-xl text-xs font-black shadow transition " + (scanning || !resumeText.trim() ? 'bg-space-blue/50 text-slate-400 cursor-not-allowed' : 'btn-accent')}>
              {scanning ? 'Scanning with AI...' : 'Scan for Skills & Recommend Pathways'}
            </button>
          </div>

          {scanning && (<div className="py-20 text-center"><div className="w-10 h-10 border-4 border-isro-orange border-t-transparent rounded-full animate-spin mx-auto"></div><p className="mt-3 text-sm font-medium text-slate-300">AI analyzing resume and identifying skill gaps...</p></div>)}

          {!scanning && result && (
            <div className="space-y-6">
              <div className="glass-card p-6">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-black text-white">Scan Results</h2>
                  <span className={"text-xs px-2 py-1 rounded " + (result.source === 'ai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800')}>{result.source === 'ai' ? 'AI Generated' : 'Sample Data'}</span>
                </div>
                <p className="text-sm text-slate-300 mb-4">{result.summary}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="text-sm font-black text-slate-800 dark:text-slate-200 mb-2">Detected Skills ({result.detectedSkills?.length || 0})</h3>
                    <div className="flex flex-wrap gap-1.5">{result.detectedSkills?.map((s, i) => (<span key={i} className="px-2.5 py-1 bg-electric-blue/10 dark:bg-emerald-900/30 text-emerald-800 text-xs rounded-lg">{s}</span>))}</div>
                    {result.unrecognized_skills && result.unrecognized_skills.length > 0 && (
                      <div className="mt-2 pt-2 border-t border-electric-blue/10">
                        <h4 className="text-[10px] font-black uppercase text-slate-400 dark:text-slate-400 mb-1">Uncategorized Skills</h4>
                        <div className="flex flex-wrap gap-1.5">{result.unrecognized_skills.map((s, i) => (<span key={i} className="px-2 py-0.5 bg-space-blue/50 text-slate-300 text-[10px] font-black rounded">{s}</span>))}</div>
                      </div>
                    )}
                  </div>
                  <div>
                    <h3 className="text-sm font-black text-slate-800 dark:text-slate-200 mb-2">Missing Skills ({result.missingSkills?.length || 0})</h3>
                    <div className="flex flex-wrap gap-1.5">{result.missingSkills?.map((s, i) => (<span key={i} className="px-2.5 py-1 bg-crimson/10 dark:bg-red-900/30 text-red-800 text-xs rounded-lg">{s}</span>))}</div>
                    {result.missing_skills_without_courses && result.missing_skills_without_courses.length > 0 && (
                      <div className="mt-2 pt-2 border-t border-electric-blue/10">
                        <h4 className="text-[10px] font-black uppercase text-slate-400 mb-1">No matching course yet</h4>
                        <div className="flex flex-wrap gap-1.5">{result.missing_skills_without_courses.map((s, i) => (<span key={i} className="px-2 py-0.5 bg-amber-100 text-amber-800 text-[10px] font-black rounded">{s}</span>))}</div>
                      </div>
                    )}
                  </div>
                </div>
                {result.skill_categories && result.skill_categories.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-electric-blue/10">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-400 mb-2">Skill Categories Detected</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {result.skill_categories.map((c, i) => (
                        <span key={i} className="px-2.5 py-1 bg-electric-blue/10 text-electric-blue text-xs rounded-lg">{c}</span>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
                <h3 className="text-base font-black text-white mb-4">Recommended Courses for Auto-Enrollment</h3>
                <div className="space-y-3">{result.recommendedCourses?.map((c) => { const isEnrolled = enrolled.includes(c.courseId);                     const priorityColor = c.priority === 'high' ? 'bg-isro-orange text-white' : c.priority === 'medium' ? 'bg-electric-blue-light text-electric-blue' : 'bg-electric-blue/10 text-slate-300'; return (
                    <div key={c.courseId} className="p-4 rounded-xl border border-electric-blue/10 hover:bg-space-blue/20">
                      <div className="flex items-center justify-between gap-3">
                        <div className="flex-1">
                          <div className="flex items-center gap-2">
                            <span className="px-2 py-0.5 bg-space-blue/30 text-slate-300 text-[10px] font-black rounded">{c.category}</span>
                            <span className={"px-2 py-0.5 text-xs font-black rounded " + priorityColor}>{c.priority}</span>
                            <span className="text-[10px] text-slate-400 dark:text-slate-400">Match: {c.matchScore}%</span>
                          </div>
                          <h4 className="text-sm font-black text-white mt-1">{c.title}</h4>
                          <p className="text-xs text-slate-300 mt-1">{c.reason}</p>
                        </div>
                         <button onClick={() => handleEnroll(c.courseId, c.title)} disabled={isEnrolled} className={"px-3.5 py-1.5 rounded-lg text-xs font-black transition btn-micro " + (isEnrolled ? 'bg-space-blue/30 text-slate-400 cursor-not-allowed' : 'bg-electric-blue hover:bg-electric-blue-dark text-white')}>
                          {isEnrolled ? 'Enrolled ✓' : 'Auto-Enroll'}
                        </button>
                      </div>
                    </div>
                  ); })}</div>
              </div>

              {result.suggestedEnrollments?.length > 0 && (
                <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
                  <h3 className="text-base font-black text-white mb-3">Suggested Learning Pathways</h3>
                  <div className="space-y-2">
                    {result.suggestedEnrollments.map((e, i) => (
                      <div key={e.courseId + '-' + i} className="flex items-center gap-3 p-2.5 rounded-lg bg-space-blue/20 border border-electric-blue/5">
                         <span className="w-6 h-6 rounded-full bg-electric-blue text-white flex items-center justify-center text-xs font-black">{i + 1}</span>
                        <div><span className="text-xs uppercase font-black text-slate-400 dark:text-slate-400">{e.pathway}</span><p className="text-sm font-semibold text-white">{e.title}</p></div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

     // ==========================================
    // SCREEN 9: TRAINER DASHBOARD (table/list-based, indigo theme)
    // ==========================================
    function Screen9Trainer({ userId, user, onNavigate, activeTab, setActiveTab }) {
      const [students, setStudents] = React.useState([]);
      const [loading, setLoading] = React.useState({ roster: true, questions: true, courses: true, materials: true });
      const [questions, setQuestions] = React.useState([]);
      const [courses, setCourses] = React.useState([]);
      const [materials, setMaterials] = React.useState([]);
      const [uploadForm, setUploadForm] = React.useState({ course_id: '', type: 'video', title: '', description: '', url: '', content: '', file: null });
      const [uploadLoading, setUploadLoading] = React.useState(false);

      const fetchStudents = React.useCallback(async () => {
        setLoading(l => ({ ...l, roster: true }));
        try {
          setStudents((await apiRequest(`${API_BASE}/trainer/students`)) || []);
        } catch (err) { console.error('[Trainer]', err.message); setStudents([]); }
        finally { setLoading(l => ({ ...l, roster: false })); }
      }, []);

      const fetchQuestions = React.useCallback(async () => {
        setLoading(l => ({ ...l, questions: true }));
        try {
          setQuestions((await apiRequest(`${API_BASE}/trainer/quiz-questions`)) || []);
        } catch (err) { console.error('[Trainer]', err.message); setQuestions([]); }
        finally { setLoading(l => ({ ...l, questions: false })); }
      }, []);

      const fetchCourses = React.useCallback(async () => {
        setLoading(l => ({ ...l, courses: true }));
        try {
          setCourses((await apiRequest(`${API_BASE}/materials/courses`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setCourses([]); }
        finally { setLoading(l => ({ ...l, courses: false })); }
      }, []);

      const fetchMyMaterials = React.useCallback(async () => {
        setLoading(l => ({ ...l, materials: true }));
        try {
          setMaterials((await apiRequest(`${API_BASE}/materials/my-materials`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setMaterials([]); }
        finally { setLoading(l => ({ ...l, materials: false })); }
      }, []);

      const handleUploadSubmit = async (e) => {
        e.preventDefault();
        if (!uploadForm.course_id || !uploadForm.title) {
          showToast('Please select a course and enter a title.', 'error');
          return;
        }
        setUploadLoading(true);
        try {
          const payload = {
            course_id: uploadForm.course_id,
            type: uploadForm.type,
            title: uploadForm.title.trim(),
            description: uploadForm.description.trim() || null,
            url: uploadForm.url.trim() || null,
            content: uploadForm.content.trim() || null,
          };
          if (uploadForm.file) {
            payload.file_name = uploadForm.file.name;
            payload.mime_type = uploadForm.file.type;
            payload.file_size = uploadForm.file.size;
          }
          await apiRequest(`${API_BASE}/materials`, { method: 'POST', body: JSON.stringify(payload) });
          showToast(`Uploaded ${uploadForm.type} material.`, 'success');
          setUploadForm({ course_id: '', type: 'video', title: '', description: '', url: '', content: '', file: null });
          fetchMyMaterials();
        } catch (err) {
          showToast(`Upload failed: ${err.message}`, 'error');
        } finally {
          setUploadLoading(false);
        }
      };

      const handleDeleteMaterial = async (id) => {
        try {
          await apiRequest(`${API_BASE}/materials/${id}`, { method: 'DELETE' });
          showToast('Material deleted.', 'success');
          fetchMyMaterials();
        } catch (err) {
          showToast(`Delete failed: ${err.message}`, 'error');
        }
      };

      React.useEffect(() => { fetchStudents(); fetchQuestions(); fetchCourses(); fetchMyMaterials(); }, [fetchStudents, fetchQuestions, fetchCourses, fetchMyMaterials]);

      const formatDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return '—'; } };

      const getTypeIcon = (t) => {
        if (t === 'video') return '🎥';
        if (t === 'document') return '📄';
        return '📝';
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
           <div className="flex justify-between items-center pb-6 border-b border-isro-orange/10">
             <div>
               <span className="px-2.5 py-0.5 rounded-full text-xs font-black bg-isro-orange/20 text-isro-orange border border-isro-orange/30">Trainer Portal • Dashboard</span>
               <h1 className="text-2xl sm:text-3xl font-extrabold text-white mt-1">Trainer Dashboard: {user?.name}</h1>
             </div>
            <div className="flex gap-2">
              <button onClick={() => setActiveTab('roster')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'roster' ? 'bg-electric-blue-dark text-white' : 'bg-space-blue/50 text-slate-300')}>Student Roster</button>
              <button onClick={() => setActiveTab('upload')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'upload' ? 'bg-electric-blue-dark text-white' : 'bg-space-blue/50 text-slate-300')}>Upload Content</button>
              <button onClick={() => setActiveTab('my-materials')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'my-materials' ? 'bg-electric-blue-dark text-white' : 'bg-space-blue/50 text-slate-300')}>My Materials</button>
              <button onClick={() => setActiveTab('questions')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'questions' ? 'bg-electric-blue-dark text-white' : 'bg-space-blue/50 text-slate-300')}>Quiz Questions</button>
              <button onClick={() => setActiveTab('courses')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'courses' ? 'bg-electric-blue-dark text-white' : 'bg-space-blue/50 text-slate-300')}>My Courses</button>
            </div>
          </div>

          {activeTab === 'roster' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
              <h2 className="text-base font-black text-white mb-4">Student Roster</h2>
              {loading.roster ? (<div className="py-10 text-center text-sm text-slate-400">Loading roster...</div>) : students.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No students assigned.</div>) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead><tr className="border-b border-electric-blue/10 text-slate-400 dark:text-slate-400 uppercase"><th className="py-2.5 px-3">Student</th><th className="py-2.5 px-3">Email</th><th className="py-2.5 px-3">Department</th><th className="py-2.5 px-3">Enrolled</th><th className="py-2.5 px-3">Progress</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {students.map(s => (
                        <tr key={s.id} className="hover:bg-space-blue/20">
                          <td className="py-3 px-3 font-black text-white">{s.name}</td>
                          <td className="py-3 px-3 text-slate-300">{s.email}</td>
                          <td className="py-3 px-3 text-slate-300">{s.department || '—'}</td>
                          <td className="py-3 px-3 text-slate-400">{formatDate(s.created_at)}</td>
                           <td className="py-3 px-3 font-black text-electric-blue">{s.progress || '0%'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {activeTab === 'upload' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
              <h2 className="text-base font-black text-white mb-4">Upload Learning Content</h2>
              <form onSubmit={handleUploadSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-black text-slate-300 mb-1">Course</label>
                  <select
                    value={uploadForm.course_id}
                    onChange={(e) => setUploadForm({ ...uploadForm, course_id: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white"
                    required
                    disabled={loading.courses}
                  >
                    <option value="">Select a course...</option>
                    {courses.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-300 mb-1">Content Type</label>
                  <div className="flex gap-3">
                    {['video', 'notes', 'document'].map(t => (
                      <label key={t} className="flex items-center gap-2 text-xs">
                        <input
                          type="radio"
                          name="type"
                          value={t}
                          checked={uploadForm.type === t}
                          onChange={(e) => setUploadForm({ ...uploadForm, type: e.target.value })}
                           className="w-4 h-4 text-isro-orange"
                        />
                        <span className={uploadForm.type === t ? 'text-isro-orange font-black' : 'text-slate-300 dark:text-slate-400'}>
                          {t === 'video' ? 'Video URL' : t === 'notes' ? 'Notes Text' : 'Document Link'}
                        </span>
                      </label>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-300 mb-1">Title</label>
                  <input
                    type="text"
                    placeholder="Enter content title..."
                    value={uploadForm.title}
                    onChange={(e) => setUploadForm({ ...uploadForm, title: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-300 mb-1">Description (optional)</label>
                  <textarea
                    value={uploadForm.description}
                    onChange={(e) => setUploadForm({ ...uploadForm, description: e.target.value })}
                    placeholder="Brief description..."
                    className="w-full h-20 px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white resize-y"
                  />
                </div>

                {uploadForm.type === 'video' && (
                  <div>
                    <label className="block text-xs font-black text-slate-300 mb-1">Video URL (YouTube, Vimeo, etc.)</label>
                    <input
                      type="url"
                      placeholder="https://youtube.com/watch?v=..."
                      value={uploadForm.url}
                      onChange={(e) => setUploadForm({ ...uploadForm, url: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white"
                    />
                  </div>
                )}

                {uploadForm.type === 'notes' && (
                  <div>
                    <label className="block text-xs font-black text-slate-300 mb-1">Notes Content</label>
                    <textarea
                      value={uploadForm.content}
                      onChange={(e) => setUploadForm({ ...uploadForm, content: e.target.value })}
                      placeholder="Enter study notes or content here..."
                      className="w-full h-32 px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white resize-y"
                    />
                  </div>
                )}

                {uploadForm.type === 'document' && (
                  <div>
                    <label className="block text-xs font-black text-slate-300 mb-1">Document URL (Google Drive, PDF link, etc.)</label>
                    <input
                      type="url"
                      placeholder="https://drive.google.com/..."
                      value={uploadForm.url}
                      onChange={(e) => setUploadForm({ ...uploadForm, url: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-lg border border-electric-blue/10 bg-white dark:bg-space-blue/30 text-sm text-white"
                    />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={uploadLoading || !uploadForm.course_id || !uploadForm.title}
                  className="px-6 py-2.5 bg-isro-orange hover:bg-isro-orange-dark text-white rounded-xl text-xs font-black disabled:opacity-50 btn-micro"
                >
                  {uploadLoading ? 'Uploading...' : 'Upload Content'}
                </button>
              </form>
            </div>
          )}

          {activeTab === 'my-materials' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
              <h2 className="text-base font-black text-white mb-4">My Uploaded Materials ({materials.length})</h2>
              {loading.materials ? (
                <div className="py-10 text-center text-sm text-slate-400">Loading materials...</div>
              ) : materials.length === 0 ? (
                <div className="py-10 text-center text-sm text-slate-400">No materials uploaded yet. Use the Upload Content tab to add your first.</div>
              ) : (
                <div className="space-y-3">
                  {materials.map(m => (
                    <div key={m.id} className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20 flex items-center justify-between gap-3">
                      <div className="flex-1">
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-lg">{getTypeIcon(m.type)}</span>
                           <span className="px-2 py-0.5 bg-electric-blue/10 text-electric-blue text-[10px] font-black rounded uppercase">{m.type}</span>
                          <span className="px-2 py-0.5 bg-space-blue/50 text-slate-300 text-[10px] font-black rounded">Course: {m.course_id}</span>
                        </div>
                        <h3 className="text-sm font-black text-white">{m.title}</h3>
                        {m.description && <p className="text-xs text-slate-300 mt-1">{m.description}</p>}
                        <p className="text-[10px] text-slate-400 mt-1">{formatDate(m.created_at)}</p>
                      </div>
                      <button
                        onClick={() => handleDeleteMaterial(m.id)}
                        className="px-2.5 py-1 bg-red-100 text-red-800 rounded text-[10px] font-black btn-micro"
                      >
                        Delete
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab === 'questions' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
              <h2 className="text-base font-black text-white mb-4">Quiz Question Bank</h2>
              {loading.questions ? (<div className="py-10 text-center text-sm text-slate-400">Loading questions...</div>) : questions.length === 0 ? (<div className="py-10 text-center text-sm text-slate-400">No questions available. Create your first quiz!</div>) : (
                <div className="space-y-3">
                  {questions.map((q, i) => (
                    <div key={q.id || i} className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-2">
                             <span className="px-2 py-0.5 bg-electric-blue/10 text-electric-blue text-[10px] font-black rounded">{q.topic || 'General'}</span>
                            <span className={"px-2 py-0.5 text-xs font-black rounded " + (q.correct ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800')}>{q.correct !== undefined ? `Answer: ${q.correct}` : 'Unassigned'}</span>
                          </div>
                          <p className="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-2">{q.question}</p>
                          <div className="flex flex-wrap gap-1.5">
                            {q.options?.map((opt, j) => (
                              <span key={j} className={"px-2.5 py-1 text-xs rounded " + (q.correct === j ? 'bg-emerald-100 text-emerald-800 font-black' : 'bg-space-blue/50 text-slate-300')}>{String.fromCharCode(65 + j)}. {opt}</span>
                            ))}
                          </div>
                        </div>
                        <div className="flex flex-col gap-1">
                          <button onClick={() => showToast(`Editing: ${q.question.substring(0, 30)}...`, 'info')} className="px-2.5 py-1 bg-space-blue/50 text-slate-300 rounded text-[10px] font-black btn-micro">Edit</button>
                          <button onClick={() => showToast(`Deleted: ${q.question.substring(0, 30)}...`, 'info')} className="px-2.5 py-1 bg-red-100 text-red-800 rounded text-[10px] font-black btn-micro">Delete</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab === 'courses' && (
            <div className="glass-card rounded-2xl border border-electric-blue/10 shadow-sm p-6">
              <h2 className="text-base font-black text-white mb-4">My Courses</h2>
              <div className="space-y-3">
                <div className="p-4 rounded-xl border border-electric-blue/10 bg-space-blue/20">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-black text-white">Cloud Infrastructure & High-Availability Scaling</h3>
                      <p className="text-xs text-slate-400 mt-1">Course ID: 1 • 12 enrolled students</p>
