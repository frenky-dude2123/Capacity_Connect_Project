  <body class="bg-slate-100 dark:bg-[#1e152e] min-h-screen text-slate-900 dark:text-[#d8d0ff] font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // Dynamic API origin
    const API_BASE = window.location.protocol.startsWith('http')
      ? `${window.location.origin}/api`
      : 'http://localhost:5000/api';

    // ==========================================
    // TOAST NOTIFICATION SYSTEM (localStorage)
    // ==========================================
    const TOAST_KEY = 'capacity_connect_toasts';
    const toastListeners = new Set();

    function getToasts() {
      try { return JSON.parse(localStorage.getItem(TOAST_KEY) || '[]'); } catch { return []; }
    }
    function saveToasts(toasts) {
      try { localStorage.setItem(TOAST_KEY, JSON.stringify(toasts)); } catch {}
      toastListeners.forEach(fn => fn(toasts));
    }
    function subscribeToToasts(fn) { toastListeners.add(fn); return () => toastListeners.delete(fn); }
    function showToast(message, type = 'success') {
      const id = Date.now() + Math.random();
      const toasts = getToasts();
      toasts.push({ id, message, type, createdAt: Date.now() });
      if (toasts.length > 5) toasts.shift();
      saveToasts(toasts);
      setTimeout(() => {
        saveToasts(getToasts().filter(t => t.id !== id));
      }, 3000);
    }

    function ToastContainer() {
      const [toasts, setToasts] = React.useState(getToasts());
      React.useEffect(() => subscribeToToasts(setToasts), []);
      if (!toasts.length) return null;
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-red-600 text-white',
        info: 'bg-blue-900 text-white'
      };
      return (
        <div className="fixed top-20 right-4 z-[60] space-y-2 w-80">
          {toasts.map(t => (
            <div key={t.id} className={(colors[t.type] || colors.success) + "px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transition-all duration-300"}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // API HELPERS (with auth token)
    // ==========================================
    function fetchWithToken(url, options = {}) {
      const token = localStorage.getItem('capacity_connect_token');
      const headers = { ...(options.headers || {}) };
      if (options.headers) delete options.headers;
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return fetch(url, { ...options, headers });
    }
    async function apiRequest(url, options = {}) {
      const res = await fetchWithToken(url, options);
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const err = new Error(data?.message || data?.error || 'Request failed');
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ==========================================
    // PROGRESS TRACKING UTILITIES (localStorage)
    // ==========================================
    const PROGRESS_KEY = 'capacity_connect_progress';
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null') || { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null }; } catch { return { completedLectures: [], currentLectureId: null, currentTimestamp: 0, currentCourseId: null }; }
    }
    function saveProgress(state) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch {} }
    function getContinueWatching() {
      const progress = loadProgress();
      if (!progress.currentCourseId || !progress.currentLectureId) return null;
      return { courseId: progress.currentCourseId, lectureId: progress.currentLectureId, timestamp: progress.currentTimestamp, completedLectures: progress.completedLectures || [] };
    }

    // ==========================================
    // EMBED URL & PROGRESS HELPERS (kept outside JSX
    // to avoid crashing the in-browser Babel parser)
    // ==========================================
    function getEmbedUrl(url) {
      if (!url) return url;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = url.includes('youtu.be')
          ? url.split('/').pop()
          : url.split('v=')[1]?.split('&')[0];
        return 'https://www.youtube-nocookie.com/embed/' + videoId;
      }
      if (url.includes('vimeo.com')) {
        return 'https://player.vimeo.com/video/' + url.split('/').pop();
      }
      return url;
    }
    function getProgressPercent(completedCount, totalItems) {
      return Math.round((completedCount / Math.max(1, totalItems)) * 100);
    }

    // ==========================================
    // QUIZ POOL (15 questions)
    // ==========================================
    const LOCAL_QUIZ_POOL = [
      { id: 'q1', topic: 'Cloud Architecture', question: 'What is the primary benefit of deploying the Circuit Breaker pattern in distributed microservices?', options: ['Preventing cascading service failures by failing fast during downstream outages', 'Directly increasing database throughput by bypassing cache layers', 'Encrypting inter-service payloads using asymmetric cryptography', 'Automatically reducing the size of container images in production'], correctIndex: 0 },
      { id: 'q2', topic: 'Security & Compliance', question: 'Under the principle of Least Privilege (PoLP), how should user and service permissions be assigned?', options: ['Grant broad administrative access to ensure uninterrupted developer productivity', 'Provide only the minimum necessary permissions required to perform specific job duties', 'Delegate root credentials across all members of the incident response team', 'Disable token expiration on internal microservice-to-microservice APIs'], correctIndex: 1 },
      { id: 'q3', topic: 'Distributed Systems', question: 'Which consistency and recovery approach is commonly utilized in the Saga pattern when a step fails?', options: ['Immediate distributed database rollback via distributed locking', 'Executing compensating transactions in reverse order to restore consistency', 'Ignoring downstream service errors and logging a warning', 'Restarting the entire application cluster from cold storage'], correctIndex: 1 },
      { id: 'q4', topic: 'Cloud Architecture', question: 'Which load balancing layer operates at the transport layer and does not inspect HTTP headers?', options: ['Layer 7 reverse proxy', 'Layer 4 load balancer', 'API gateway', 'Service mesh sidecar'], correctIndex: 1 },
      { id: 'q5', topic: 'Security & Compliance', question: 'In ISO 27001, what is the primary purpose of an ISMS?', options: ['To increase cloud storage capacity', 'To systematically manage sensitive company information so it remains secure', 'To replace all firewalls with VPNs', 'To automate software deployments'], correctIndex: 1 },
      { id: 'q6', topic: 'Software Engineering', question: 'What is Domain-Driven Design (DDD) primarily used for?', options: ['Designing database indexes', 'Aligning software architecture with complex business domains', 'Compiling source code faster', 'Managing Kubernetes manifests'], correctIndex: 1 },
      { id: 'q7', topic: 'Cloud Architecture', question: 'Which AWS service is primarily used for auto-scaling compute capacity?', options: ['AWS Lambda', 'Amazon EC2 Auto Scaling', 'Amazon RDS', 'AWS CloudFormation'], correctIndex: 1 },
      { id: 'q8', topic: 'Security & Compliance', question: 'What does Zero Trust architecture assume about network traffic?', options: ['All internal traffic is trusted', 'No traffic is trusted by default, even inside the network', 'Only external traffic is untrusted', 'Trust is based on IP address alone'], correctIndex: 1 },
      { id: 'q9', topic: 'Distributed Systems', question: 'What is the main purpose of the Raft consensus protocol?', options: ['To replace SQL databases', 'To manage a replicated log across distributed nodes', 'To encrypt service communications', 'To render UI components'], correctIndex: 1 },
      { id: 'q10', topic: 'Software Engineering', question: 'Event Sourcing persists state as a sequence of what?', options: ['SQL transactions', 'Immutable events', 'JSON configs', 'HTML templates'], correctIndex: 1 },
      { id: 'q11', topic: 'Cloud Architecture', question: 'What does multi-region active-active failover help achieve?', options: ['Single point of failure', 'Higher availability by running redundant systems simultaneously', 'Lower latency by using one region only', 'Faster database queries'], correctIndex: 1 },
      { id: 'q12', topic: 'Security & Compliance', question: 'Which of the following is a cryptographic key management service?', options: ['AWS KMS', 'AWS S3', 'AWS CloudFront', 'AWS IAM'], correctIndex: 0 },
      { id: 'q13', topic: 'Distributed Systems', question: 'OpenTelemetry primarily provides what capability?', options: ['Database sharding', 'Distributed tracing and observability', 'Container orchestration', 'Identity federation'], correctIndex: 1 },
      { id: 'q14', topic: 'Software Engineering', question: 'Which pattern decomposes a monolith by aligning services with business capabilities?', options: ['Singleton pattern', 'Domain-Driven Design bounded contexts', 'Factory pattern', 'Observer pattern'], correctIndex: 1 },
      { id: 'q15', topic: 'Cloud Architecture', question: 'What is a common use case for a service mesh in Kubernetes?', options: ['Running batch jobs', 'Managing service-to-service communication, retries, and observability', 'Storing secrets', 'Building Docker images'], correctIndex: 1 }
    ];
    function shuffleArray(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function pickRandomQuestions(count = 5) { return shuffleArray(LOCAL_QUIZ_POOL).slice(0, Math.min(count, LOCAL_QUIZ_POOL.length)); }
    function generateAIReport(score, weakTopics) {
      const pct = typeof score === 'string' ? parseInt(score, 10) : score;
      if (pct >= 80) return { badge: `${pct}% - Advanced Competency`, strengths: ['Strong conceptual understanding', 'Correct application of core principles', 'Good decision-making under constraints'], improvements: weakTopics.length ? weakTopics : [], recommendation: 'Proceed to the next track or advanced capstone module.' };
      if (pct >= 50) return { badge: `${pct}% - Intermediate Competency`, strengths: ['Foundational knowledge is present', 'Some complex topics understood'], improvements: weakTopics.length ? weakTopics : ['Some advanced patterns'], recommendation: 'Re-take the module and review the recommended weak-area materials before advancing.' };
      return { badge: `${pct}% - Foundational Gap`, strengths: ['Basic concepts recognized'], improvements: weakTopics.length ? weakTopics : ['Core module content'], recommendation: 'Re-take Module content, review remediation materials, and retake the quiz.' };
    }

    // ==========================================
    // ADMIN ANALYTICS MOCK DATA & CHARTS
    // ==========================================
    const ADMIN_ANALYTICS = {
      monthlyActiveUsers: [{ month: 'Jan', users: 820 }, { month: 'Feb', users: 932 }, { month: 'Mar', users: 901 }, { month: 'Apr', users: 1034 }, { month: 'May', users: 1290 }, { month: 'Jun', users: 1124 }],
      courseCompletionStatus: [{ status: 'Completed', count: 740, color: '#10b981' }, { status: 'In Progress', count: 410, color: '#3b82f6' }, { status: 'Not Started', count: 330, color: '#94a3b8' }]
    };
    function AdminCharts() {
      const barRef = React.useRef(null);
      const pieRef = React.useRef(null);
      React.useEffect(() => {
        if (!barRef.current || !pieRef.current) return;
        const isDark = document.documentElement.classList.contains('dark');
        const gridColor = isDark ? 'rgba(148,163,184,0.2)' : 'rgba(15,23,42,0.1)';
        const textColor = isDark ? '#cbd5e1' : '#334155';
        if (barRef.current.chart) barRef.current.chart.destroy();
        if (pieRef.current.chart) pieRef.current.chart.destroy();
        barRef.current.chart = new Chart(barRef.current, {
          type: 'bar', data: { labels: ADMIN_ANALYTICS.monthlyActiveUsers.map(d => d.month), datasets: [{ label: 'Active Users', data: ADMIN_ANALYTICS.monthlyActiveUsers.map(d => d.users), backgroundColor: '#3b82f6', borderRadius: 8, borderSkipped: false }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor, font: { size: 12 } } } }, scales: { y: { beginAtZero: true, ticks: { color: textColor, stepSize: 200 }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { display: false } } } }
        });
        pieRef.current.chart = new Chart(pieRef.current, {
          type: 'doughnut', data: { labels: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.status), datasets: [{ data: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.count), backgroundColor: ADMIN_ANALYTICS.courseCompletionStatus.map(d => d.color), borderWidth: 2, borderColor: isDark ? '#0f172a' : '#ffffff' }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom', labels: { color: textColor, padding: 16, font: { size: 12 } } }, tooltip: { callbacks: { label: (ctx) => { const total = ctx.dataset.data.reduce((a, b) => a + b, 0); const pct = Math.round((ctx.raw / total) * 100); return `${ctx.label}: ${ctx.raw} (${pct}%)`; } } } } }
        });
        return () => { if (barRef.current?.chart) barRef.current.chart.destroy(); if (pieRef.current?.chart) pieRef.current.chart.destroy(); };
      }, []);
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

    // ==========================================
    const ROLE_THEMES = {
      trainee: 'theme-trainee',

      admin: 'theme-admin',

    const SCREEN_ROLES = {
      '1': ['trainee', 'trainer', 'admin'],
      '2': ['trainee'],
      '3': ['trainee', 'trainer'],
      '4': ['trainee', 'trainer'],
      '5': ['trainee', 'trainer'],
      '6': ['trainee', 'trainer'],
      '7': ['admin'],
      '8': ['trainee', 'trainer'],
      '9': ['trainer'],
      '10': ['trainee', 'trainer'],
    };

    function getRoleScreens(role) {
      return Object.entries(SCREEN_ROLES)
        .filter(([_, roles]) => roles.includes(role))
        .map(([screen]) => screen);
    }

    function getDefaultScreen(role) {
      const map = { trainee: '2', trainer: '9', admin: '7' };
      return map[role] || '1';
    }

    // Sidebar navigation items per role
    const SIDEBAR_ITEMS = {
      trainee: [
        { screen: '2', label: 'My Dashboard', icon: '📊' },
        { screen: '3', label: 'Course Catalog', icon: '📚' },

        { screen: '8', label: 'AI Skill Gap Scanner', icon: '🤖' },
        { screen: '6', label: 'My Certifications', icon: '🎓' },

      trainer: [
        { screen: '9', tab: 'roster', label: 'Trainer Dashboard', icon: '📋' },
        { screen: '3', label: 'Course Catalog', icon: '📚' },

        { screen: '9', tab: 'questions', label: 'Quiz Questions', icon: '❓' },
        { screen: '8', label: 'Skill Gap Scanner', icon: '🤖' },
      ],
      admin: [
        { screen: '7', tab: 'directory', label: 'Admin Dashboard', icon: '📊' },
        { screen: '7', tab: 'pending', label: 'Pending Approvals', icon: '⏳' },
        { screen: '7', tab: 'all', label: 'All Users', icon: '👥' },
        { screen: '7', tab: 'directory', label: 'Analytics', icon: '📈' },

    };

    // ==========================================
    // SIDEBAR COMPONENT
    // ==========================================
    function Sidebar({ user, currentScreen, onNavigate, activeTab, setActiveTab }) {
      const items = SIDEBAR_ITEMS[user?.role] || [];
      const roleLabel = user?.role?.charAt(0).toUpperCase() + user?.role?.slice(1) || '';
      return (
        <div className="sidebar-bg flex flex-col h-full w-64 border-r border-slate-200 dark:border-slate-700 overflow-y-auto">

            <div className="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 flex items-center justify-center text-xl border border-slate-200 dark:border-slate-700">
              {user?.role === 'trainee' ? '🎓' : user?.role === 'trainer' ? '👩‍🏫' : '🛡️'}
            </div>
            <div>
              <p className="font-bold text-sm text-slate-900 dark:text-slate-100">{user?.name || 'Unknown'}</p>
              <p className="text-[10px] text-slate-500 dark:text-slate-400">{roleLabel} Portal</p>
            </div>
          </div>
          <nav className="flex-1 py-2 space-y-0.5">
            {items.map((item) => {
                const isActive = user?.role === 'admin'
                  ? (activeTab === item.tab)
                  : (currentScreen === item.screen && (!item.tab || activeTab === item.tab));
              return (
                <button
                  key={user?.role + '-' + item.label}
                  onClick={() => {
                    if (item.tab) {
                      setActiveTab(item.tab);
                    }
                    onNavigate(item.screen);
                  }}
                  className={"sidebar-item flex items-center gap-3 px-4 py-2.5 text-xs rounded-lg mx-2 transition-all btn-micro " + (isActive ? 'sidebar-item-active font-semibold' : '')}
                >
                  <span className="text-base">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
          <div className="p-4 border-t border-slate-200 dark:border-slate-700">
            <button
              onClick={() => { try { localStorage.removeItem('capacity_connect_token'); } catch {} window.location.reload(); }}
              className="sidebar-item w-full flex items-center justify-center gap-2 px-4 py-2.5 text-xs font-bold rounded-lg btn-micro"
            >
              <span>🚪</span> Sign Out
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // ROLE PORTAL LAYOUT WRAPPER
    // ==========================================
    function RolePortal({ user, currentScreen, onNavigate, activeTab, setActiveTab, children }) {
      const themeClass = ROLE_THEMES[user?.role] || '';

      if (!user) return <div className="pt-16">{children}</div>;

      return (
        <div className={"theme-wrapper " + (themeClass) + "flex h-screen overflow-hidden"}>  
          <aside className="hidden md:flex">
            <Sidebar
              user={user}
              currentScreen={currentScreen}
              onNavigate={onNavigate}
              activeTab={activeTab}
              setActiveTab={setActiveTab}
            />
          </aside>
          <main className="flex-1 overflow-y-auto portal-bg text-slate-900 dark:text-slate-100">
            {children}
          </main>
        </div>
      );

    // ==========================================

    function Screen1Auth({ onAuthSuccess, onNavigate }) {
      const [isLogin, setIsLogin] = React.useState(true);
      const [email, setEmail] = React.useState('jane.doe@enterprise.com');
      const [password, setPassword] = React.useState('password123');
      const [name, setName] = React.useState('Jane Doe');
      const [signupRole, setSignupRole] = React.useState('trainee');
      const [qualification, setQualification] = React.useState('');
      const [skills, setSkills] = React.useState('');
      const [subjects, setSubjects] = React.useState('');

            </div>

            <div className="mb-4 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl flex gap-2">
                <button onClick={() => { setEmail('jane.doe@enterprise.com'); setPassword('password123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-300 btn-micro">🎓 Trainee Demo</button>

                <button onClick={() => { setEmail('admin@capacityconnect.io'); setPassword('admin123'); setIsLogin(true); }} className="px-2.5 py-1 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-purple-800 dark:text-purple-300 btn-micro">🛡️ Admin Demo</button>

               <input type="email" required placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100" />
               <input type="password" required placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100" />

              {!isLogin && (
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Sign up as</label>
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setSignupRole('trainee')} className={"flex-1 py-2 rounded-lg border-2 text-xs font-black transition " + (signupRole === 'trainee' ? 'border-teal-900 bg-teal-50 dark:bg-teal-900/30 text-teal-800 dark:text-teal-200' : 'border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-400')}>Trainee</button>

                    </div>
                  )}
                </div>
              )}

              {error && <p className="text-xs text-red-400 font-semibold">{error}</p>}

              <button type="submit" disabled={loading} className="w-full py-2.5 bg-blue-900 hover:bg-blue-800 text-white rounded-xl text-xs font-black shadow-md btn-micro">
                {loading ? 'Submitting...' : isLogin ? 'Sign In' : 'Create Account'}

            </form>

            {authData && (

    // ==========================================
    // SCREEN 5: COURSE PLAYER (shared)
    // ==========================================
    function Page5Player({ user, courseId, onBack }) {
      const PASSING_SCORE_THRESHOLD = 80;
      const [player, setPlayer] = React.useState(null);
      const [lectureIndex, setLectureIndex] = React.useState(0);
      const [currentTimestamp, setCurrentTimestamp] = React.useState(0);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);
      const progress = React.useRef(loadProgress());

      const [quizQuestions, setQuizQuestions] = React.useState([]);
      const [quizStarted, setQuizStarted] = React.useState(false);
      const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState({});
      const [quizFinished, setQuizFinished] = React.useState(false);
      const [quizScore, setQuizScore] = React.useState(0);
      const [bestScore, setBestScore] = React.useState(null);
      const [reportModal, setReportModal] = React.useState(null);
      const [revealMode, setRevealMode] = React.useState(false);

      React.useEffect(() => {
        apiRequest(`${API_BASE}/courses/player/${courseId}`).then(setPlayer).catch(err => console.error('[Player]', err.message));
      }, [courseId]);

      React.useEffect(() => {
        const saved = progress.current;
        if (saved.currentCourseId === Number(courseId) && saved.currentLectureId) {
          setLectureIndex(saved.currentLectureId - 1);
          setCurrentTimestamp(saved.currentTimestamp || 0);
        }
      }, [courseId]);

      React.useEffect(() => {
        if (!player || !videoRef.current) return;
        const video = videoRef.current;
        if (currentTimestamp > 0) video.currentTime = currentTimestamp;
      }, [player]);

      React.useEffect(() => {
        if (!player) return;
        const video = videoRef.current;
        if (!video) return;
        const onTimeUpdate = () => {
          if (timerRef.current) return;
          timerRef.current = setTimeout(() => {
            const state = loadProgress();
            state.currentCourseId = Number(courseId);
            state.currentLectureId = lectureIndex + 1;
            state.currentTimestamp = Math.floor(video.currentTime);
            saveProgress(state);
            progress.current = state;
            timerRef.current = null;
          }, 5000);
        };
        const onPause = () => {
          const state = loadProgress();
          state.currentCourseId = Number(courseId);
          state.currentLectureId = lectureIndex + 1;
          state.currentTimestamp = Math.floor(video.currentTime);
          saveProgress(state);
          progress.current = state;
        };
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('pause', onPause);
        return () => {
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('pause', onPause);
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, [player, courseId, lectureIndex]);

      const markComplete = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state);
        progress.current = state;
        setLectureIndex(nextIndex);
        setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
      };

      const startQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setQuizStarted(true); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const handleQuizAnswer = (qIdx, optIdx) => { if (quizFinished) return; setUserAnswers(prev => ({ ...prev, [qIdx]: optIdx })); };
      const finishQuiz = () => {
        let correctCount = 0; const wrongTopics = new Set();
        quizQuestions.forEach((q, i) => { if (userAnswers[i] === q.correctIndex) { correctCount++; } else { wrongTopics.add(q.topic); } });
        const score = Math.round((correctCount / quizQuestions.length) * 100);
        setQuizScore(score);
        setBestScore(prev => (prev === null || score > prev ? score : prev));
        setQuizFinished(true); setRevealMode(true);
        setReportModal(generateAIReport(score, Array.from(wrongTopics)));
      };
      const retakeQuiz = () => { const questions = pickRandomQuestions(5); setQuizQuestions(questions); setCurrentQuestionIndex(0); setUserAnswers({}); setQuizFinished(false); setReportModal(null); setRevealMode(false); };
      const takeNewQuiz = () => {
        const state = loadProgress();
        state.completedLectures = state.completedLectures || [];
        if (!state.completedLectures.includes(lectureIndex + 1)) state.completedLectures.push(lectureIndex + 1);
        const nextIndex = lectureIndex + 1;
        state.currentCourseId = Number(courseId);
        state.currentLectureId = nextIndex + 1;
        state.currentTimestamp = 0;
        saveProgress(state); progress.current = state;
        setLectureIndex(nextIndex); setCurrentTimestamp(0);
        setQuizStarted(false); setQuizFinished(false); setQuizQuestions([]); setUserAnswers({}); setBestScore(null); setReportModal(null); setRevealMode(false);
        showToast('Module complete. Loading next module...', 'success');
      };
      const prevQuestion = () => { if (currentQuestionIndex > 0) setCurrentQuestionIndex(prev => prev - 1); };
      const nextQuestion = () => { if (currentQuestionIndex < quizQuestions.length - 1) setCurrentQuestionIndex(prev => prev + 1); };

      const currentQ = quizQuestions[currentQuestionIndex];
      const isFirstQuestion = currentQuestionIndex === 0;
      const isLastQuestion = currentQuestionIndex === quizQuestions.length - 1;
      const allQuestionsAnswered = quizQuestions.every((_, i) => userAnswers[i] !== undefined);

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-black bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg">← Back</button>
          {player && (
            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
                <h1 className="text-2xl font-extrabold text-slate-900 dark:text-slate-100">{player.title}</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Module {lectureIndex + 1} of {player.syllabus?.length || 1}</p>
              </div>
              <div className="bg-black rounded-2xl overflow-hidden aspect-video max-h-[420px] flex items-center justify-center">
                <video ref={videoRef} controls src={player.videoUrl} className="w-full h-full object-contain" onPlay={() => setIsPlaying(true)} onPause={() => setIsPlaying(false)} />
              </div>
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black text-slate-900 dark:text-slate-100">Lecture {lectureIndex + 1}</h2>
                  <button onClick={markComplete} className="px-4 py-2 bg-emerald-600 text-white text-xs font-black rounded-lg btn-micro">Mark as Complete</button>
                </div>
                <p className="text-sm text-slate-600 dark:text-slate-300">{player.syllabus?.[lectureIndex] || 'Complete this lecture to continue.'}</p>
                <p className="text-[10px] text-slate-400 dark:text-slate-500">Progress auto-saved. Resume time: {Math.floor(currentTimestamp)}s</p>
              </div>

              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black text-slate-900 dark:text-slate-100">Knowledge Check Quiz</h2>
                  {!quizStarted && <button onClick={startQuiz} className="px-4 py-2 bg-blue-900 text-white text-xs font-black rounded-lg btn-micro">Start Quiz</button>}
                </div>

                {quizStarted && quizQuestions.length > 0 && !quizFinished && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase">Question {currentQuestionIndex + 1} of {quizQuestions.length}</span>
                      <span className="text-xs font-black text-slate-500 dark:text-slate-400">{Object.keys(userAnswers).length} of {quizQuestions.length} answered</span>
                    </div>
                    <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{currentQ.question}</p>
                    <div className="space-y-2">
                      {currentQ.options?.map((opt, i) => {
                        const isSelected = userAnswers[currentQuestionIndex] === i;
                        let borderStyle = 'border-slate-200 dark:border-slate-700 hover:border-indigo-400 bg-white dark:bg-slate-900';
                        if (isSelected) borderStyle = 'border-indigo-700 bg-indigo-50 dark:bg-indigo-900/30';
                        return (
                          <label key={i} className={"flex items-start gap-3 p-3 rounded-xl border-2 transition cursor-pointer " + (borderStyle)}>
                            <input type="radio" name={"q" + currentQuestionIndex} disabled={quizFinished} checked={isSelected} onChange={() => handleQuizAnswer(currentQuestionIndex, i)} className="mt-1 w-4 h-4 text-indigo-600" />
                            <div className="flex-1 text-sm text-slate-800 dark:text-slate-200 leading-snug">{opt}</div>
                          </label>
                        );
                      })}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={prevQuestion} disabled={isFirstQuestion} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Previous Question</button>
                      {isLastQuestion ? (
                        <button onClick={finishQuiz} disabled={!allQuestionsAnswered} className="px-4 py-2 bg-indigo-600 text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Finish Quiz & See Results</button>
                      ) : (
                        <button onClick={nextQuestion} disabled={userAnswers[currentQuestionIndex] === undefined} className="px-4 py-2 bg-slate-900 text-white text-xs font-black rounded-lg disabled:opacity-40 disabled:cursor-not-allowed btn-micro">Next Question</button>
                      )}
                    </div>
                  </div>
                )}

                {quizFinished && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                      <p className="text-xs font-black uppercase text-slate-500 dark:text-slate-400">Final Score</p>
                      <p className="text-3xl font-extrabold text-slate-900 dark:text-slate-100">{quizScore}%</p>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Best attempt: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                    </div>
                    <div className="space-y-2">
                      <p className="text-xs font-black uppercase text-slate-400 dark:text-slate-500">Answer Review</p>
                      {quizQuestions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correctIndex;
                        const isAnswered = userAnswer !== undefined;
                        return (
                          <div key={i} className={"p-3 rounded-xl border-2 " + (isCorrect ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30' : 'border-red-500 bg-red-50 dark:bg-red-900/30')}>
                            <p className="text-xs font-semibold text-slate-800 dark:text-slate-200 mb-1">Q{i + 1}: {q.question}</p>
                            <p className="text-xs text-slate-600 dark:text-slate-300">Your answer: {isAnswered ? q.options[userAnswer] : 'Not answered'}</p>
                            {!isCorrect && <p className="text-xs text-emerald-700 font-black">Correct answer: {q.options[q.correctIndex]}</p>}
                          </div>
                        );
                      })}
                    </div>
                    <div className="flex gap-3">
                      <button onClick={retakeQuiz} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-black rounded-lg btn-micro">Retake Quiz</button>
                      {quizScore >= PASSING_SCORE_THRESHOLD && <button onClick={takeNewQuiz} className="px-4 py-2 bg-emerald-600 text-white text-xs font-black rounded-lg btn-micro">Take New Quiz ▶</button>}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {reportModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-2xl max-w-2xl w-full p-8 space-y-6">
                <div className="text-center">
                  <p className="text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500">Quiz Assessment Report</p>
                  <h2 className="text-3xl font-extrabold text-slate-900 dark:text-slate-100 mt-2">{reportModal.badge}</h2>
                  <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Final Score: {quizScore}% | Best: {bestScore !== null && bestScore !== undefined ? bestScore : quizScore}%</p>
                </div>
                <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                  <div>
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-500 mb-2">Key Strengths</h3>
                    <ul className="space-y-1">
                      {reportModal.strengths.map((s, i) => (<li key={i} className="text-sm text-slate-700 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>{s}</li>))}
                    </ul>
                  </div>
                  <div className="border-t border-slate-200 dark:border-slate-700 pt-4">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-500 mb-2">Areas for Improvement</h3>
                    <ul className="space-y-1">
                      {reportModal.improvements.length ? reportModal.improvements.map((s, i) => (<li key={i} className="text-sm text-slate-700 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>{s}</li>)) : <li className="text-sm text-slate-500 dark:text-slate-400">No significant weak areas detected.</li>}
                    </ul>
                  </div>
                  <div className="border-t border-slate-200 dark:border-slate-700 pt-4">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-500 mb-2">Recommended Next Action</h3>
                    <p className="text-sm text-slate-800 dark:text-slate-200 font-semibold">{reportModal.recommendation}</p>
                  </div>
                </div>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setReportModal(null)} className="px-5 py-2 bg-slate-200 dark:bg-slate-700 text-xs font-black rounded-lg btn-micro">Close Report</button>
                  {quizScore < PASSING_SCORE_THRESHOLD ? (
                    <button onClick={retakeQuiz} className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-black rounded-lg btn-micro">Review & Retake Quiz</button>
                  ) : (
                    <button onClick={takeNewQuiz} className="px-5 py-2 bg-blue-900 text-white text-xs font-black rounded-lg btn-micro">Proceed to Next Module ▶</button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // SCREEN 7: ADMIN DASHBOARD (burgundy/dark theme)
    // ==========================================
    function Screen7Admin({ user, onBack, activeTab, setActiveTab }) {
      const [pendingUsers, setPendingUsers] = React.useState([]);
      const [allUsers, setAllUsers] = React.useState([]);
      const [stats, setStats] = React.useState(null);
      const [loading, setLoading] = React.useState({ pending: true, all: true, stats: true });
      const [processingIds, setProcessingIds] = React.useState(new Set());

      const fetchPendingUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, pending: true }));
        try { setPendingUsers((await apiRequest(`${API_BASE}/admin/pending-users`)).pendingUsers || []); } catch (err) { console.error('[Admin]', err.message); setPendingUsers([]); }
        finally { setLoading(l => ({ ...l, pending: false })); }
      }, []);

      const fetchAllUsers = React.useCallback(async () => {
        setLoading(l => ({ ...l, all: true }));
        try { setAllUsers((await apiRequest(`${API_BASE}/admin/users`)).users || []); } catch (err) { console.error('[Admin]', err.message); setAllUsers([]); }
        finally { setLoading(l => ({ ...l, all: false })); }
      }, []);

      const fetchStats = React.useCallback(async () => {
        setLoading(l => ({ ...l, stats: true }));
        try { setStats(await apiRequest(`${API_BASE}/admin/stats`)); } catch (err) { console.error('[Admin]', err.message); setStats(null); }
        finally { setLoading(l => ({ ...l, stats: false })); }
      }, []);

      React.useEffect(() => { fetchPendingUsers(); fetchAllUsers(); fetchStats(); }, [fetchPendingUsers, fetchAllUsers, fetchStats]);

      const handleApprove = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/approve`, { method: 'POST' });
          showToast('User approved', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'approved' } : u));
        } catch (err) { showToast(`Failed to approve: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const handleReject = async (userId) => {
        setProcessingIds(prev => new Set([...prev, userId]));
        try {
          await apiRequest(`${API_BASE}/admin/users/${userId}/reject`, { method: 'POST' });
          showToast('User rejected', 'success');
          setPendingUsers(prev => prev.filter(u => u.id !== userId));
          setAllUsers(prev => prev.map(u => u.id === userId ? { ...u, status: 'rejected' } : u));
        } catch (err) { showToast(`Failed to reject: ${err.message}`, 'error'); }
        finally { setProcessingIds(prev => { const c = new Set(prev); c.delete(userId); return c; }); }
      };

      const formatDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return '—'; } };
      const roleBadge = (r) => `<span className="px-2 py-0.5 rounded text-[10px] font-black uppercase ${r === 'admin' ? 'bg-rose-900 text-white' : r === 'trainer' ? 'bg-indigo-900 text-white' : 'bg-teal-900 text-white'}">${r}</span>`;

      const userDetail = (u) => { const parts = []; if (u.department) parts.push(`Dept: ${u.department}`); if (u.qualification) parts.push(u.qualification); if (u.skills) parts.push(`Skills: ${u.skills}`); if (u.subjects) parts.push(`Subjects: ${u.subjects}`); return parts.length ? parts.join(' • ') : '—'; };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-8">
          <div className="flex justify-between items-center pb-6 border-b border-slate-200 dark:border-slate-700">

            </div>
            <div className="flex gap-2">
              <button onClick={() => setActiveTab('pending')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'pending' ? 'bg-amber-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>Pending Approvals</button>

              <button onClick={() => setActiveTab('directory')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'directory' ? 'bg-slate-900 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>User Directory</button>
              <button onClick={onBack} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black btn-micro">← Back to Learner View</button>
            </div>
          </div>

          {stats && !loading.stats && (
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-500 font-black uppercase">Total Workforce</span><p className="text-3xl font-extrabold text-rose-700 mt-2">{stats?.totalUsers}</p></div>
              <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-500 font-black uppercase">Active Learners</span><p className="text-3xl font-extrabold text-blue-900 mt-2">{stats?.activeLearners}</p></div>
              <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm"><span className="text-xs text-slate-400 dark:text-slate-500 font-black uppercase">Completion Rate</span><p className="text-3xl font-extrabold text-emerald-600 mt-2">{stats?.completionRatePercent}%</p></div>

                    <tbody className="divide-y divide-slate-100">
                      {pendingUsers.map(u => { const isProcessing = processingIds.has(u.id); return (

                  </table>

            </div>
          )}

          {activeTab === 'all' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm">
              <h2 className="text-base font-black text-slate-900 dark:text-slate-100 mb-4">All Users ({allUsers.length})</h2>

    // SCREEN 8: SKILL GAP SCANNER (shared)

    function Screen8SkillGap({ user, userId, onBack }) {
      const [resumeText, setResumeText] = React.useState('');
      const [fileName, setFileName] = React.useState('');
      const [scanning, setScanning] = React.useState(false);
      const [result, setResult] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [enrolled, setEnrolled] = React.useState([]);

      const handleFileChange = (e) => { const file = e.target.files?.[0]; if (!file) return; setFileName(file.name); const reader = new FileReader(); reader.onload = (ev) => setResumeText(ev.target.result); reader.readAsText(file); };

      const handleScan = async () => {
        if (!resumeText.trim()) { setError('Please paste your resume/profile text or upload a file.'); return; }
        setScanning(true); setError(null); setResult(null);
        try {
          const data = await apiRequest(`${API_BASE}/ai/skill-gap-analysis`, { method: 'POST', body: JSON.stringify({ resumeText, userId }) });
          setResult(data);
        } catch (err) { setError(err.message); } finally { setScanning(false); }
      };

      const handleEnroll = (courseId, title) => {
        if (enrolled.includes(courseId)) return;
        setEnrolled([...enrolled, courseId]);
        apiRequest(`${API_BASE}/user/enroll`, { method: 'POST', body: JSON.stringify({ userId, courseId }) }).catch(() => {});
        showToast(`Enrolled in: ${title}`, 'success');
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-8">
          <div className="flex items-center justify-between pb-6 border-b border-slate-200 dark:border-slate-700">
            <div>
              <span className={"px-2.5 py-0.5 rounded-full text-xs font-black " + (user?.role === 'trainee' ? 'bg-teal-100 text-teal-900' : 'bg-indigo-100 text-indigo-900')}>AI Skill Gap Scanner</span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-slate-100 mt-2">Resume / Skill Gap Analysis</h1>
              <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mt-1">Upload your profile or paste resume text for AI-powered skill gap analysis and personalized pathway recommendations.</p>
            </div>
            <button onClick={onBack} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black btn-micro">← Back</button>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-4">
            <div className="flex items-center gap-2">
              <label className="text-sm font-black text-slate-700">Upload Resume:</label>
              <input type="file" accept=".txt,.pdf,.doc,.docx" onChange={handleFileChange} className="text-xs file:mr-3 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-800 hover:file:bg-indigo-100" />
              {fileName && <span className="text-xs text-slate-500 dark:text-slate-400">{fileName}</span>}
            </div>
            <div>
              <label className="block text-sm font-black text-slate-700 mb-1">Or paste resume text:</label>
              <textarea value={resumeText} onChange={(e) => setResumeText(e.target.value)} placeholder="Paste your resume or profile text here..." className="w-full h-32 px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm resize-y focus:ring-2 focus:ring-indigo-300" disabled={scanning} />
            </div>
            {error && <p className="text-xs text-red-600 font-black">{error}</p>}
            <button onClick={handleScan} disabled={scanning || !resumeText.trim()} className={"px-6 py-2.5 rounded-xl text-xs font-black shadow transition " + (scanning || !resumeText.trim() ? 'bg-slate-200 dark:bg-slate-700 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white')}>
              {scanning ? 'Scanning with AI...' : 'Scan for Skills & Recommend Pathways'}
            </button>
          </div>

          {scanning && (<div className="py-20 text-center"><div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div><p className="mt-3 text-sm font-medium text-slate-600 dark:text-slate-300">AI analyzing resume and identifying skill gaps...</p></div>)}

          {!scanning && result && (
            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-black text-slate-900 dark:text-slate-100">Scan Results</h2>
                  <span className={"text-xs px-2 py-1 rounded " + (result.source === 'ai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800')}>{result.source === 'ai' ? 'AI Generated' : 'Sample Data'}</span>
                </div>
                <p className="text-sm text-slate-600 dark:text-slate-300 mb-4">{result.summary}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="text-sm font-black text-slate-800 dark:text-slate-200 mb-2">Detected Skills ({result.detectedSkills?.length || 0})</h3>
                    <div className="flex flex-wrap gap-1.5">{result.detectedSkills?.map((s, i) => (<span key={i} className="px-2.5 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-800 text-xs rounded-lg">{s}</span>))}</div>
                    {result.unrecognized_skills && result.unrecognized_skills.length > 0 && (
                      <div className="mt-2 pt-2 border-t border-slate-200 dark:border-slate-700">
                        <h4 className="text-[10px] font-black uppercase text-slate-400 dark:text-slate-500 mb-1">Uncategorized Skills</h4>
                        <div className="flex flex-wrap gap-1.5">{result.unrecognized_skills.map((s, i) => (<span key={i} className="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-700 text-[10px] font-black rounded">{s}</span>))}</div>
                      </div>

                  </div>

                    <h3 className="text-sm font-black text-slate-800 dark:text-slate-200 mb-2">Missing Skills ({result.missingSkills?.length || 0})</h3>

                    {result.missing_skills_without_courses && result.missing_skills_without_courses.length > 0 && (
                      <div className="mt-2 pt-2 border-t border-slate-200 dark:border-slate-700">
                        <h4 className="text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1">No matching course yet</h4>
                        <div className="flex flex-wrap gap-1.5">{result.missing_skills_without_courses.map((s, i) => (<span key={i} className="px-2 py-0.5 bg-amber-100 text-amber-800 text-[10px] font-black rounded">{s}</span>))}</div>
                      </div>
                    )}
                  </div>
                </div>
                {result.skill_categories && result.skill_categories.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                    <h3 className="text-xs font-black uppercase text-slate-400 dark:text-slate-500 mb-2">Skill Categories Detected</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {result.skill_categories.map((c, i) => (
                        <span key={i} className="px-2.5 py-1 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-800 text-xs rounded-lg">{c}</span>

              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                <h3 className="text-base font-black text-slate-900 dark:text-slate-100 mb-4">Recommended Courses for Auto-Enrollment</h3>
                <div className="space-y-3">{result.recommendedCourses?.map((c) => { const isEnrolled = enrolled.includes(c.courseId); const priorityColor = c.priority === 'high' ? 'bg-red-100 text-red-800' : c.priority === 'medium' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'; return (

                      <div className="flex items-center justify-between gap-3">

                            <span className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-700 text-[10px] font-black rounded">{c.category}</span>

                            <span className="text-[10px] text-slate-400 dark:text-slate-500">Match: {c.matchScore}%</span>
                          </div>
                          <h4 className="text-sm font-black text-slate-900 dark:text-slate-100 mt-1">{c.title}</h4>
                          <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">{c.reason}</p>
                        </div>
                        <button onClick={() => handleEnroll(c.courseId, c.title)} disabled={isEnrolled} className={"px-3.5 py-1.5 rounded-lg text-xs font-black transition btn-micro " + (isEnrolled ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white')}>
                          {isEnrolled ? 'Enrolled ✓' : 'Auto-Enroll'}

                    </div>

              </div>

              {result.suggestedEnrollments?.length > 0 && (
                <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
                  <h3 className="text-base font-black text-slate-900 dark:text-slate-100 mb-3">Suggested Learning Pathways</h3>
                  <div className="space-y-2">
                    {result.suggestedEnrollments.map((e, i) => (
                      <div key={e.courseId + '-' + i} className="flex items-center gap-3 p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-100">

                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );

      const [uploadLoading, setUploadLoading] = React.useState(false);

      }, []);

      const fetchQuestions = React.useCallback(async () => {
        setLoading(l => ({ ...l, questions: true }));
        try {
          setQuestions((await apiRequest(`${API_BASE}/trainer/quiz-questions`)) || []);
        } catch (err) { console.error('[Trainer]', err.message); setQuestions([]); }
        finally { setLoading(l => ({ ...l, questions: false })); }
      }, []);

      const fetchCourses = React.useCallback(async () => {
        setLoading(l => ({ ...l, courses: true }));
        try {
          setCourses((await apiRequest(`${API_BASE}/materials/courses`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setCourses([]); }
        finally { setLoading(l => ({ ...l, courses: false })); }
      }, []);

      const fetchMyMaterials = React.useCallback(async () => {
        setLoading(l => ({ ...l, materials: true }));
        try {
          setMaterials((await apiRequest(`${API_BASE}/materials/my-materials`)) || []);
        } catch (err) { console.error('[Materials]', err.message); setMaterials([]); }
        finally { setLoading(l => ({ ...l, materials: false })); }
      }, []);

      const handleUploadSubmit = async (e) => {
        e.preventDefault();
        if (!uploadForm.course_id || !uploadForm.title) {
          showToast('Please select a course and enter a title.', 'error');
          return;
        }
        setUploadLoading(true);
        try {
          const payload = {
            course_id: uploadForm.course_id,
            type: uploadForm.type,
            title: uploadForm.title.trim(),
            description: uploadForm.description.trim() || null,
            url: uploadForm.url.trim() || null,
            content: uploadForm.content.trim() || null,
          };
          if (uploadForm.file) {
            payload.file_name = uploadForm.file.name;
            payload.mime_type = uploadForm.file.type;
            payload.file_size = uploadForm.file.size;
          }
          await apiRequest(`${API_BASE}/materials`, { method: 'POST', body: JSON.stringify(payload) });
          showToast(`Uploaded ${uploadForm.type} material.`, 'success');
          setUploadForm({ course_id: '', type: 'video', title: '', description: '', url: '', content: '', file: null });
          fetchMyMaterials();

          showToast(`Upload failed: ${err.message}`, 'error');
        } finally {
          setUploadLoading(false);
        }
      };

      const handleDeleteMaterial = async (id) => {
        try {
          await apiRequest(`${API_BASE}/materials/${id}`, { method: 'DELETE' });
          showToast('Material deleted.', 'success');
          fetchMyMaterials();
        } catch (err) {
          showToast(`Delete failed: ${err.message}`, 'error');
        }

      React.useEffect(() => { fetchStudents(); fetchQuestions(); fetchCourses(); fetchMyMaterials(); }, [fetchStudents, fetchQuestions, fetchCourses, fetchMyMaterials]);

      const formatDate = (d) => { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return '—'; } };

      const getTypeIcon = (t) => {
        if (t === 'video') return '🎥';
        if (t === 'document') return '📄';
        return '📝';

      return (

              <button onClick={() => setActiveTab('upload')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'upload' ? 'bg-indigo-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>Upload Content</button>
              <button onClick={() => setActiveTab('my-materials')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'my-materials' ? 'bg-indigo-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>My Materials</button>
              <button onClick={() => setActiveTab('questions')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'questions' ? 'bg-indigo-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>Quiz Questions</button>
              <button onClick={() => setActiveTab('courses')} className={"px-4 py-2 rounded-xl text-xs font-black transition " + (activeTab === 'courses' ? 'bg-indigo-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')}>My Courses</button>
            </div>
          </div>

          {activeTab === 'roster' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">

              {loading.roster ? (<div className="py-10 text-center text-sm text-slate-500">Loading roster...</div>) : students.length === 0 ? (<div className="py-10 text-center text-sm text-slate-500">No students assigned.</div>) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead><tr className="border-b border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 uppercase"><th className="py-2.5 px-3">Student</th><th className="py-2.5 px-3">Email</th><th className="py-2.5 px-3">Department</th><th className="py-2.5 px-3">Enrolled</th><th className="py-2.5 px-3">Progress</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {students.map(s => (
                        <tr key={s.id} className="hover:bg-slate-50 dark:bg-slate-800">

                          <td className="py-3 px-3 text-slate-600 dark:text-slate-300">{s.email}</td>
                          <td className="py-3 px-3 text-slate-600 dark:text-slate-300">{s.department || '—'}</td>
                          <td className="py-3 px-3 text-slate-500">{formatDate(s.created_at)}</td>
                          <td className="py-3 px-3 font-black text-indigo-700">{s.progress || '0%'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {activeTab === 'upload' && (

              <form onSubmit={handleUploadSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Course</label>
                  <select
                    value={uploadForm.course_id}
                    onChange={(e) => setUploadForm({ ...uploadForm, course_id: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100"
                    required
                    disabled={loading.courses}
                  >
                    <option value="">Select a course...</option>
                    {courses.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Content Type</label>
                  <div className="flex gap-3">
                    {['video', 'notes', 'document'].map(t => (
                      <label key={t} className="flex items-center gap-2 text-xs">
                        <input
                          type="radio"
                          name="type"
                          value={t}
                          checked={uploadForm.type === t}
                          onChange={(e) => setUploadForm({ ...uploadForm, type: e.target.value })}
                          className="w-4 h-4 text-indigo-600"
                        />
                        <span className={uploadForm.type === t ? 'text-indigo-600 font-black' : 'text-slate-600 dark:text-slate-400'}>
                          {t === 'video' ? 'Video URL' : t === 'notes' ? 'Notes Text' : 'Document Link'}
                        </span>
                      </label>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Title</label>
                  <input
                    type="text"
                    placeholder="Enter content title..."
                    value={uploadForm.title}
                    onChange={(e) => setUploadForm({ ...uploadForm, title: e.target.value })}
                    className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Description (optional)</label>
                  <textarea
                    value={uploadForm.description}
                    onChange={(e) => setUploadForm({ ...uploadForm, description: e.target.value })}
                    placeholder="Brief description..."
                    className="w-full h-20 px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100 resize-y"
                  />
                </div>

                {uploadForm.type === 'video' && (
                  <div>
                    <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Video URL (YouTube, Vimeo, etc.)</label>
                    <input
                      type="url"
                      placeholder="https://youtube.com/watch?v=..."
                      value={uploadForm.url}
                      onChange={(e) => setUploadForm({ ...uploadForm, url: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100"
                    />
                  </div>
                )}

                {uploadForm.type === 'notes' && (
                  <div>
                    <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Notes Content</label>
                    <textarea
                      value={uploadForm.content}
                      onChange={(e) => setUploadForm({ ...uploadForm, content: e.target.value })}
                      placeholder="Enter study notes or content here..."
                      className="w-full h-32 px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100 resize-y"
                    />
                  </div>
                )}

                {uploadForm.type === 'document' && (
                  <div>
                    <label className="block text-xs font-black text-slate-700 dark:text-slate-300 mb-1">Document URL (Google Drive, PDF link, etc.)</label>
                    <input
                      type="url"
                      placeholder="https://drive.google.com/..."
                      value={uploadForm.url}
                      onChange={(e) => setUploadForm({ ...uploadForm, url: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100"
                    />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={uploadLoading || !uploadForm.course_id || !uploadForm.title}
                  className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-black disabled:opacity-50 btn-micro"
                >
                  {uploadLoading ? 'Uploading...' : 'Upload Content'}
                </button>
              </form>
            </div>
          )}

          {activeTab === 'my-materials' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
              <h2 className="text-base font-black text-slate-900 dark:text-slate-100 mb-4">My Uploaded Materials ({materials.length})</h2>
              {loading.materials ? (
                <div className="py-10 text-center text-sm text-slate-500">Loading materials...</div>
              ) : materials.length === 0 ? (
                <div className="py-10 text-center text-sm text-slate-500">No materials uploaded yet. Use the Upload Content tab to add your first.</div>
              ) : (
                <div className="space-y-3">
                  {materials.map(m => (
                    <div key={m.id} className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex items-center justify-between gap-3">
                      <div className="flex-1">
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-lg">{getTypeIcon(m.type)}</span>
                          <span className="px-2 py-0.5 bg-indigo-100 text-indigo-800 text-[10px] font-black rounded uppercase">{m.type}</span>
                          <span className="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-700 text-[10px] font-black rounded">Course: {m.course_id}</span>
                        </div>
                        <h3 className="text-sm font-black text-slate-900 dark:text-slate-100">{m.title}</h3>
                        {m.description && <p className="text-xs text-slate-600 dark:text-slate-300 mt-1">{m.description}</p>}
                        <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">{formatDate(m.created_at)}</p>
                      </div>
                      <button
                        onClick={() => handleDeleteMaterial(m.id)}
                        className="px-2.5 py-1 bg-red-100 text-red-800 rounded text-[10px] font-black btn-micro"
                      >
                        Delete
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeTab === 'questions' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
              <h2 className="text-base font-black text-slate-900 dark:text-slate-100 mb-4">Quiz Question Bank</h2>
              {loading.questions ? (<div className="py-10 text-center text-sm text-slate-500">Loading questions...</div>) : questions.length === 0 ? (<div className="py-10 text-center text-sm text-slate-500">No questions available. Create your first quiz!</div>) : (
                <div className="space-y-3">
                  {questions.map((q, i) => (
                    <div key={q.id || i} className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-2">
                            <span className="px-2 py-0.5 bg-indigo-100 text-indigo-800 text-[10px] font-black rounded">{q.topic || 'General'}</span>
                            <span className={"px-2 py-0.5 text-xs font-black rounded " + (q.correct ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800')}>{q.correct !== undefined ? `Answer: ${q.correct}` : 'Unassigned'}</span>
                          </div>
                          <p className="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-2">{q.question}</p>
                          <div className="flex flex-wrap gap-1.5">
                            {q.options?.map((opt, j) => (
                              <span key={j} className={"px-2.5 py-1 text-xs rounded " + (q.correct === j ? 'bg-emerald-100 text-emerald-800 font-black' : 'bg-slate-200 dark:bg-slate-700 text-slate-600')}>{String.fromCharCode(65 + j)}. {opt}</span>
                            ))}
                          </div>
                        </div>
                        <div className="flex flex-col gap-1">
                          <button onClick={() => showToast(`Editing: ${q.question.substring(0, 30)}...`, 'info')} className="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-700 rounded text-[10px] font-black btn-micro">Edit</button>
                          <button onClick={() => showToast(`Deleted: ${q.question.substring(0, 30)}...`, 'info')} className="px-2.5 py-1 bg-red-100 text-red-800 rounded text-[10px] font-black btn-micro">Delete</button>

                      </div>
                    </div>

                </div>

            </div>
          )}

          {activeTab === 'courses' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6">
              <h2 className="text-base font-black text-slate-900 dark:text-slate-100 mb-4">My Courses</h2>

                <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">

                    <div>
                      <h3 className="text-sm font-black text-slate-900 dark:text-slate-100">Cloud Infrastructure & High-Availability Scaling</h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Course ID: 1 • 12 enrolled students</p>

              </div>

        </div>
