    // ==========================================
    // SCREEN 10: COURSE MATERIALS (trainee view, teal/emerald theme)
    // ==========================================
    function Screen10CourseMaterials({ user, userId, courseId, onBack, onOpenQuiz }) {
      const [course, setCourse] = React.useState(null);
      const [materials, setMaterials] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [activeType, setActiveType] = React.useState('all');

      React.useEffect(() => {
        setLoading(true);
        Promise.all([
          apiRequest(`${API_BASE}/courses/detail/${courseId}`).then(setCourse).catch(err => console.error('[Materials]', err.message)),
          apiRequest(`${API_BASE}/materials/course/${courseId}`).then(setMaterials).catch(err => console.error('[Materials]', err.message))
        ]).finally(() => setLoading(false));
      }, [courseId]);

      const getTypeIcon = (t) => {
        if (t === 'video') return '🎥';
        if (t === 'document') return '📄';
        return '📝';
      };

      const getTypeColor = (t) => {
        if (t === 'video') return 'bg-blue-100 text-blue-800';
        if (t === 'document') return 'bg-purple-100 text-purple-800';
        return 'bg-emerald-100 text-emerald-800';
      };

      const filtered = materials.filter(m => activeType === 'all' || m.type === activeType);
      const videos = materials.filter(m => m.type === 'video');
      const documents = materials.filter(m => m.type === 'document');
      const notes = materials.filter(m => m.type === 'notes');

      return (
        <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 space-y-6">
          <button onClick={onBack} className="text-xs font-black bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg btn-micro">← Back to Dashboard</button>

          {loading ? (
            <div className="py-10 text-center text-sm text-slate-500 dark:text-slate-400">Loading course materials...</div>
          ) : (
            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
                <h1 className="text-2xl font-extrabold text-slate-900 dark:text-slate-100">{course?.title || 'Course Materials'}</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Instructor: {course?.instructor || 'N/A'}</p>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-1">
                {[
                  { key: 'all', label: 'All Content' },
                  { key: 'video', label: '🎥 Videos' },
                  { key: 'notes', label: '📝 Notes' },
                  { key: 'document', label: '📄 Documents' }
                ].map(t => (
                  <button
                    key={t.key}
                    onClick={() => setActiveType(t.key)}
                    className={"px-4 py-2 rounded-lg text-xs font-black whitespace-nowrap btn-micro transition " + (activeType === t.key ? 'bg-teal-900 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700')}
                  >
                    {t.label}
                  </button>
                ))}
              </div>

              {filtered.length === 0 ? (
                <div className="py-12 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <div className="text-4xl mb-2">📂</div>
                  <p className="text-sm text-slate-500 dark:text-slate-400">No {activeType === 'all' ? '' : "'" + activeType + "' "}materials available for this course yet.</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {filtered.map(m => (
                    <div key={m.id} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6">
                      <div className="flex items-start gap-4">
                        <span className="text-2xl flex-shrink-0 mt-1">{getTypeIcon(m.type)}</span>
                        <div className="flex-1">
                          <div className="flex items-center gap-2 mb-2 flex-wrap">
                            <span className={"px-2 py-0.5 text-xs font-black rounded " + getTypeColor(m.type)}>{m.type.toUpperCase()}</span>
                            <span className="text-xs text-slate-400 dark:text-slate-500">{new Date(m.created_at).toLocaleDateString()}</span>
                          </div>
                          <h2 className="text-lg font-black text-slate-900 dark:text-slate-100 mb-2">{m.title}</h2>
                          {m.description && <p className="text-sm text-slate-600 dark:text-slate-300 mb-3">{m.description}</p>}

                          {m.type === 'video' && m.url && (
                            <div className="mb-3">
                              {m.url.includes('youtube.com') || m.url.includes('youtu.be') || m.url.includes('vimeo.com') ? (
                                <div className="aspect-video bg-black rounded-xl overflow-hidden">
                                  <iframe
                                    src={getEmbedUrl(m.url)}
                                    className="w-full h-full"
                                    allowFullScreen
                                    title={m.title}
                                  />
                                </div>
                              ) : (
                                <video
                                  src={m.url}
                                  controls
                                  className="w-full rounded-xl aspect-video bg-black"
                                  title={m.title}
                                />
                              )}
                            </div>
                          )}

                          {m.type === 'notes' && m.content && (
                            <div className="bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 mb-3 max-h-64 overflow-y-auto">
                              <pre className="text-xs text-slate-700 dark:text-slate-300 whitespace-pre-wrap break-words">{m.content}</pre>
                            </div>
                          )}

                          {m.type === 'document' && m.url && (
                            <div className="mb-3">
                              <a
                                href={m.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-2 px-4 py-2 bg-teal-900 text-white rounded-xl text-xs font-black btn-micro"
                              >
                                📥 Download / View Document
                              </a>
                            </div>
                          )}

                          {m.file_name && (
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">File: {m.file_name}</p>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}

                  {user?.role === 'trainee' && [
                    { label: '📋 Quiz: Module Assessment', action: () => onOpenQuiz && onOpenQuiz() },
                    { label: '📋 Quiz: Security Fundamentals', action: () => onOpenQuiz && onOpenQuiz() }
                  ].map((quiz, i) => (
                    <div key={i} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <span className="text-2xl">❓</span>
                          <div>
                            <h3 className="text-sm font-black text-slate-900 dark:text-slate-100">{quiz.label}</h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400">5 questions • 10 min estimate</p>
                          </div>
                        </div>
                        <button
                          onClick={quiz.action}
                          className="px-4 py-2 bg-teal-900 text-white rounded-xl text-xs font-black btn-micro"
                        >
                          Take Quiz
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // THEME MANAGEMENT
    // ==========================================
    const THEME_KEY = 'capacity_connect_theme';
    function getInitialTheme() { try { const stored = localStorage.getItem(THEME_KEY); if (stored === 'dark' || stored === 'light') return stored; } catch {} return 'light'; }
    function applyTheme(theme) { const root = document.documentElement; if (theme === 'dark') root.classList.add('dark'); else root.classList.remove('dark'); }
    applyTheme(getInitialTheme());

    // ==========================================
    // ROOT APP with STRICT ROLE ISOLATION
    // ==========================================
    function App() {
      const [screen, setScreen] = React.useState('1');
      const [courseId, setCourseId] = React.useState(1);
      const [user, setUser] = React.useState(null);
      const [theme, setTheme] = React.useState(getInitialTheme);
      const [activeAdminTab, setActiveAdminTab] = React.useState('pending');

      const toggleTheme = () => {
        setTheme(prev => {
          const next = prev === 'light' ? 'dark' : 'light';
          try { localStorage.setItem(THEME_KEY, next); } catch {}
          applyTheme(next);
          return next;
        });
      };

      const roleAllowed = (allowedRoles) => !!user && allowedRoles.includes(user.role);

      /**
       * STRICT role isolation: navigate() checks whether the target screen
       * is valid for the current user's role. If not, redirect to the
       * user's own default dashboard.
       */
      const navigate = (target) => {
        if (!user) { setScreen('1'); return; }
        const allowed = SCREEN_ROLES[target];
        if (!allowed || !allowed.includes(user.role)) {
          setScreen(getDefaultScreen(user.role));
          return;
        }
        setScreen(target);
      };

      // Enforce strict role isolation on every render:
      // If the current screen is not in the user's allowed set, redirect.
      React.useEffect(() => {
        if (!user) return;
        const allowed = SCREEN_ROLES[screen];
        if (!allowed || !allowed.includes(user.role)) {
          setScreen(getDefaultScreen(user.role));
        }
      }, [screen, user]);

      // Set default tab per role when user logs in
      React.useEffect(() => {
        if (!user) return;
        if (user.role === 'admin') setActiveAdminTab('pending');
        if (user.role === 'trainer') setActiveAdminTab('roster');
      }, [user]);

      const themeClass = user ? ROLE_THEMES[user.role] : '';

      return (
        <div className={"theme-wrapper " + (themeClass) + (theme === 'dark' ? 'dark' : '')}>
          {!user && (
            <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="w-8 h-8 rounded-xl bg-blue-900 text-white flex items-center justify-center font-black text-xs">CC</span>
                  <div><span className="font-black text-sm text-slate-900 dark:text-slate-100">Capacity Connect</span><span className="text-[10px] text-slate-400 dark:text-slate-500 block">Not signed in</span></div>
                </div>
                <button onClick={toggleTheme} className={"px-2.5 py-1.5 rounded-lg " + (theme === 'dark' ? 'bg-slate-800 text-yellow-300 border border-slate-600' : 'bg-white text-blue-950 shadow-sm border border-slate-200') + "btn-micro"}>
                  {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                </button>
              </div>
            </header>
          )}

          {user && (
            <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="w-8 h-8 rounded-xl bg-blue-900 text-white flex items-center justify-center font-black text-xs">CC</span>
                  <div>
                    <span className="font-black text-sm text-slate-900 dark:text-slate-100">Capacity Connect</span>
                    <span className="text-[10px] text-slate-400 dark:text-slate-500 block">{user.name} ({user.role})</span>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={toggleTheme} className={"px-2.5 py-1.5 rounded-lg " + (theme === 'dark' ? 'bg-slate-800 text-yellow-300 border border-slate-600' : 'bg-white text-blue-950 shadow-sm border border-slate-200') + "btn-micro"}>
                    {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                  </button>
                </div>
              </div>
            </header>
          )}

          <main className="pb-16 min-h-[calc(100vh-88px)]">
            <ToastContainer />
            {screen === '1' && <Screen1Auth onAuthSuccess={(d) => { if (d.user) setUser(d.user); setScreen(getDefaultScreen(d.user?.role)); }} onNavigate={navigate} />}

            {/* Strict role isolation: each screen is only rendered if the user's role matches */}
            {user && screen === '2' && roleAllowed(['trainee']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen2Dashboard userId={user.id} onOpenCourse={(id) => { setCourseId(id); navigate('5'); }} onOpenCert={(id) => { setCourseId(id); navigate('6'); }} onOpenCatalog={() => navigate('3')} />
                </div>
              </div>
            )}

            {user && screen === '3' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Page3Catalog user={user} onSelectCourse={(id) => { setCourseId(id); navigate('4'); }} onLaunchPlayer={(id) => { setCourseId(id); navigate('5'); }} />
                </div>
              </div>
            )}

            {user && screen === '4' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Page4Detail user={user} courseId={courseId} onBack={() => navigate('3')} onLaunchPlayer={(id) => { setCourseId(id); navigate('5'); }} />
                </div>
              </div>
            )}

            {user && screen === '5' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Page5Player user={user} courseId={courseId} onBack={() => navigate('2')} />
                </div>
              </div>
            )}

            {user && screen === '6' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen6Certificate user={user} userId={user.id} courseId={courseId} onBack={() => navigate('2')} />
                </div>
              </div>
            )}

            {user && screen === '7' && roleAllowed(['admin']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen7Admin user={user} onBack={() => navigate('2')} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </div>
              </div>
            )}

            {user && screen === '8' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen8SkillGap user={user} userId={user.id} onBack={() => navigate('2')} />
                </div>
              </div>
            )}

            {user && screen === '9' && roleAllowed(['trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen9Trainer userId={user.id} user={user} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </div>
              </div>
            )}

            {user && screen === '10' && roleAllowed(['trainee', 'trainer']) && (
              <div className="flex">
                <aside className="hidden md:block w-64 border-r border-slate-200 dark:border-slate-700">
                  <Sidebar user={user} currentScreen={screen} onNavigate={navigate} activeTab={activeAdminTab} setActiveTab={setActiveAdminTab} />
                </aside>
                <div className="flex-1 overflow-y-auto">
                  <Screen10CourseMaterials
                    user={user}
                    userId={user.id}
                    courseId={courseId}
                    onBack={() => navigate(user?.role === 'trainer' ? '9' : '2')}
                    onOpenQuiz={() => {
                      if (user?.role === 'trainee') {
                        setCourseId(courseId);
                        navigate('5');
                      }
                    }}
                  />
                </div>
              </div>
            )}

            {!user && screen !== '1' && (
              <div className="max-w-xl mx-auto px-4 py-20 text-center">
                <p className="text-2xl font-extrabold text-slate-900 dark:text-slate-100 mb-2">Not Signed In</p>
                <p className="text-sm text-slate-600 dark:text-slate-300">Please log in to access your dashboard.</p>
                <button onClick={() => setScreen('1')} className="mt-4 px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-black btn-micro">Go to Login</button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
